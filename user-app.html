    }).join('');
    var staffOpts='<option value="">— เลือกพนักงาน —</option>'+(PO.staff||[]).map(function(m){
      return '<option value="'+esc(m.uid)+'"'+((cur&&cur.payeeUid===m.uid)?' selected':'')+'>'+esc(m.display||m.name)+'</option>';
    }).join('');
    modal('<h3>'+(PO_EDIT?'✏️ แก้ใบจ่าย '+esc(PO_EDIT):'💵 ตั้งเรื่องจ่ายเงิน')+'</h3><div id="mErr" class="m-err hidden"></div>'+
      '<div class="fld"><label>บริษัทผู้จ่าย</label><select id="poEnt">'+entOpts+'</select></div>'+
      '<div class="fld"><label>ประเภทค่าใช้จ่าย</label><select id="poType" onchange="poTypeChange()">'+typeOpts+'</select></div>'+
      '<div class="fld"><label>รายละเอียด (จ่ายค่าอะไร)</label><textarea id="poDetail" placeholder="เช่น ค่าเช่าออฟฟิศชั้น 2">'+esc(cur?cur.detail:'')+'</textarea></div>'+
      '<div class="fld"><label>งวด / เดือนที่เกี่ยวข้อง (ไม่บังคับ)</label><input id="poPeriod" placeholder="เช่น ส.ค. 2569" value="'+esc(cur?cur.period:'')+'"></div>'+
      '<div class="fld"><label>จ่ายให้ใคร</label><div style="display:flex;gap:6px">'+
        '<button type="button" id="poPOut" class="btn btn-sm" onclick="poPayeeMode(\'out\')" style="flex:1">🏢 คนนอก / บริษัท</button>'+
        '<button type="button" id="poPStaff" class="btn btn-sm" onclick="poPayeeMode(\'staff\')" style="flex:1">👥 พนักงานเรา</button>'+
      '</div></div>'+
      '<div id="poStaffBox" class="hidden"><div class="fld"><label>เลือกพนักงาน</label>'+
        '<select id="poStaff" onchange="poStaffPick()">'+staffOpts+'</select>'+
        '<div id="poStaffBank" class="m-hint" style="margin-top:6px"></div></div></div>'+
      '<div class="fld"><label>ผู้รับเงินเป็น</label><select id="poKind" onchange="poCalc()">'+kindOpts+'</select></div>'+
      '<div class="fld"><label>ชื่อผู้รับเงิน</label><input id="poName" placeholder="ชื่อบริษัท หรือ ชื่อ-นามสกุล" value="'+esc(cur?cur.payeeName:'')+'"></div>'+
      '<div class="fld"><label>เลขประจำตัวผู้เสียภาษี / บัตร ปชช (13 หลัก)</label>'+
        '<input id="poId" type="tel" inputmode="numeric" maxlength="17" placeholder="บังคับเมื่อหักภาษี ณ ที่จ่าย" value="'+esc(cur?cur.payeeId:'')+'"></div>'+
      '<div class="fld"><label>ที่อยู่ผู้รับเงิน</label><textarea id="poAddr" placeholder="บังคับเมื่อหักภาษี ณ ที่จ่าย (ใช้บน 50 ทวิ)">'+esc(cur?cur.payeeAddr:'')+'</textarea></div>'+
      '<div id="poBankBox">'+bankFields('po', cur?cur.bank:{}, 'ผู้รับเงิน — ')+'</div>'+
      '<div class="fld"><label>จำนวนเงิน ก่อนหักภาษี (บาท)</label>'+
        '<input id="poAmt" type="number" inputmode="decimal" min="0" step="0.01" oninput="poCalc()" value="'+esc(cur?cur.amount:'')+'"></div>'+
      '<div class="fld"><label>มาตราเงินได้ (หัก ณ ที่จ่าย)</label><select id="poSect" onchange="poSectChange()">'+sectOpts+'</select></div>'+
      '<div class="fld" id="poRateFld"><label>อัตราหัก %</label><select id="poRate" onchange="poCalc()"></select></div>'+
      '<div id="poSum" class="m-hint"></div>'+
      (PO_EDIT?'':imgsFldHtml('poImg','📎 ใบแจ้งหนี้ / ใบกำกับภาษี (รูป หรือ PDF · แนบได้หลายไฟล์)')+
                imgsFldHtml('poCon','📄 สัญญา (ถ้ามี · ไม่บังคับ)'))+
      (PO_EDIT?'<div class="m-hint">💡 ไฟล์แนบแก้ที่ใบเดิมไม่ได้ในเฟสนี้ — ถ้าแนบผิดให้ยกเลิกใบแล้วตั้งใหม่ค่ะ</div>':'')+
      '<div class="m-act"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button>'+
      '<button class="btn btn-primary" id="poSend" onclick="doPayout()">'+(PO_EDIT?'บันทึกการแก้ไข':'ตั้งเรื่อง')+'</button></div>');
    if(!PO_EDIT){ imgsFldBind('poImg'); imgsFldBind('poCon'); }
    poPayeeMode(PO_PAYEE);
    poFillRates(cur?cur.whtRate:null);
    poCalc();
  }
  /** อัตราให้เลือก — ชุดเดียวกับ RV_WHT_RATES ฝั่ง backend (ค่านอกลิสต์ backend ตีเป็น 0) */
  function poFillRates(sel){
    var el=$('poRate'); if(!el) return;
    var rates=[0,1,2,3,5];
    el.innerHTML=rates.map(function(r){ return '<option value="'+r+'"'+((Number(sel)===r)?' selected':'')+'>'+r+'%</option>'; }).join('');
  }
  function poPayeeMode(mode){
    PO_PAYEE=mode;
    var on='background:#1B72E8;color:#fff;border-color:#1B72E8', off='background:#fff;color:#1B72E8;border:1.5px solid #1B72E8';
    var a=$('poPOut'), b=$('poPStaff');
    if(a) a.style.cssText='flex:1;font-size:13px;padding:9px 4px;'+(mode==='out'?on:off);
    if(b) b.style.cssText='flex:1;font-size:13px;padding:9px 4px;'+(mode==='staff'?on:off);
    var box=$('poStaffBox'); if(box) box.classList.toggle('hidden', mode!=='staff');
    // จ่ายพนักงาน = บุคคลธรรมดาเสมอ (ค่าตอบแทนพนักงานไม่มีทางเป็นนิติบุคคล)
    var k=$('poKind'); if(k && mode==='staff'){ k.value='บุคคลธรรมดา'; }
    if(mode==='staff') poStaffPick();
    poCalc();
  }
  /** เลือกพนักงาน → เติมชื่อ + โชว์บัญชีที่พนักงานกรอกไว้ (backend ดึงจากชีตทีมงานอีกชั้น) */
  function poStaffPick(){
    var uid=(($('poStaff')||{}).value)||'';
    var m=(PO.staff||[]).filter(function(x){ return x.uid===uid; })[0];
    var lb=$('poStaffBank');
    if(!m){ if(lb) lb.textContent=''; return; }
    var n=$('poName'); if(n && !n.value.trim()) n.value=m.name||'';
    if(lb){
      lb.innerHTML = (m.bank&&m.bank.acct)
        ? '🏦 ใช้บัญชีที่พนักงานกรอกไว้: <b>'+esc(m.bank.name)+' '+esc(m.bank.acct)+'</b> ('+esc(m.bank.owner)+')'
        : '⚠️ พนักงานคนนี้ยังไม่ได้กรอกบัญชีรับโอน — กรอกเลขบัญชีเองด้านล่างได้ค่ะ';
    }
  }
  /** เปลี่ยนประเภทค่าใช้จ่าย → เติมมาตราเริ่มต้นให้ (ค่าเช่า→40(5) · ค่าจ้าง→40(2)) */
  function poTypeChange(){
    var key=(($('poType')||{}).value)||'';
    var t=(PO.types||[]).filter(function(x){ return x.key===key; })[0];
    var s=$('poSect'); if(s && t){ s.value=t.sect||''; poSectChange(); }
  }
  /** เปลี่ยนมาตรา → เติมอัตรา default ของมาตรานั้น (พี่แก้ทับได้) */
  function poSectChange(){
    var code=(($('poSect')||{}).value)||'';
    var s=(PO.sections||[]).filter(function(x){ return x.code===code; })[0];
    poFillRates(code ? (s?s.defRate:0) : 0);
    poCalc();
  }
  /** บรรทัดสรุปใต้ฟอร์ม — ยอดหัก/สุทธิ/แบบยื่นที่จะเข้า (ให้เห็นก่อนกดตั้งเรื่อง) */
  function poCalc(){
    var amt=parseFloat((($('poAmt')||{}).value)||'0')||0;
    var sect=(($('poSect')||{}).value)||'', kind=(($('poKind')||{}).value)||'';
    var rate=sect ? (parseFloat((($('poRate')||{}).value)||'0')||0) : 0;
    var rf=$('poRateFld'); if(rf) rf.classList.toggle('hidden', !sect);
    var wht=Math.round(amt*rate)/100, net=Math.round((amt*100)-(wht*100))/100;
    var el=$('poSum'); if(!el) return;
    if(!(amt>0)){ el.textContent='ใส่จำนวนเงินเพื่อดูยอดจ่ายสุทธิ'; return; }
    if(!rate){ el.innerHTML='💰 จ่ายจริง <b>'+poMoney(amt)+'</b> บาท · ไม่หักภาษี ณ ที่จ่าย'; return; }
    var fl=poFormLabel(kind, sect);
    el.innerHTML='💰 ยอด '+poMoney(amt)+' − หัก '+rate+'% ('+poMoney(wht)+') = จ่ายจริง <b>'+poMoney(net)+'</b> บาท'+
      (fl?'<br>🧾 เข้าแบบ <b>'+esc(fl)+'</b> ของบริษัทผู้จ่าย · ออก 50 ทวิ ให้ตอนจ่ายเงิน (เฟสถัดไป)':'');
  }
  function doPayout(){
    var p={action:(PO_EDIT?'waPoEdit':'waPoCreate'), uid:UID,
      entity:(($('poEnt')||{}).value)||'', type:(($('poType')||{}).value)||'',
      detail:((($('poDetail')||{}).value)||'').trim(), period:((($('poPeriod')||{}).value)||'').trim(),
      payeeKind:(($('poKind')||{}).value)||'', payeeName:((($('poName')||{}).value)||'').trim(),
      payeeId:((($('poId')||{}).value)||'').replace(/\D/g,''), payeeAddr:((($('poAddr')||{}).value)||'').trim(),
      amount:(($('poAmt')||{}).value)||'', section:(($('poSect')||{}).value)||'',
      rate:(($('poSect')||{}).value) ? ((($('poRate')||{}).value)||'0') : '0'};
    if(PO_EDIT) p.no=PO_EDIT;
    if(PO_PAYEE==='staff'){
      p.payeeUid=(($('poStaff')||{}).value)||'';
      if(!p.payeeUid){ mErr('เลือกพนักงานที่จะจ่ายก่อนค่ะ'); return; }
    }
    if(!(parseFloat(p.amount)>0)){ mErr('กรอกจำนวนเงินก่อนค่ะ'); return; }
    if(!p.detail){ mErr('กรอกรายละเอียดก่อนค่ะ'); return; }
    if(PO_PAYEE!=='staff' && !p.payeeName){ mErr('กรอกชื่อผู้รับเงินก่อนค่ะ'); return; }
    // หักภาษี = ต้องมีเลขผู้เสียภาษี + ที่อยู่ (ไปพิมพ์บน 50 ทวิ) — ด่านจริงอยู่ backend อันนี้กันเสียเวลาอัปไฟล์
    if(p.section && parseFloat(p.rate)>0){
      if(p.payeeId.length!==13){ mErr('หักภาษี ณ ที่จ่าย ต้องมีเลขประจำตัวผู้เสียภาษี 13 หลักค่ะ'); return; }
      if(p.payeeKind==='บุคคลธรรมดา' && !validThaiId(p.payeeId)){ mErr('เลขบัตรประชาชนไม่ถูกต้อง — ตรวจอีกครั้งค่ะ'); return; }
      if(!p.payeeAddr){ mErr('หักภาษี ณ ที่จ่าย ต้องมีที่อยู่ผู้รับเงินค่ะ'); return; }
    }
    // บัญชี: ไม่บังคับ (จ่ายเช็ค/เงินสดก็มี) แต่ถ้าเริ่มกรอกแล้วต้องครบ
    var bs=(($('poBank')||{}).value)||'', ba=((($('poAcct')||{}).value)||'').trim(), bo=((($('poOwner')||{}).value)||'').trim();
    if(bs||ba||bo){ var b=readBank('po','บัญชีผู้รับเงิน'); if(!b) return;
      p.bankName=b.name; p.bankAcct=b.acct; p.bankOwner=b.owner; }
    if(!PO_EDIT){
      var im=IMGS['poImg']||[]; if(im.length) p.imgs=JSON.stringify(im);
      var cn=IMGS['poCon']||[]; if(cn.length) p.contract=JSON.stringify(cn);
    }
    var btn=$('poSend'); if(btn){ btn.disabled=true; btn.textContent='กำลังบันทึก…'; }
    callBusy(PO_EDIT?'กำลังบันทึก…':'กำลังตั้งเรื่อง…', jsonpPost(p))
      .then(function(r){
        if(!r||!r.ok){ if(btn){btn.disabled=false;btn.textContent=PO_EDIT?'บันทึกการแก้ไข':'ตั้งเรื่อง';}
          mErr((r&&r.error)||'บันทึกไม่สำเร็จ'); return; }
        closeModal(); IMGS['poImg']=[]; IMGS['poCon']=[];
        toast(PO_EDIT?('✅ แก้ใบ '+PO_EDIT+' แล้ว'):('✅ ตั้งเรื่องแล้ว '+(r.no||'')));
        PO_EDIT=''; renderPayout();
      }).catch(function(e){ if(btn){btn.disabled=false;btn.textContent=PO_EDIT?'บันทึกการแก้ไข':'ตั้งเรื่อง';} mErr(e.message); });
  }
  /** อนุมัติ / ไม่อนุมัติ — พี่ตั้งเองอนุมัติเอง ระบบจะติดธง "อนุมัติใบตัวเอง" ให้ตรวจย้อนหลังได้ */
  function poDecide(no, decision){
    var isApp=(decision==='approve');
    modal('<h3>'+(isApp?'✅ อนุมัติใบจ่าย':'❌ ไม่อนุมัติใบจ่าย')+' '+esc(no)+'</h3><div id="mErr" class="m-err hidden"></div>'+
      (isApp?'<div class="m-hint">อนุมัติแล้วจะย้ายไปกล่อง <b>รอจ่ายเงิน</b> — ตอนโอนเสร็จค่อยกด 💰 บันทึกจ่ายเงิน แนบสลิปค่ะ</div>'
            :'<div class="m-hint">ระบุเหตุผลเพื่อให้ย้อนดูได้ว่าทำไมไม่จ่ายใบนี้</div>')+
      '<div class="fld"><label>หมายเหตุ'+(isApp?' (ไม่บังคับ)':'')+'</label><textarea id="poNote" placeholder="'+(isApp?'เช่น ตรวจใบแจ้งหนี้แล้ว':'เช่น ยอดไม่ตรงกับสัญญา')+'"></textarea></div>'+
      '<div class="m-act"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button>'+
      '<button class="btn btn-primary" id="poDecBtn" onclick="doPoDecide(\''+esc(no)+'\',\''+esc(decision)+'\')">ยืนยัน</button></div>');
  }
  function doPoDecide(no, decision){
    var note=((($('poNote')||{}).value)||'').trim();
    if(decision==='reject' && !note){ mErr('ระบุเหตุผลที่ไม่อนุมัติด้วยค่ะ'); return; }
    var btn=$('poDecBtn'); if(btn){ btn.disabled=true; btn.textContent='กำลังบันทึก…'; }
    callBusy('กำลังบันทึก…', jsonpPost({action:'waPoDecide', uid:UID, no:no, decision:decision, note:note}))
      .then(function(r){
        if(!r||!r.ok){ if(btn){btn.disabled=false;btn.textContent='ยืนยัน';} mErr((r&&r.error)||'บันทึกไม่สำเร็จ'); return; }
        closeModal();
        toast((decision==='approve'?'✅ อนุมัติแล้ว':'❌ ไม่อนุมัติแล้ว')+(r.selfApprove?' · บันทึกว่าอนุมัติใบตัวเอง':''));
        renderPayout();
      }).catch(function(e){ if(btn){btn.disabled=false;btn.textContent='ยืนยัน';} mErr(e.message); });
  }
  /** บันทึกจ่ายเงิน — วันที่ย้อนหลังได้ (วันที่จ่ายจริง = วันที่หักภาษีบน 50 ทวิ) */
  function poOpenPay(no){
    var x=((PO.topay||[]).concat(PO.paid||[])).filter(function(y){ return y.no===no; })[0]||{};
    var mOpts=(PO.methods||[]).map(function(m){ return '<option value="'+esc(m)+'"'+((x.payMethod===m)?' selected':'')+'>'+esc(m)+'</option>'; }).join('');
    modal('<h3>💰 บันทึกจ่ายเงิน '+esc(no)+'</h3><div id="mErr" class="m-err hidden"></div>'+
      '<div class="m-hint">ผู้รับ: <b>'+esc(x.payeeName||'-')+'</b> · จ่ายจริง <b>'+poMoney(x.netAmt||x.amount)+'</b> บาท'+
      (x.bank&&x.bank.acct?'<br>🏦 '+esc(x.bank.name||'')+' <b>'+esc(x.bank.acct)+'</b> ('+esc(x.bank.owner||'')+') '+
        '<a href="#" onclick="copyTxt(\''+esc(x.bank.acct)+'\');return false">📋 ก๊อป</a>':'')+'</div>'+
      '<div class="fld"><label>วันที่จ่ายจริง</label><input id="poPayDate" type="date" value="'+esc(String(x.payDate||'').slice(0,10)||todayISO())+'"></div>'+
      '<div class="fld"><label>ช่องทาง</label><select id="poMethod" onchange="poMethodChange()">'+mOpts+'</select></div>'+
      '<div class="fld hidden" id="poChqFld"><label>เลขที่เช็ค</label><input id="poChq" placeholder="เช่น 0012345" value="'+esc(x.chequeNo||'')+'"></div>'+
      imgsFldHtml('poSlip','📎 สลิปโอน / หลักฐานการจ่าย (รูป หรือ PDF)')+
      '<div class="m-act"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button>'+
      '<button class="btn btn-primary" id="poPayBtn" onclick="doPoPay(\''+esc(no)+'\')">บันทึกจ่ายแล้ว</button></div>');
    imgsFldBind('poSlip'); poMethodChange();
  }

  function sigInitPad(c){
    if(!c) return;
    var ctx=c.getContext('2d');
    ctx.lineWidth=2.6; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#16284a';
    var drawing=false, last=null;
    function pos(e){
      var r=c.getBoundingClientRect();
      var t=(e.touches&&e.touches[0])?e.touches[0]:e;
      return { x:(t.clientX-r.left)*(c.width/r.width), y:(t.clientY-r.top)*(c.height/r.height) };
    }
    function start(e){ drawing=true; last=pos(e); e.preventDefault(); }
    function move(e){ if(!drawing) return; var p=pos(e);
      ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p; e.preventDefault(); }
    function end(){ drawing=false; }
    c.addEventListener('mousedown',start); c.addEventListener('mousemove',move); window.addEventListener('mouseup',end);
    c.addEventListener('touchstart',start,{passive:false}); c.addEventListener('touchmove',move,{passive:false}); c.addEventListener('touchend',end);
  }
  function sigClear(){
    var c=$('sigPad'); if(c) c.getContext('2d').clearRect(0,0,c.width,c.height);
    SIG_PHOTO=null; var t=$('sigTune'); if(t) t.classList.add('hidden');
  }
  /** ถ่าย/เลือกรูปลายเซ็นบนกระดาษ → ลบพื้นกระดาษให้โปร่ง → วาดลงกรอบ */
  function sigUpload(e){
    var f=e.target.files && e.target.files[0]; if(!f) return;
    toast('กำลังแยกลายเซ็นออกจากพื้นกระดาษ…');
    var img=new Image();
    img.onload=function(){
      SIG_PHOTO=img;
      var t=$('sigTune'); if(t) t.classList.remove('hidden');
      sigRedraw();
    };
    img.onerror=function(){ mErr('อ่านรูปไม่สำเร็จ ลองรูปอื่นนะคะ'); };

  /** ปรับสไลเดอร์ความเข้ม → ประมวลผลรูปเดิมใหม่ (preview สด) */
  function sigRedraw(){
    if(!SIG_PHOTO) return;
    var sens=parseInt(($('sigSens')||{}).value||'15',10)/100;
    var out=sigExtractInk(SIG_PHOTO, sens);
    var c=$('sigPad'), ctx=c.getContext('2d');
    ctx.clearRect(0,0,c.width,c.height);
    if(!out){ mErr('ไม่เจอลายเซ็นในรูป — ลองถ่ายใหม่ให้เห็นเส้นชัดๆ นะคะ'); return; }
    var r=Math.min(c.width/out.width, c.height/out.height, 1);
    var w=out.width*r, h=out.height*r;
    ctx.drawImage(out,(c.width-w)/2,(c.height-h)/2,w,h);
  }
  /**
   * แยก "หมึก" ออกจากพื้นกระดาษในรูปถ่าย → canvas พื้นโปร่ง (ตัดขอบว่างออกแล้ว)
   * ใช้ adaptive threshold: เทียบความสว่างแต่ละจุดกับ "ค่าเฉลี่ยรอบๆ จุดนั้น" ไม่ใช่ค่าเดียวทั้งรูป
   * → รูปถ่ายที่แสงไม่เท่ากัน (เงามือ/เงากระดาษ) ไม่กลายเป็นแถบดำ
   * @param {Image} img รูปต้นฉบับ · @param {number} sens 0.05–0.45 ยิ่งมากยิ่งเก็บเส้นจาง (แต่ได้ noise)
   * @return {HTMLCanvasElement|null} null ถ้าไม่เจอหมึกเลย
   */
  function sigExtractInk(img, sens){
    // 1) ย่อลงก่อน (รูปมือถือใหญ่มาก · ลายเซ็นไม่ต้องละเอียดขนาดนั้น)
    var mx=1000, w=img.width, h=img.height;
    if(Math.max(w,h)>mx){ var s=mx/Math.max(w,h); w=Math.round(w*s); h=Math.round(h*s); }
    var work=document.createElement('canvas'); work.width=w; work.height=h;
    var wctx=work.getContext('2d'); wctx.drawImage(img,0,0,w,h);
    var src=wctx.getImageData(0,0,w,h), d=src.data;

    // 2) grayscale
    var gray=new Float64Array(w*h);
    for(var i=0,p=0;i<d.length;i+=4,p++) gray[p]=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];

    // 3) integral image → หาค่าเฉลี่ยในกรอบรอบจุด ได้เร็วคงที่ (ไม่ต้องวนซ้ำต่อจุด)
    var integ=new Float64Array((w+1)*(h+1));
    for(var y=0;y<h;y++){ var rowSum=0;
      for(var x=0;x<w;x++){ rowSum+=gray[y*w+x];
        integ[(y+1)*(w+1)+(x+1)] = integ[y*(w+1)+(x+1)] + rowSum; } }
    function boxMean(x0,y0,x1,y1){
      x0=Math.max(0,x0); y0=Math.max(0,y0); x1=Math.min(w-1,x1); y1=Math.min(h-1,y1);
      var area=(x1-x0+1)*(y1-y0+1);
      var s=integ[(y1+1)*(w+1)+(x1+1)] - integ[y0*(w+1)+(x1+1)] - integ[(y1+1)*(w+1)+x0] + integ[y0*(w+1)+x0];
      return s/area;
    }
    var rad=Math.max(8, Math.round(Math.min(w,h)*0.06));   // กรอบเฉลี่ย ~6% ของด้านสั้น

    // 4) จุดที่ "เข้มกว่าพื้นรอบๆ" = หมึก · ยิ่งเข้ากว่ามาก alpha ยิ่งทึบ (ขอบเส้นเนียน ไม่หยัก)
    var out=document.createElement('canvas'); out.width=w; out.height=h;
    var octx=out.getContext('2d');
    var dst=octx.createImageData(w,h), o=dst.data;
    var minX=w, minY=h, maxX=-1, maxY=-1, ink=0;
    var soft=255*0.10;   // ระยะไล่ alpha
    for(var y2=0;y2<h;y2++){
      for(var x2=0;x2<w;x2++){
        var idx=y2*w+x2;
        var mean=boxMean(x2-rad,y2-rad,x2+rad,y2+rad);
        var cut=mean*(1-sens);              // เส้นต้องเข้มกว่าพื้นรอบๆ ตามสัดส่วน sens
        var diff=cut-gray[idx];
        if(diff<=0) continue;               // สว่างกว่าพื้น = กระดาษ → โปร่ง (alpha=0 อยู่แล้ว)
        var a=Math.min(255, Math.round(diff/soft*255));
        if(a<8) continue;
        var q=idx*4;
        o[q]=22; o[q+1]=40; o[q+2]=74; o[q+3]=a;   // สีหมึก #16284A ให้เข้าชุดกับที่วาดเอง
        ink++;
        if(x2<minX)minX=x2; if(x2>maxX)maxX=x2; if(y2<minY)minY=y2; if(y2>maxY)maxY=y2;
      }
    }
    if(ink<20 || maxX<0) return null;       // ไม่เจอหมึก (รูปเปล่า/มืดทั้งใบ)
    octx.putImageData(dst,0,0);

    // 5) ตัดขอบว่างรอบลายเซ็นออก (auto-crop) → ฝังลงเอกสารแล้วได้ขนาดพอดี ไม่ลอยกลางช่องว่าง
    var pad=Math.round(Math.min(w,h)*0.02);
    var cx=Math.max(0,minX-pad), cy=Math.max(0,minY-pad);
    var cw=Math.min(w,maxX+pad)-cx+1, ch=Math.min(h,maxY+pad)-cy+1;
    var crop=document.createElement('canvas'); crop.width=cw; crop.height=ch;
    crop.getContext('2d').drawImage(out,cx,cy,cw,ch,0,0,cw,ch);
    return crop;
  }
  /** คืน dataURL png ของลายเซ็น · '' ถ้ากรอบว่าง (ไม่ได้วาด/อัปรูป) */
  function sigData(){
    var c=$('sigPad'); if(!c) return '';
    var d=c.getContext('2d').getImageData(0,0,c.width,c.height).data;
    for(var i=3;i<d.length;i+=4){ if(d[i]!==0) return c.toDataURL('image/png'); }
    return '';
  }

  // ───── ช่องแนบรูป "หลายใบ" (ใบเสร็จ/หลักฐาน) · หลายใบ = backend รวมเป็น PDF เดียวผ่าน Worker ─────
  var IMGS={};   // { fldId: [dataURL,…] }
  function imgsFldHtml(id,label){
    return '<div class="fld"><label>'+esc(label)+'</label>'+
      '<input id="'+id+'" type="file" accept="image/*,application/pdf" multiple style="font-family:inherit;font-size:14px">'+
      '<div id="'+id+'List" class="m-hint" style="margin-top:6px">ยังไม่ได้แนบไฟล์ (รูป หรือ PDF)</div></div>';
  }
  function readFileDataURL(f){ return new Promise(function(res,rej){ var fr=new FileReader(); fr.onload=function(){res(fr.result);}; fr.onerror=rej; fr.readAsDataURL(f); }); }
  function imgsFldBind(id){
    IMGS[id]=[];
    var el=$(id); if(!el) return;
    el.addEventListener('change', function(){
      var fs=el.files ? Array.prototype.slice.call(el.files) : [];
      if(!fs.length) return;
      var lb=$(id+'List'); if(lb) lb.textContent='กำลังเตรียมไฟล์ '+fs.length+' รายการ…';
      Promise.all(fs.map(function(f){
        if(f.type==='application/pdf'||/\.pdf$/i.test(f.name||'')) return readFileDataURL(f).catch(function(){ return null; });   // PDF อ่านตรง (ไม่ย่อ)
        return shrinkImage(f).catch(function(){ return null; });
      }))
        .then(function(ds){
          ds.filter(Boolean).forEach(function(d){ if(IMGS[id].length<10) IMGS[id].push(d); });
          el.value='';            // เคลียร์ input → เลือกไฟล์เดิมซ้ำได้ + กดเพิ่มทีละชุดได้
          imgsPaint(id);
        });
    });
  }
  function imgsPaint(id){

  // (ลบช่องแนบ "รูปเดียว" ทิ้ง 29 ก.ค. — accept="image/*" ทำให้สลิป PDF แนบไม่ติดแบบเงียบ
  //  ทุกช่องแนบไฟล์ใช้ imgsFldHtml/imgsFldBind ตัวเดียว: รับรูป+PDF หลายใบ · หลายใบรวมเป็น PDF เดียว)
  /** ย่อรูป (ด้านยาวสุด ≤ 1280) → data URL jpeg 0.7 — กันไฟล์ใหญ่เกิน POST/Drive */
  function shrinkImage(file){
    return new Promise(function(resolve,reject){
      var fr=new FileReader();
      fr.onerror=function(){ reject(new Error('อ่านไฟล์ไม่ได้')); };
      fr.onload=function(){
        var img=new Image();
        img.onerror=function(){ reject(new Error('ไฟล์ไม่ใช่รูป')); };
        img.onload=function(){
          var mx=1280, w=img.width, h=img.height;
          if(Math.max(w,h)>mx){ var s=mx/Math.max(w,h); w=Math.round(w*s); h=Math.round(h*s); }
          var c=document.createElement('canvas'); c.width=w; c.height=h;
          c.getContext('2d').drawImage(img,0,0,w,h);
          try{ resolve(c.toDataURL('image/jpeg',0.7)); }catch(e){ reject(e); }
        };
        img.src=fr.result;
      };
      fr.readAsDataURL(file);
    });
  }

    if(!slips.length && !force){
      mErr('ยังไม่ได้แนบสลิปโอนคืน — แฟ้มครบชุดจะไม่มีหลักฐานการโอน กด "บันทึกจ่ายคืน" อีกครั้งถ้าตั้งใจข้าม');
      var b0=$('pSend'); if(b0){ b0.textContent='บันทึกจ่ายคืน (ไม่มีสลิป)'; b0.setAttribute('onclick','exDoPay(\''+esc(no)+'\',1)'); }

    var b=$('pSend'); if(b){ b.disabled=true; b.textContent='กำลังบันทึก…'; }
    toast('กำลังบันทึก…');
    callBusy('กำลังสร้างเอกสาร + แฟ้ม…', jsonpPost({action:'waExpPay',uid:UID,no:no,imgs:JSON.stringify(slips),channel:(($('payCh')||{}).value||'')}), 'บันทึกจ่ายคืนแล้ว').then(function(r){
      if(!r||!r.ok){ if(b){b.disabled=false;b.textContent='บันทึกจ่ายคืน';} mErr((r&&r.error)||'ไม่สำเร็จ'); return; }
      closeModal(); IMGS['pSlips']=[];
      // แฟ้มครบชุดรวมให้เองตอนนี้ · ไม่เกิด/ขาดชิ้น = ไม่ใช่เรื่องใหญ่ (เงินจ่ายแล้ว) แต่ต้องบอกให้รู้
      toast(r.dossier

        : '💰 จ่ายคืนแล้ว · แฟ้มยังไม่รวม (กด 🗂️ ที่รายการเพื่อสร้าง)');
      // เงินสดย่อย: บอกว่าตัดวงเงินแล้ว + เตือนถ้าจ่ายเกินวงเงิน (เงินออกไปแล้ว บันทึกเสมอ)
      if(r.pettyNo) setTimeout(function(){ toast('💵 ตัดวงเงินเงินสดย่อยแล้ว ('+r.pettyNo+')'+(r.pettyWarn?' · '+r.pettyWarn:'')); },1200);
      else if(r.pettyError) setTimeout(function(){ toast('⚠️ บันทึกเงินสดย่อยไม่สำเร็จ: '+r.pettyError); },1200);
      exFade(no);
    }).catch(function(e){ if(b){b.disabled=false;b.textContent='บันทึกจ่ายคืน';} mErr(e.message); });

  /** สร้างแฟ้มครบชุดใหม่ (พี่เท่านั้น) — เผื่อ Worker ล่มตอนจ่าย หรือแนบหลักฐานเพิ่มทีหลัง */

  /** การ์ดที่ตัดสินแล้ว fade ออก แล้วโหลดหน้าใหม่ (หน้าสรุป=โหลดทั้งหน้าให้ยอดอัปเดต · อนุมัติเดี่ยว=โหลดบล็อก) */

  /** 🗑️ ยกเลิกใบเบิก → ย้ายไปถังขยะ (พี่เท่านั้น · soft-delete · กู้คืนได้) */

  window.renderExpenseApprove=renderExpenseApprove; window.exReject=exReject; window.exDecide=exDecide;

  // ═══════════ VIEW: OT (พนักงานขอ + พี่อนุมัติ + ดึงเข้า payroll) ═══════════
  var OT_LIST=[], OT_KINDS={workday:'OT วันทำงาน (×1.5)',holiday_work:'ทำงานวันหยุด (×1)',holiday_ot:'OT วันหยุด (×3)'}, OT_DRAFT=null, OT_TEAM=[], OT_EDIT_NO=null;
  function otBadge(s){ s=String(s||''); if(s.indexOf('ไม่')>=0)return'b-cancel'; if(s.indexOf('อนุมัติ')>=0)return'b-done'; return'b-new'; }
  function otHM(s){ var m=String(s||'').match(/^(\d{1,2}):(\d{2})$/); if(!m)return null; return (+m[1])*60+(+m[2]); }
  function otHoursCalc(s,e){ var a=otHM(s),b=otHM(e); if(a==null||b==null)return 0; if(b<=a)b+=1440; var mins=b-a; var lunch=Math.max(0,Math.min(b,780)-Math.max(a,720)); return Math.round((mins-lunch)/60*100)/100; }
  // ═══════════ 🕐 ลงเวลา (selfie + พิกัด) — พี่กี้ขอ 26 ส.ค. 2569 ═══════════
  // ทำในหน้านี้เลย ไม่ต้องเด้งไปหน้าสแกนหน้า (หน้านั้นโหลดโมเดล human.js หลายสิบ MB ทุกครั้ง)
  // บันทึกผ่าน route เดิม waFaceClock ด้วย mode=selfie → ชีตลงเวลาขึ้น "📸 selfie" · ไม่เตือน HR
  var CLK = { kind:'', stream:null, sending:false, info:null, shot:null };
  var CLK_KINDS = [
    { k:'in',  e:'🟢', t:'เข้างาน',            s:'เริ่มงานวันนี้' },
    { k:'out', e:'🔴', t:'ออกงาน',             s:'เลิกงาน · ปิดวัน' },
    { k:'wfh', e:'🏠', t:'WFH (ทำงานที่บ้าน)', s:'แจ้งเข้ากลุ่มทีมให้ด้วย' }
  ];

  function renderClock(){
    clkStop(); skel();
    jsonp({ action:'waClockInit', uid:UID }).then(function(r){
      if(!r||!r.ok){ $('main').innerHTML='<div class="card"><div class="empty">'+esc((r&&r.error)||'โหลดไม่สำเร็จ')+'</div></div>'; return; }
      CLK.info=r;
      var h='<div class="card" style="margin-bottom:12px;display:flex;align-items:center;gap:12px">'+
        '<div style="font-size:30px;line-height:1">'+(r.openToday?'🟢':'🕐')+'</div><div>'+
        '<div style="font-weight:700;font-size:15px">'+(r.openToday?'เข้างานแล้ว · ยังไม่ได้ลงออก':'ยังไม่ได้ลงเวลาวันนี้')+'</div>'+
        '<div style="font-size:12.5px;color:var(--muted);margin-top:2px">เดือนนี้ลงเวลาแล้ว '+(r.monthDays||0)+' วัน</div>'+
        '</div></div>';
      h+='<div class="clk-kinds">'+CLK_KINDS.map(function(x){
        return '<button class="clk-kb" data-kind="'+x.k+'"><span class="ke">'+x.e+'</span><span>'+esc(x.t)+
          '<span class="ks">'+esc(x.s)+'</span></span></button>';
      }).join('')+'</div>';
      h+='<div class="m-hint">กดประเภทแล้วถ่ายรูป selfie 1 ครั้ง ระบบจะบันทึกเวลา + พิกัดให้อัตโนมัติค่ะ'+
         '<br>อยากยืนยันด้วยใบหน้า (ไม่ต้องถ่ายเอง) กด <a href="face-clock.html" style="color:var(--red)">🔍 ลงเวลาสแกนหน้า</a> ได้ค่ะ</div>';
      h+='<div class="grp-h">📋 วันนี้</div><div class="card">'+(
        (r.list&&r.list.length) ? r.list.map(function(x){
          return '<div class="clk-row"><span class="ct">'+esc(x.time)+'</span><span>'+esc(x.kind)+
            (x.address?'<span style="display:block;font-size:11.5px;color:var(--muted)">📍 '+esc(x.address)+'</span>':'')+
            '</span><span class="cm">'+esc(x.method||'')+'</span></div>';
        }).join('') : '<div class="empty">ยังไม่มีรายการลงเวลาวันนี้ 😊</div>')+'</div>';
      $('main').innerHTML=h;
      Array.prototype.forEach.call(document.querySelectorAll('.clk-kb'), function(b){
        b.addEventListener('click', function(){ clkPick(this.getAttribute('data-kind')); });
      });
    }).catch(function(e){ $('main').innerHTML='<div class="card"><div class="empty">'+esc(e.message)+'</div></div>'; });
  }

  /** เลือกประเภท → เปิดกล้องหน้าในหน้านี้ (ไม่ใช้ input file · เลี่ยงการหยิบรูปเก่าในอัลบั้มมาส่ง) */
  function clkPick(kind){
    CLK.kind=kind; CLK.sending=false;
    var meta=CLK_KINDS.filter(function(x){ return x.k===kind; })[0]||{e:'🕐',t:'ลงเวลา'};
    $('main').innerHTML='<div class="card">'+
      '<div style="font-weight:700;font-size:15px;margin-bottom:10px">'+meta.e+' กำลังลงเวลา: '+esc(meta.t)+'</div>'+
      '<div class="clk-cam"><video id="clkVid" playsinline muted autoplay></video><div class="ch" id="clkHint">กำลังเปิดกล้อง…</div></div>'+
      '<button class="btn btn-primary" id="clkShot" disabled>📸 ถ่ายรูปและลงเวลา</button>'+
      '<button class="btn btn-ghost" id="clkBack" style="margin-top:9px">ยกเลิก</button>'+
      '<div class="m-hint" style="margin-top:12px">ระบบขอตำแหน่ง (GPS) ตอนกดถ่าย — ถ้าเครื่องถามสิทธิ์ กด "อนุญาต" นะคะ</div>'+
      '</div>';
    $('clkBack').addEventListener('click', function(){ clkStop(); renderClock(); });
    $('clkShot').addEventListener('click', clkShoot);
    navigator.mediaDevices.getUserMedia({ video:{ facingMode:'user', width:{ideal:640}, height:{ideal:800} }, audio:false })
      .then(function(st){
        CLK.stream=st; var v=$('clkVid');
        if(!v){ clkStop(); return; }                 // ผู้ใช้เปลี่ยนหน้าไปก่อนกล้องพร้อม → ปิดทิ้ง
        v.srcObject=st; return v.play();
      }).then(function(){
        if(!$('clkShot')) return;
        $('clkShot').disabled=false; $('clkHint').textContent='จัดหน้าให้อยู่ในกรอบ แล้วกดปุ่มถ่ายรูปค่ะ';
      }).catch(function(err){
        var m=(err&&(err.message||err.name))||String(err);
        var deny=/Permission|NotAllowed|denied/i.test(m);
        if($('clkHint')) $('clkHint').textContent = deny ? 'ไม่ได้รับสิทธิ์กล้อง' : 'เปิดกล้องไม่ได้';
        toast(deny ? 'ไม่ได้รับสิทธิ์เปิดกล้อง — อนุญาตกล้องให้ LINE/เบราว์เซอร์แล้วลองใหม่ค่ะ'
                   : 'เปิดกล้องไม่ได้ค่ะ ลองเปิดหน้านี้ใน Chrome/Safari นะคะ');
      });
  }

  /** ถ่ายรูป → โชว์รูปให้ดูก่อน (ถ่ายใหม่ได้) ยังไม่ส่ง — พี่กี้เคาะ 26 ส.ค. 69 */
  function clkShoot(){
    if(CLK.sending) return;
    var v=$('clkVid');
    if(!v||!v.videoWidth){ toast('กล้องยังไม่พร้อมค่ะ รอสักครู่นะคะ'); return; }
    var w=360, h=Math.round(w*(v.videoHeight/v.videoWidth||4/3));
    var c=document.createElement('canvas'); c.width=w; c.height=h;
    c.getContext('2d').drawImage(v,0,0,w,h);          // ไม่กลับซ้ายขวา — เก็บภาพจริงเป็นหลักฐาน
    var img=''; try{ img=c.toDataURL('image/jpeg',0.6); }catch(e){ img=''; }
    if(!img){ toast('ถ่ายรูปไม่สำเร็จค่ะ ลองใหม่อีกครั้งนะคะ'); return; }
    CLK.shot=img;
    var meta=CLK_KINDS.filter(function(x){ return x.k===CLK.kind; })[0]||{e:'🕐',t:'ลงเวลา'};
    $('main').innerHTML='<div class="card">'+
      '<div style="font-weight:700;font-size:15px;margin-bottom:10px">'+meta.e+' กำลังลงเวลา: '+esc(meta.t)+'</div>'+
      '<div class="clk-cam"><img src="'+img+'" alt="รูปลงเวลา"></div>'+
      '<button class="btn btn-primary" id="clkOk">✅ ใช้รูปนี้ ลงเวลา</button>'+
      '<button class="btn btn-ghost" id="clkRetake" style="margin-top:9px">🔄 ถ่ายใหม่</button>'+
      '<div class="m-hint" style="margin-top:12px">กด "ใช้รูปนี้" แล้วระบบจะขอตำแหน่ง (GPS) และบันทึกเวลาให้ค่ะ</div>'+
      '</div>';
    $('clkRetake').addEventListener('click', function(){ CLK.shot=null; clkPick(CLK.kind); });
    $('clkOk').addEventListener('click', clkSend);
  }

  /** ยืนยันรูป → ขอพิกัด → บันทึก (mode=selfie · ไม่ติดธง HR) */
  function clkSend(){
    if(CLK.sending || !CLK.shot) return;
    CLK.sending=true;
    var ok=$('clkOk'); if(ok) ok.disabled=true;
    var img=CLK.shot;
    busy('กำลังขอตำแหน่ง (GPS)…');
    clkGps().then(function(g){
      busy('กำลังบันทึกลงเวลา…');
      return jsonpPost({ action:'waFaceClock', uid:UID, kind:CLK.kind, mode:'selfie',
        matched:'0', score:'0', lat:g.lat, lng:g.lng, address:'', img:img });
    }).then(function(r){
      if(!r||!r.ok){ clkSendFail((r&&r.error)||'บันทึกไม่สำเร็จค่ะ'); return; }
      busyOk('บันทึก'+(r.kindLabel||'ลงเวลา')+'แล้ว');
      CLK.shot=null; clkStop();
      toast('✅ '+(r.kindLabel||'ลงเวลา')+' · '+(r.timeText||''));
      renderClock();
    }).catch(function(e){ clkSendFail(e.message||'เกิดข้อผิดพลาด'); });
  }

  /** ส่งไม่สำเร็จ → ยังอยู่หน้ารูปเดิม กดยืนยันซ้ำได้ ไม่ต้องถ่ายใหม่ */
  function clkSendFail(msg){
    unbusy(); CLK.sending=false;
    var ok=$('clkOk'); if(ok) ok.disabled=false;
    toast(msg);
  }

  /** ขอพิกัด 2 ชั้น — GPS แม่นก่อน (8 วิ) ไม่ได้ค่อยใช้ Wi-Fi/เครือข่าย (จับในอาคารได้)
   *  แยกข้อความตามเหตุจริง: 1=ปฏิเสธสิทธิ์ 2=หาไม่เจอ 3=หมดเวลา (เหมือนหน้า face-clock) */
  function clkGps(){
    return new Promise(function(resolve,reject){
      if(!navigator.geolocation) return reject(new Error('อุปกรณ์ไม่รองรับ GPS'));
      function ok(pos){ resolve({ lat:pos.coords.latitude, lng:pos.coords.longitude }); }
      function fail(err){
        var code=err&&err.code;
        if(code===1) return reject(new Error('ไม่ได้รับสิทธิ์ตำแหน่ง — เปิดสิทธิ์ตำแหน่งให้ LINE/เบราว์เซอร์แล้วลองใหม่ค่ะ'));
        if(code===2) return reject(new Error('หาตำแหน่งไม่เจอ — เปิด GPS ที่เครื่องแล้วลองใหม่ค่ะ'));
        return reject(new Error('ขอตำแหน่งนานเกินไป — ลองใหม่ หรือขยับไปจุดสัญญาณดีขึ้นค่ะ'));
      }
      navigator.geolocation.getCurrentPosition(ok, function(e1){
        if(e1&&e1.code===1) return fail(e1);          // ถูกปฏิเสธสิทธิ์ → ลองซ้ำก็ไม่ผ่าน
        busy('กำลังหาตำแหน่งอีกวิธี…');
        navigator.geolocation.getCurrentPosition(ok, fail, { enableHighAccuracy:false, timeout:20000, maximumAge:60000 });
      }, { enableHighAccuracy:true, timeout:8000, maximumAge:30000 });
    });
  }

  /** ปิดกล้องเสมอเมื่อออกจากหน้า/บันทึกเสร็จ (ไม่งั้นไฟกล้องค้าง กินแบต) */
  function clkStop(){
    try{ if(CLK.stream) CLK.stream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){}
    CLK.stream=null; CLK.sending=false; CLK.shot=null;
  }

  // เดือนปิดรอบ default = เดือนก่อนหน้า (พ.ศ. YYYY-MM) — รอบ OT มักปิดของเดือนที่ผ่านมา
  function otDefaultMonth(){ var t=new Date(); t.setDate(1); t.setMonth(t.getMonth()-1); return (t.getFullYear()+543)+'-'+('0'+(t.getMonth()+1)).slice(-2); }
  function otMonthVal(){ var m=(($('otPayMonth')||{}).value||'').trim(); return /^\d{4}-\d{2}$/.test(m)?m:''; }
  function renderOtSum(r){

    if(!r||!r.ok){ el.innerHTML='<div class="m-hint" style="color:#c0392b;margin-top:10px">'+esc((r&&r.error)||'โหลดไม่สำเร็จ')+'</div>'; return; }

  // ═══════════ VIEW: 💰 รายรับ (ฝั่งขาย) + 📊 ภาพรวมธุรกิจ — พี่/HR เท่านั้น ═══════════
  // spec: docs/spec-sales-revenue.md · ใช้ตาราง + เมนู ⋮ ตามมาตรฐาน (spec-finance-table-ui.md)
  var SALES = null, SALES_ITEMS = [], SALES_KIND_F = '';

  function renderSales(){
    skel();
    jsonp({action:'waSalesInit',uid:UID,kind:SALES_KIND_F}).then(function(r){
      if(!r||!r.ok){ $('main').innerHTML='<div class="card"><div class="emptybox">'+esc((r&&r.error)||'โหลดไม่สำเร็จ')+'</div></div>'; return; }
      SALES=r;

      // ยังไม่มีทะเบียน = ทำอะไรไม่ได้ → บอกทางออกให้ชัดก่อนเลย
      if(!r.customers.length || !r.services.length){
        h+='<div class="m-hint" style="color:#C8730B">⚠️ ยังตั้งทะเบียนไม่ครบ: '+

          '<br>เพิ่มได้ที่ปุ่มด้านล่าง หรือกดเมนูในชีต ⚙️ → 👥 ดึงลูกค้าจากกลุ่ม LINE เข้าทะเบียน</div>';
      }
      if(r.missingCustomers && r.missingCustomers.length){
        h+='<div class="m-hint">👥 ลูกค้าที่มีกลุ่ม LINE แต่ยังไม่อยู่ในทะเบียน '+r.missingCustomers.length+' ราย: '+
          esc(r.missingCustomers.slice(0,5).join(', '))+(r.missingCustomers.length>5?' …':'')+'</div>';
      }
      h+='<div class="tax-acts" style="margin:0 0 12px">'+
        '<button class="btn btn-primary" onclick="salesNew()">ออกเอกสารใหม่</button>'+
        '<button class="btn btn-ghost" onclick="salesBnOpen(\'\')">ออกใบวางบิล</button>'+
        '<button class="btn btn-ghost" onclick="svcManage()">ทะเบียนบริการ</button>'+
        '<button class="btn btn-ghost" onclick="custManage()">ทะเบียนลูกค้า</button>'+
        '<button class="btn btn-ghost" onclick="entManage()">นิติบุคคล</button>'+
        '<button class="btn btn-ghost" onclick="reimbMigrate()">ย้ายตั้งเบิกเดิม</button></div>';
      // ตัวกรองใช้ "ทุกชนิด" (allKinds) ไม่ใช่ชนิดที่ออกจากฟอร์มได้ — ไม่งั้นหาใบเสร็จ/วางบิล/ลดหนี้ไม่เจอ
      h+='<div class="ed-filter"><select id="skf" onchange="salesFilter(this.value)">'+
        '<option value="">ชนิด: ทั้งหมด</option>'+
        (r.allKinds||r.kinds).map(function(k){ return '<option value="'+esc(k.key)+'"'+(k.key===SALES_KIND_F?' selected':'')+'>'+esc(k.label)+'</option>'; }).join('')+
        '</select></div>';
      h+='<div id="salesTbl"></div>';
      $('main').innerHTML=h;
      paintSalesTable(r.docs||[]);
    }).catch(function(e){ $('main').innerHTML='<div class="card"><div class="emptybox">'+esc(e.message)+'</div></div>'; });

  function salesFilter(v){ SALES_KIND_F=v; renderSales(); }

  /** ใบปลายทางที่อ้างถึงใบนี้ (refBy มาจาก backend) — ว่าง = ยังไม่มีใบไหนต่อยอด */
  function salesRefBy(d,kind){
    return (d.refBy||[]).filter(function(x){ return !kind || x.kind===kind; });
  }
  /** เมนู ⋮ ของเอกสารขาย — เงื่อนไขต้องตรงกับด่าน backend ทุกข้อ
   *  (ใบรับเงินแล้ว/ถูกใบอื่นอ้างอิงอยู่ ยกเลิกไม่ได้ · ใบเสนอราคาออกใบแจ้งหนี้ได้ครั้งเดียว) */
  function salesRowActions(d){
    var q="'"+String(d.no).replace(/'/g,"\\'")+"'";
    var a=[], canceled=String(d.status).indexOf('ยกเลิก')>=0;
    if(d.pdfLink) a.push({key:'pdf',label:'📄 เปิดเอกสาร',href:d.pdfLink});
    if(a.length) a.push({sep:true});
    if(!canceled){
      // แก้ไขได้ทุกใบที่ยังไม่ยกเลิก — แก้ได้แค่ไหน backend ตัดสิน (salesEditScope_) แล้วฟอร์มปรับตาม
      a.push({key:'edit',label:'✏️ แก้ไขเอกสาร',call:'salesEdit('+q+')'});
      // ── ต่อยอดเป็นใบถัดไปในสายเอกสาร ──
      if(d.kind==='QT' && !salesRefBy(d,'IV').length)
        a.push({key:'toiv',label:'➡️ ออกใบแจ้งหนี้จากใบนี้',call:'salesToInvoice('+q+')'});
      if(d.kind==='IV' && d.balance>0)
        a.push({key:'recv',label:'💵 บันทึกรับชำระ',call:'recvOpen('+q+')'});
      if(d.kind==='IV' && d.balance>0 && !salesRefBy(d,'BN').length)
        a.push({key:'tobn',label:'📑 รวมออกใบวางบิล',call:'salesBnOpen('+q+')'});
      // ใบเสร็จ → ออกใบลดหนี้ (ทางเดียวที่แก้ใบเสร็จที่ออกไปแล้วได้ · spec §12)
      if(d.kind==='RE')
        a.push({key:'cn',label:'🧾 ออกใบลดหนี้',call:'cnOpen('+q+')'});
      // ใบลดหนี้ที่ยังไม่ปิดเรื่องเงินคืน → บันทึกผล (คืนแล้ว/หักกลบ/ไม่ต้องคืน)
      if(d.kind==='CN' && String(d.refundStatus||'').indexOf('รอคืนเงิน')>=0)
        a.push({key:'cnref',label:'💸 บันทึกเงินคืน',call:'cnRefundOpen('+q+')'});
      if(d.kind==='CN' && d.refundSlip)
        a.push({key:'cnslip',label:'📎 สลิปคืนเงิน',href:d.refundSlip});
      a.push({key:'send',label:'📤 ส่งเข้ากลุ่มลูกค้า',call:'salesSend('+q+')'});
      a.push({key:'repdf',label:(d.pdfLink?'🔄 ออกไฟล์ใหม่':'📄 ออกไฟล์ PDF'),call:'salesPdf('+q+')'});
      a.push({sep:true});
      // ยกเลิกได้เฉพาะใบที่ยังไม่รับเงิน และยังไม่มีใบไหนอ้างถึง (ตรงกับ cancelSalesDoc_)
      // ใบลดหนี้ที่คืนเงินไปแล้ว = เงินออกจริง ยกเลิกไม่ได้ (ตรงกับด่านใน cancelSalesDoc_)
      var cnPaidBack=(d.kind==='CN' && String(d.refundStatus||'').indexOf('คืนเงินแล้ว')>=0);
      if(!(d.paidAmt>0) && !salesRefBy(d,'').length && !cnPaidBack)
        a.push({key:'cancel',label:'🚫 ยกเลิกเอกสาร',call:'salesCancel('+q+')',danger:true});
    }
    return a;
  }
  function paintSalesTable(docs){
    var box=$('salesTbl'); if(!box) return;
    if(!docs.length){ box.innerHTML='<div class="card"><div class="emptybox">ยังไม่มีเอกสารขาย 😊</div></div>'; return; }
    // ทุกคอลัมน์เป็น % (รวม 100) → ตารางพอดีจอทุกขนาด · จอแคบกว่า min-width ค่อยเลื่อนแนวนอน
    // (ผสม px กับ % แล้วจอกลาง ๆ คอลัมน์ "เรื่อง" จะโดนบีบจนตัวอักษรเรียงลงแนวตั้ง)
    // ⚠️ ปล่อย "เรื่อง" ไม่ระบุความกว้าง — ให้กินที่ที่เหลือ ผลรวมจะไม่มีทางเกิน 100% (ไม่เกิดแถบเลื่อนแนวนอน)
    var cols=[{label:'เลขที่',cls:'dt-nw',w:'14%'},{label:'วันที่',cls:'dt-nw',w:'9%'},{label:'ลูกค้า',w:'16%'},
      {label:'เรื่อง'},{label:'ยอดรวม',cls:'ta-r',w:'10%'},{label:'คงค้าง',cls:'ta-r',w:'9%'},
      {label:'สถานะ',w:'10%'},{label:'ครบกำหนด',cls:'dt-nw',w:'9%'},{label:'',w:'46px'}];
    var rows=docs.map(function(d){
      SALES_BYNO[d.no]=d;
      var due=d.dueDate?fmtDate(d.dueDate):'—';
      var overdue=(d.balance>0 && d.dueDate && new Date(d.dueDate)<new Date());
      return '<tr>'+
        '<td class="dt-nw">'+esc(d.no)+(d.refNo?'<br><span style="color:#8A94A6;font-size:11px">↩ '+esc(d.refNo)+'</span>':'')+'</td>'+
        '<td class="dt-nw">'+esc(d.docDate?fmtDate(d.docDate):'-')+'</td>'+
        '<td>'+esc(d.customer||'-')+'</td>'+
        '<td class="dt-detail">'+esc(d.title||'-')+
          (d.kind==='CN'&&d.refundStatus?'<br><span style="color:#8A94A6;font-size:11px">'+esc(d.refundStatus)+'</span>':'')+'</td>'+
        // ใบลดหนี้ = ยอดที่หักออกจากยอดขาย → แสดงติดลบสีแดง (ชีตเก็บเป็นบวก)
        '<td class="dt-amt"'+(d.kind==='CN'?' style="color:#DC2626"':'')+'>'+
          (d.kind==='CN'?'-':'')+money(d.total)+'</td>'+
        '<td class="dt-amt">'+(d.balance>0?money(d.balance):'—')+'</td>'+
        '<td><span class="tk-badge '+salesBadge(d.status)+'">'+esc(d.status)+'</span></td>'+
        '<td class="dt-nw"'+(overdue?' style="color:#DC2626;font-weight:600"':'')+'>'+esc(due)+(overdue?' ⚠️':'')+'</td>'+
        dtActCell('sl-'+d.no, salesRowActions(d))+'</tr>';
    });
    // ยอดรวมท้ายตาราง: ใบลดหนี้หักออก (ไม่งั้นยอดที่พี่เห็นบวมกว่าที่ออกบิลจริง)
    var sum=docs.reduce(function(a,d){ var v=Number(d.total)||0; return a+(d.kind==='CN'?-v:v); },0);
    var total=docs.length>1?'<tr class="tax-total"><td colspan="4" style="text-align:right">รวม '+docs.length+' ใบ</td>'+
      '<td class="dt-amt">'+money(sum)+'</td><td colspan="4"></td></tr>':'';
    box.innerHTML=dtTable(cols, rows, total);
  }
  var SALES_BYNO={};
  function salesBadge(s){ s=String(s||'');
    if(s.indexOf('ยกเลิก')>=0) return 'b-cancel';
    if(s.indexOf('รับครบ')>=0) return 'b-done';
    if(s.indexOf('ค้างรับ')>=0||s.indexOf('บางส่วน')>=0) return 'b-doing';
    return 'b-new'; }
  function fmtDate(d){ try{ var x=new Date(d); return ('0'+x.getDate()).slice(-2)+'/'+('0'+(x.getMonth()+1)).slice(-2)+'/'+x.getFullYear(); }catch(e){ return ''; } }

  /** ฟอร์มออกเอกสารใหม่ */
  function salesNew(){
    if(!SALES) return;
    if(!SALES.customers.length){ toast('เพิ่มลูกค้าในทะเบียนก่อนค่ะ'); custManage(); return; }
    SALES_ITEMS=[{}];
    var kinds=SALES.kinds.map(function(k){ return '<option value="'+esc(k.key)+'">'+esc(k.label)+'</option>'; }).join('');
    var ents=SALES.entities.map(function(e){ return '<option value="'+esc(e.code)+'">'+esc(e.name)+(e.vatReg?' (จด VAT)':'')+'</option>'; }).join('');
    var custs=SALES.customers.map(function(c){ return '<option value="'+esc(c.name)+'">'+esc(c.name)+'</option>'; }).join('');
    modal('<h3>➕ ออกเอกสารขาย</h3><div id="mErr" class="m-err hidden"></div>'+
      '<div class="fld"><label>ชนิดเอกสาร</label><select id="slKind" onchange="salesPreview()">'+kinds+'</select></div>'+
      '<div class="fld"><label>ออกในนามบริษัท</label><select id="slEnt" onchange="salesPreview()">'+ents+'</select></div>'+
      '<div class="fld"><label>ลูกค้า</label><select id="slCust">'+custs+'</select></div>'+
      '<div class="fld"><label>วันที่เอกสาร</label><input id="slDate" type="date" value="'+todayISO()+'"></div>'+
      '<div class="fld"><label>เรื่อง</label><input id="slTitle" placeholder="เช่น ค่าบริการบัญชี ก.ย. 2569"></div>'+
      '<div class="fld"><label>รายการ</label><div id="slItems"></div>'+
        '<button class="btn btn-ghost" style="width:100%;margin-top:6px" onclick="salesAddItem()">➕ เพิ่มบรรทัด</button></div>'+
      '<div class="fld"><label>ส่วนลดท้ายบิล (บาท)</label><input id="slDisc" inputmode="decimal" value="0" oninput="salesPreview()"></div>'+
      '<div class="fld"><label>หมายเหตุ</label><textarea id="slNote" placeholder="เงื่อนไขการชำระเงิน ฯลฯ"></textarea></div>'+
      '<div id="slSum" class="m-hint"></div>'+
      '<div class="m-act"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button>'+
      '<button class="btn btn-primary" onclick="salesSave()">ออกเอกสาร</button></div>');
    paintSalesItems();
  }
  function salesAddItem(){ salesReadItems(); SALES_ITEMS.push({}); paintSalesItems(); }
  function salesDelItem(i){ salesReadItems(); SALES_ITEMS.splice(i,1); if(!SALES_ITEMS.length) SALES_ITEMS=[{}]; paintSalesItems(); }
  /** อ่านค่าที่พิมพ์ไว้ก่อน re-render (ไม่งั้นพิมพ์แล้วหายตอนเพิ่มบรรทัด) */
  function salesReadItems(){
    SALES_ITEMS=SALES_ITEMS.map(function(it,i){
      return {
        service:(($('si'+i)||{}).value)||'',
        detail:(($('sd'+i)||{}).value)||'',
        qty:(($('sq'+i)||{}).value)||'',
        price:(($('sp'+i)||{}).value)||''
      };
    });
  }
  function paintSalesItems(){
    var box=$('slItems'); if(!box) return;
    var opts='<option value="">— พิมพ์เอง —</option>'+SALES.services.map(function(s){
      return '<option value="'+esc(s.code)+'">'+esc(s.name)+' ('+money(s.price)+')</option>'; }).join('');
    box.innerHTML=SALES_ITEMS.map(function(it,i){
      return '<div style="border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:6px">'+
        '<div style="display:flex;gap:6px;align-items:center;margin-bottom:6px">'+
          '<select id="si'+i+'" style="flex:1" onchange="salesPickService('+i+')">'+opts+'</select>'+
          (SALES_ITEMS.length>1?'<button class="btn btn-ghost" style="width:auto;padding:6px 10px" onclick="salesDelItem('+i+')">✕</button>':'')+
        '</div>'+
        '<input id="sd'+i+'" placeholder="รายละเอียด" value="'+esc(it.detail||'')+'" style="margin-bottom:6px">'+
        '<div style="display:flex;gap:6px">'+
          '<input id="sq'+i+'" inputmode="decimal" placeholder="จำนวน" value="'+esc(it.qty||'1')+'" oninput="salesPreview()" style="flex:1">'+
          '<input id="sp'+i+'" inputmode="decimal" placeholder="ราคา/หน่วย" value="'+esc(it.price||'')+'" oninput="salesPreview()" style="flex:1">'+
        '</div></div>';
    }).join('');
    SALES_ITEMS.forEach(function(it,i){ var el=$('si'+i); if(el&&it.service) el.value=it.service; });
    salesPreview();
  }
  /** เลือกบริการ → เติมชื่อ/ราคาให้ (ยังแก้ได้ · ค่าที่บันทึกคือค่าที่เห็นตอนนี้ = snapshot) */
  function salesPickService(i){
    var code=($('si'+i)||{}).value;
    var s=null; SALES.services.forEach(function(x){ if(x.code===code) s=x; });
    if(s){ if($('sd'+i)) $('sd'+i).value=s.name; if($('sp'+i)) $('sp'+i).value=s.price; }
    salesPreview();
  }
  /** พรีวิวยอด — คิดแบบเดียวกับ backend (VAT ตามบริษัทที่เลือก) */
  function salesPreview(){
    var box=$('slSum'); if(!box||!SALES) return;
    var ent=null, code=($('slEnt')||{}).value;
    if(!$('slEnt') && EDIT_DOC){ ent={ vatReg: !!EDIT_DOC.vatReg }; }   // ฟอร์มแก้ไข = บริษัทเดิมของใบนั้น
    else SALES.entities.forEach(function(e){ if(e.code===code) ent=e; });
    var sub=0;
    SALES_ITEMS.forEach(function(it,i){
      var q=Number((($('sq'+i)||{}).value||'0').replace(/,/g,''))||0;
      var p=Number((($('sp'+i)||{}).value||'0').replace(/,/g,''))||0;
      sub+=q*p;
    });
    var disc=Number((($('slDisc')||{}).value||'0').replace(/,/g,''))||0;
    if(disc>sub) disc=sub;
    var base=sub-disc;
    var vat=(ent&&ent.vatReg)?Math.round(base*SALES.vatRate)/100:0;
    box.innerHTML='รวมรายการ <b>'+money(sub)+'</b>'+(disc>0?' · ส่วนลด '+money(disc):'')+
      (ent&&ent.vatReg?' · VAT '+SALES.vatRate+'% '+money(vat):' · ไม่มี VAT (บริษัทไม่ได้จด)')+
      '<br>ยอดรวมทั้งสิ้น <b style="font-size:15px">'+money(base+vat)+'</b> บาท';
  }
  function salesSave(){
    salesReadItems();
    var items=SALES_ITEMS.filter(function(it){ return (it.detail||'').trim() || it.service; });
    if(!items.length){ mErr('ใส่รายการอย่างน้อย 1 บรรทัดค่ะ'); return; }
    var p={action:'waSalesCreate',uid:UID,
      kind:($('slKind')||{}).value, entity:($('slEnt')||{}).value, customer:($('slCust')||{}).value,
      docDate:($('slDate')||{}).value, title:(($('slTitle')||{}).value||'').trim(),
      note:(($('slNote')||{}).value||'').trim(), discount:($('slDisc')||{}).value||'0',
      items:JSON.stringify(items)};
    callBusy('กำลังออกเอกสาร…', jsonpPost(p), 'ออกเอกสารแล้ว').then(function(r){
      if(!r||!r.ok){ mErr((r&&r.error)||'ออกเอกสารไม่สำเร็จ'); return; }
      closeModal();
      toast('✅ '+r.no+' · '+money(r.total)+' บาท'+(r.warn?' (⚠️ '+r.warn+')':''));
      renderSales();
    }).catch(function(e){ mErr(e.message); });
  }
  /** ✏️ แก้เอกสารที่ออกไปแล้ว — โหลดค่าเดิมมาให้ แล้วออกไฟล์ใหม่ทับตอนบันทึก
   *  ใบที่รับเงินแล้ว/ใบเสร็จ/ใบวางบิล จะแก้ได้แค่เรื่องกับหมายเหตุ (backend เป็นคนตัดสิน) */
  var EDIT_DOC=null;
  function salesEdit(no){
    busy('กำลังโหลดเอกสาร…');
    jsonp({action:'waSalesGet',uid:UID,no:no}).then(function(r){
      unbusy();
      if(!r||!r.ok){ toast((r&&r.error)||'โหลดไม่สำเร็จ'); return; }
      if(!r.canEdit){ toast(r.why||'ใบนี้แก้ไขไม่ได้ค่ะ'); return; }
      EDIT_DOC=r;
      var d=r.doc;
      SALES_ITEMS=(r.items||[]).map(function(it){
        return { service:it.service||'', detail:it.detail||'', qty:it.qty, price:it.price };
      });
      if(!SALES_ITEMS.length) SALES_ITEMS=[{}];
      var custs=(SALES&&SALES.customers||[]).map(function(c){
        return '<option value="'+esc(c.name)+'"'+(c.name===d.customer?' selected':'')+'>'+esc(c.name)+'</option>'; }).join('');
      var full=r.canAmount;
      modal('<h3>✏️ แก้ '+esc(d.kindLabel)+' '+esc(d.no)+'</h3><div id="mErr" class="m-err hidden"></div>'+
        '<div class="m-hint">ออกในนาม <b>'+esc(d.entityName||d.entity)+'</b> · สถานะ '+esc(d.status)+
        (d.sent?'<br><span style="color:#C8730B">⚠️ ใบนี้ส่งเข้ากลุ่มลูกค้าไปแล้ว — แก้เสร็จต้องกดส่งใหม่ ลูกค้าถึงจะได้ไฟล์ล่าสุด</span>':'')+
        (full?'':'<br><span style="color:#C8730B">⚠️ '+esc(r.why)+'</span>')+'</div>'+
        (full?('<div class="fld"><label>ลูกค้า</label><select id="edCust">'+custs+'</select></div>'+
          '<div class="fld"><label>วันที่เอกสาร</label><input id="edDate" type="date" value="'+esc(d.docDate||'')+'"></div>'):'')+
        '<div class="fld"><label>เรื่อง</label><input id="edTitle" value="'+esc(d.title||'')+'"></div>'+
        (full?('<div class="fld"><label>รายการ</label><div id="slItems"></div>'+
          '<button class="btn btn-ghost" style="width:100%;margin-top:6px" onclick="salesAddItem()">➕ เพิ่มบรรทัด</button></div>'+
          '<div class="fld"><label>ส่วนลดท้ายบิล (บาท)</label>'+
            '<input id="slDisc" inputmode="decimal" value="'+esc(String(d.discount||0))+'" oninput="salesPreview()"></div>'):'')+
        '<div class="fld"><label>หมายเหตุ</label><textarea id="edNote">'+esc(d.note||'')+'</textarea></div>'+
        (full?'<div id="slSum" class="m-hint"></div>':'<div class="m-hint">ยอดรวม '+money(d.total)+' บาท (แก้ไม่ได้)</div>')+
        '<div class="m-act"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button>'+
        '<button class="btn btn-primary" onclick="salesEditSave(\''+esc(no)+'\')">บันทึกการแก้ไข</button></div>');
      if(full){
        // ใช้ตัวแก้รายการชุดเดียวกับฟอร์มออกเอกสาร (ของจริงกับที่นี่ต้องคิดยอดเหมือนกัน)
        var ent=null; (SALES&&SALES.entities||[]).forEach(function(x){ if(x.code===d.entity) ent=x; });
        EDIT_DOC.vatReg=ent?ent.vatReg:false;
        paintSalesItems();
      }
    }).catch(function(e){ unbusy(); toast(e.message); });
  }
  function salesEditSave(no){
    var p={action:'waSalesEdit',uid:UID,no:no,
      title:((($('edTitle')||{}).value)||'').trim(), note:((($('edNote')||{}).value)||'').trim()};
    if(EDIT_DOC && EDIT_DOC.canAmount){
      salesReadItems();
      var items=SALES_ITEMS.filter(function(it){ return (it.detail||'').trim() || it.service; });
      if(!items.length){ mErr('ใส่รายการอย่างน้อย 1 บรรทัดค่ะ'); return; }
      p.items=JSON.stringify(items);
      p.customer=($('edCust')||{}).value||'';
      p.docDate=($('edDate')||{}).value||'';
      p.discount=($('slDisc')||{}).value||'0';
    }
    callBusy('กำลังบันทึก…', jsonpPost(p), 'บันทึกแล้ว').then(function(r){
      if(!r||!r.ok){ mErr((r&&r.error)||'บันทึกไม่สำเร็จ'); return; }
      closeModal();
      if(!(r.changed||[]).length){ toast('ไม่มีอะไรเปลี่ยนค่ะ'); return; }
      toast('✏️ แก้ '+(r.changed||[]).join(', ')+' แล้ว · ออกไฟล์ใหม่ให้'+
        (r.resent?' — อย่าลืมกดส่งเข้ากลุ่มใหม่':'')+(r.warn?' ⚠️ '+r.warn:''));
      renderSales();
    }).catch(function(e){ mErr(e.message); });
  }

  function salesSend(no){
    callBusy('กำลังส่งเข้ากลุ่มลูกค้า…', jsonp({action:'waSalesSend',uid:UID,no:no}), 'ส่งแล้ว').then(function(r){
      if(!r||!r.ok){ toast((r&&r.error)||'ส่งไม่สำเร็จ'); return; }
      toast('📤 ส่ง '+no+' เข้ากลุ่ม '+(r.customer||'')+' แล้ว'); renderSales();
    }).catch(function(e){ toast(e.message); });
  }
  function salesPdf(no){
    callBusy('กำลังออกไฟล์…', jsonp({action:'waSalesPdf',uid:UID,no:no}), 'ออกไฟล์แล้ว').then(function(r){
      if(!r||!r.ok){ toast((r&&r.error)||'ออกไฟล์ไม่สำเร็จ'); return; }
      toast('📄 ออกไฟล์ใหม่แล้ว'); renderSales();
    }).catch(function(e){ toast(e.message); });
  }
  function salesCancel(no){
    modal('<h3>🚫 ยกเลิกเอกสาร</h3><div id="mErr" class="m-err hidden"></div>'+
      '<div class="m-hint">ยกเลิก <b>'+esc(no)+'</b> — เอกสารจะไม่ถูกนับในรายงาน<br>'+
      '<span style="color:#C8730B">ใบที่รับเงินมาแล้วยกเลิกไม่ได้ (ต้องออกใบลดหนี้แทน)</span></div>'+
      '<div class="m-act"><button class="btn btn-ghost" onclick="closeModal()">ปิด</button>'+
      '<button class="btn btn-danger" onclick="salesCancelDo(\''+esc(no)+'\')">ยกเลิกเอกสาร</button></div>');
  }
  function salesCancelDo(no){
    callBusy('กำลังยกเลิก…', jsonp({action:'waSalesCancel',uid:UID,no:no}), 'ยกเลิกแล้ว').then(function(r){
      if(!r||!r.ok){ mErr((r&&r.error)||'ยกเลิกไม่สำเร็จ'); return; }
      closeModal(); toast('🚫 ยกเลิก '+no+' แล้ว'); renderSales();
    }).catch(function(e){ mErr(e.message); });
  }

  /** ➡️ ออกใบแจ้งหนี้จากใบเสนอราคา (คัดรายการมาให้ทั้งชุด · ใบเสนอราคาจะขึ้น "ลูกค้าตอบรับ") */
  function salesToInvoice(no){
    var d=SALES_BYNO[no]||{};
    modal('<h3>➡️ ออกใบแจ้งหนี้</h3><div id="mErr" class="m-err hidden"></div>'+
      '<div class="m-hint">จากใบเสนอราคา <b>'+esc(no)+'</b>'+(d.customer?' · '+esc(d.customer):'')+
      (d.total?' · '+money(d.total)+' บาท':'')+'<br>รายการและยอดทั้งหมดถูกคัดมาให้ ครบกำหนดชำระคิดจากเครดิตเทอมของลูกค้า</div>'+
      '<div class="fld"><label>วันที่ใบแจ้งหนี้</label><input id="ivDate" type="date" value="'+todayISO()+'"></div>'+
      '<div class="m-act"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button>'+
      '<button class="btn btn-primary" onclick="salesToInvoiceDo(\''+esc(no)+'\')">ออกใบแจ้งหนี้</button></div>');
  }
  function salesToInvoiceDo(no){
    callBusy('กำลังออกใบแจ้งหนี้…', jsonp({action:'waSalesFromQuote',uid:UID,no:no,
      docDate:(($('ivDate')||{}).value||'')}), 'ออกใบแจ้งหนี้แล้ว').then(function(r){
      if(!r||!r.ok){ mErr((r&&r.error)||'ออกใบแจ้งหนี้ไม่สำเร็จ'); return; }
      closeModal(); toast('✅ '+r.no+' · '+money(r.total)+' บาท'+(r.warn?' (⚠️ '+r.warn+')':'')); renderSales();
    }).catch(function(e){ mErr(e.message); });
  }

  /** 📑 ใบวางบิล — ติ๊กใบแจ้งหนี้ค้างของลูกค้ารายเดียว (no = ใบที่กดมาจากเมนู · ว่าง = เริ่มจากเลือกลูกค้า) */
  var BN_PICK={};
  function salesBnOpen(no){
    if(!SALES) return;
    var open=(SALES.openIvs||[]).filter(function(x){ return !x.bnNo; });
    if(!open.length){ toast('ไม่มีใบแจ้งหนี้ค้างที่ยังไม่ได้วางบิลค่ะ'); return; }
    var d=no?SALES_BYNO[no]:null;
    var cust=(d&&d.customer)||open[0].customer;
    BN_PICK={}; if(no) BN_PICK[no]=true;
    var custs=[]; open.forEach(function(x){ if(custs.indexOf(x.customer)<0) custs.push(x.customer); });
    modal('<h3>📑 ออกใบวางบิล</h3><div id="mErr" class="m-err hidden"></div>'+
      '<div class="m-hint">รวมใบแจ้งหนี้ที่ยังค้างของลูกค้ารายเดียวไปวางบิลรอบเดียว<br>'+
      'ยอดที่ยกมาคือ<b>ยอดคงค้าง</b>ของแต่ละใบ — ไม่คิด VAT ใหม่ และไม่ตั้งเป็นหนี้ก้อนใหม่</div>'+
      '<div class="fld"><label>ลูกค้า</label><select id="bnCust" onchange="salesBnPaint()">'+
        custs.map(function(c){ return '<option value="'+esc(c)+'"'+(c===cust?' selected':'')+'>'+esc(c)+'</option>'; }).join('')+
      '</select></div>'+
      '<div class="fld"><label>ใบแจ้งหนี้ที่จะวางบิล</label><div id="bnList"></div></div>'+
      '<div class="fld"><label>วันที่ใบวางบิล</label><input id="bnDate" type="date" value="'+todayISO()+'"></div>'+
      '<div class="fld"><label>เรื่อง (ไม่ใส่ก็ได้)</label><input id="bnTitle" placeholder="เช่น วางบิลค่าบริการ ก.ย. 2569"></div>'+
      '<div id="bnSum" class="m-hint"></div>'+
      '<div class="m-act"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button>'+
      '<button class="btn btn-primary" onclick="salesBnSave()">ออกใบวางบิล</button></div>');
    salesBnPaint();
  }
  function salesBnPaint(){
    var box=$('bnList'); if(!box||!SALES) return;
    var cust=($('bnCust')||{}).value;
    var list=(SALES.openIvs||[]).filter(function(x){ return !x.bnNo && x.customer===cust; });
    box.innerHTML=list.length?list.map(function(x){
      var id='bn_'+x.no.replace(/[^A-Za-z0-9]/g,'_');
      return '<label style="display:flex;gap:8px;align-items:flex-start;padding:7px 8px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px">'+
        '<input type="checkbox" id="'+id+'" data-no="'+esc(x.no)+'"'+(BN_PICK[x.no]?' checked':'')+' onchange="salesBnTick()" style="margin-top:3px">'+
        '<span style="flex:1"><b>'+esc(x.no)+'</b> · '+money(x.balance)+' บาท'+
        (x.paidAmt>0?' <span style="color:#C8730B">(รับแล้ว '+money(x.paidAmt)+')</span>':'')+
        '<br><span style="color:#8A94A6;font-size:11.5px">'+esc(x.title||'-')+
        (x.dueDate?' · ครบกำหนด '+fmtDate(x.dueDate):'')+'</span></span></label>';
    }).join(''):'<div class="emptybox">ลูกค้ารายนี้ไม่มีใบแจ้งหนี้ค้างค่ะ</div>';
    salesBnTick();
  }
  function salesBnTick(){
    BN_PICK={};
    var sum=0, n=0;
    Array.prototype.forEach.call(document.querySelectorAll('#bnList input[type=checkbox]'), function(c){
      if(!c.checked) return;
      BN_PICK[c.dataset.no]=true; n++;
      (SALES.openIvs||[]).forEach(function(x){ if(x.no===c.dataset.no) sum+=Number(x.balance)||0; });
    });
    var box=$('bnSum');
    if(box) box.innerHTML=n?('เลือก <b>'+n+'</b> ใบ · ยอดวางบิลรวม <b style="font-size:15px">'+money(sum)+'</b> บาท')
      :'ยังไม่ได้เลือกใบแจ้งหนี้';
  }
  function salesBnSave(){
    var nos=Object.keys(BN_PICK);
    if(!nos.length){ mErr('เลือกใบแจ้งหนี้อย่างน้อย 1 ใบค่ะ'); return; }
    callBusy('กำลังออกใบวางบิล…', jsonp({action:'waSalesBn',uid:UID,
      customer:($('bnCust')||{}).value, ivNos:JSON.stringify(nos),
      docDate:(($('bnDate')||{}).value||''), title:(($('bnTitle')||{}).value||'').trim()}),
      'ออกใบวางบิลแล้ว').then(function(r){
      if(!r||!r.ok){ mErr((r&&r.error)||'ออกใบวางบิลไม่สำเร็จ'); return; }
      closeModal(); toast('✅ '+r.no+' · รวม '+r.count+' ใบ · '+money(r.total)+' บาท'+(r.warn?' (⚠️ '+r.warn+')':''));
      renderSales();
    }).catch(function(e){ mErr(e.message); });
  }

  // ═══════════ VIEW: 📐 ภ.ง.ด.51 ประมาณการภาษีครึ่งปี (spec-pnd51.md §7 · 2 ก.ย. 2569) ═══════════
  // ⚠️ เครดิตภาษีของหน้านี้ = ภาษีที่ "ลูกค้าหักเรา" เท่านั้น (ชีตรับชำระ)
  //    ทะเบียน 50 ทวิ / ภ.ง.ด.1-3-53 ของระบบ = ภาษีที่เราหักคนอื่น ห้ามเอามาเครดิต
  // ⚠️ คำนวณสดฝั่งนี้ระหว่างพิมพ์เพื่อความลื่น — แต่ "บันทึกจริง" backend คำนวณซ้ำเสมอ
  //    (ฟังก์ชัน p51Profit/p51HalfTax/p51Risk ต้องให้ผลตรงกับ Pnd51.gs เป๊ะ · เทสเทียบสองฝั่งไว้แล้ว)
  var P51 = { init:null, mode:'list', ent:'', year:0, sc:{}, key:'mid', wht:'', whtSrc:'manual',
    other:'', expected:'', sme:null, auto:null, period:null, history:[], growth:null, job:null,
    // ฟอร์มตามแบบราชการ · method ว่าง = ประมาณการ ม.67 ทวิ (1)
    method:'', filing:'', filingSeq:'', h1Profit:'' };
  var P51_M_EST = 'ประมาณการ (ม.67 ทวิ (1))';
  var P51_M_ACT = 'กำไรจริงครึ่งรอบ (ม.67 ทวิ (2))';
  var P51_F_NORMAL = 'ยื่นปกติ', P51_F_EXTRA = 'ยื่นเพิ่มเติม';
  function p51IsActual(){ return P51.method === P51_M_ACT; }
  var P51_FIELDS = [
    { k:'revenue',          label:'รายได้' },
    { k:'cost',             label:'ต้นทุน' },
    { k:'otherIncome',      label:'รายได้อื่น' },
    { k:'adminExpense',     label:'ค่าใช้จ่ายบริหาร' },
    { k:'addBack',          label:'บวกกลับ (รายจ่ายต้องห้าม)' },
    { k:'lossCarryforward', label:'ขาดทุนสะสมยกมา' }
  ];
  var P51_KEYS = ['low','mid','high'];
  var P51_SCLB = { low:'ต่ำ', mid:'กลาง', high:'สูง' };

  // ── ฟังก์ชันคำนวณ (ฝาแฝดของ Pnd51.gs · เทส pluck ทั้งสองฝั่งมาเทียบกัน) ──
  function p51n(v){ var n = parseFloat(String(v == null ? '' : v).replace(/,/g, '')); return isNaN(n) ? 0 : n; }
  // ⚠️ ต้องปัดแบบเดียวกับ toSatang_ ของ backend เป๊ะ — Math.round ตรง ๆ ให้ผลต่างกัน 1 สตางค์
  //    ในเคสที่ทศนิยมลอย (1.005*100 = 100.4999… → ปัดได้ 100 แทนที่จะเป็น 101)
  //    เจอจากเทสสุ่ม 300 เคส (test-pnd51-ui.js) — ต่างกัน 2 เคส · หน้าเว็บโชว์เลขหนึ่ง ชีตบันทึกอีกเลข
  function p51r2(n){ return Math.round(Number(((Number(n) || 0) * 100).toPrecision(15))) / 100; }
  /** ประมาณการกำไรสุทธิทางภาษีทั้งปี — ขาดทุนยกมาหักได้ไม่เกินกำไร */
  function p51Profit(s){
    s = s || {};
    var forTax = p51n(s.revenue) - p51n(s.cost) + p51n(s.otherIncome) - p51n(s.adminExpense) + p51n(s.addBack);
    return p51r2(forTax - Math.min(p51n(s.lossCarryforward), Math.max(forTax, 0)));
  }
  /** ภาษีครึ่งปี — ขั้นบันได SME คิดกับ "กึ่งหนึ่งของกำไรทั้งปี" ตามแบบ ภ.ง.ด.51 */
  /** ภาษีจาก "ฐาน" ที่ให้มาตรง ๆ — ฝาแฝดของ pnd51TaxOnBase_ (ใช้ร่วมทั้ง 2 วิธีของแบบ) */
  function p51TaxOnBase(base, isSME){
    var b = Math.max(p51n(base), 0);
    if(!isSME) return p51r2(b * 0.20);
    return p51r2(Math.min(Math.max(b - 300000, 0), 2700000) * 0.15 + Math.max(b - 3000000, 0) * 0.20);
  }
  function p51HalfTax(annualProfit, isSME){
    // ปัด "กึ่งหนึ่งของกำไร" ก่อนเข้าอัตราเสมอ — ตรงกับ pnd51HalfBase_ ของ backend
    // (ไม่ปัดก่อน = ต่างกัน 1 สตางค์เมื่อกำไรเป็นเลขคี่ทศนิยม · เจอจากเทสสุ่ม)
    return p51TaxOnBase(p51r2(Math.max(p51n(annualProfit), 0) / 2), isSME);
  }
  /** เพดานเสี่ยง = ประมาณการ × 1.25 (เกณฑ์เฝ้าระวังของทีม ไม่ใช่คำวินิจฉัยของสรรพากร) */
  function p51Risk(est, expected){
    var e = Math.max(p51n(est), 0), x = Math.max(p51n(expected), 0);
    var ceiling = p51r2(e * 1.25), ratio = e > 0 ? x / e : 0;
    var level = 'ปลอดภัย';
    if(e > 0){ if(ratio > 1.25) level = 'เสี่ยง'; else if(ratio > 1) level = 'เฝ้าระวัง'; }
    return { ceiling:ceiling, isRisky:x > ceiling, level:level,
      excess: x > ceiling ? p51r2(x - ceiling) : 0,
      excessPct: e > 0 ? p51r2((ratio - 1) * 100) : 0,
      gaugeRatio: p51r2(Math.min(ratio, 1.5)) };
  }
  /** ผลลัพธ์ครบชุดของฉากทัศน์ที่เลือก (ใช้ทั้งฝั่งขวาและปุ่มสลับฉากทัศน์) */
  function p51Calc(st){
    var s = (st.sc || {})[st.key] || {};
    var profit = p51Profit(s);
    var isSME = st.sme !== false;
    // วิธี (2) ม.67 ทวิ (2): ฐานภาษี = กำไรจริงครึ่งรอบตรง ๆ (ไม่หารครึ่ง) · ไม่มีเรื่องประมาณการขาด
    var actual = st.method === P51_M_ACT;
    var base = actual ? Math.max(p51n(st.h1Profit), 0) : p51r2(Math.max(profit, 0) / 2);
    var halfTax = p51TaxOnBase(base, isSME);
    var net = p51r2(halfTax - p51n(st.wht) - p51n(st.other));
    var expected = st.expected === '' || st.expected == null ? p51Profit((st.sc || {}).mid || s) : p51n(st.expected);
    return { profit:profit, half:base, isActual:actual, isSME:isSME, halfTax:halfTax,
      taxDue: net > 0 ? net : 0, refundable: net < 0 ? p51r2(-net) : 0,
      expected:expected, expectedIsDefault: st.expected === '' || st.expected == null,
      risk: actual
        ? { ceiling:0, isRisky:false, excess:0, excessPct:0, gaugeRatio:0, level:'ปลอดภัย', notApplicable:true }
        : p51Risk(profit, expected),
      penalty: (function(){
        if(actual) return 0;   // ไม่มีประมาณการ = ไม่มีเงินเพิ่ม ม.67 ตรี
        var r = p51Risk(profit, expected);
        return r.isRisky ? p51r2(Math.max(p51HalfTax(expected, isSME) - halfTax, 0) * 0.20) : 0;
      })() };
  }
  window.p51Profit = p51Profit; window.p51HalfTax = p51HalfTax; window.p51TaxOnBase = p51TaxOnBase; window.p51Risk = p51Risk; window.p51Calc = p51Calc;

  /** เกจครึ่งวงกลม — เขียว <1.0 · เหลือง 1.0–1.25 · แดง >1.25 (สเกล 0–1.5 เท่า) */
  function p51Gauge(ratio, level){
    var cx = 110, cy = 104, r = 84;
    function pt(t){ var a = Math.PI * (1 - Math.min(Math.max(t, 0), 1.5) / 1.5);
      return [p51r2(cx + r * Math.cos(a)), p51r2(cy - r * Math.sin(a))]; }
    function arc(t1, t2, color){
      var a = pt(t1), b = pt(t2);
      return '<path d="M' + a[0] + ' ' + a[1] + ' A' + r + ' ' + r + ' 0 0 1 ' + b[0] + ' ' + b[1] +
        '" fill="none" stroke="' + color + '" stroke-width="15" stroke-linecap="round"/>';
    }
    var n = pt(ratio), tail = pt(0);
    var col = level === 'เสี่ยง' ? '#DC2626' : (level === 'เฝ้าระวัง' ? '#C8730B' : '#0f6e56');
    return '<svg viewBox="0 0 220 128" role="img" aria-label="ระดับความเสี่ยง ' + esc(level) + '">' +
      arc(0, 1.0, '#BFE3D5') + arc(1.0, 1.25, '#F3D9A6') + arc(1.25, 1.5, '#F3B4B4') +
      '<line x1="' + cx + '" y1="' + cy + '" x2="' + n[0] + '" y2="' + n[1] + '" stroke="' + col + '" stroke-width="3.5" stroke-linecap="round"/>' +
      '<circle cx="' + cx + '" cy="' + cy + '" r="5.5" fill="' + col + '"/>' +
      '<text x="' + (tail[0] + 2) + '" y="' + (cy + 16) + '" font-size="10" fill="#8A94A6">0%</text>' +
      '<text x="' + cx + '" y="14" font-size="10" fill="#8A94A6" text-anchor="middle">+25% (เพดาน)</text>' +
      '</svg>';
  }
  function p51RiskBadge(level){
    var c = level === 'เสี่ยง' ? 'p51-b-risk' : (level === 'เฝ้าระวัง' ? 'p51-b-watch' : 'p51-b-safe');
    return '<span class="p51-badge ' + c + '">' + esc(level) + '</span>';
  }
  function p51DateText(d){ if(!d) return '-'; var x = new Date(d);
    return x.getDate() + ' ' + (['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'][x.getMonth()]) + ' ' + (x.getFullYear() + 543); }
  function p51DaysLeft(d){ if(!d) return null;
    return Math.ceil((new Date(d).setHours(0,0,0,0) - new Date().setHours(0,0,0,0)) / 86400000); }

  // ───────────── Screen A: รายการงาน ─────────────

    h += '<div class="card"><div class="ds-h">เริ่มคำนวณ</div><div class="p51-fr">' +

    var ents = (r.entities || []).slice().sort(function(a, b){ return new Date(a.dueDate) - new Date(b.dueDate); });

  // ───────────── Screen B: หน้าคำนวณ ─────────────
  function p51Open(ent, year){
    P51.ent = String(ent || ''); P51.year = parseInt(year, 10) || 0;
    P51.mode = 'calc';
    skel();
    jsonp({ action:'waPnd51Load', uid:UID, entity:P51.ent, year:P51.year }).then(function(r){
      if(!r || !r.ok){ toast((r && r.error) || 'โหลดไม่สำเร็จ'); return p51List(); }
      P51.entity = r.entity; P51.period = r.period; P51.history = r.history || []; P51.growth = r.growth;
      P51.job = r.job || null;
      if(r.job && r.job.scenarios && r.job.scenarios[r.job.scenarioKey]){
        P51.sc = r.job.scenarios; P51.key = r.job.scenarioKey;
        P51.wht = r.job.whtCredit || ''; P51.whtSrc = r.job.whtSource || 'manual';
        P51.other = r.job.otherCredit || ''; P51.expected = r.job.expectedProfit || '';
        P51.auto = r.job.auto || null;
        P51.sme = null;
        P51.method = r.job.method || ''; P51.filing = r.job.filingType || '';
        P51.filingSeq = r.job.filingSeq || ''; P51.h1Profit = r.job.h1Profit || '';
        p51Calcview();
        if(P51.pendingDoc){ P51.pendingDoc = false; p51Preview(); }
      } else {
        // งานใหม่: โชว์ฟอร์มเปล่าทันที (ไม่ให้พี่มองจอว่าง) แล้วดึงยอดครึ่งปีจริงตามมาเติม
        P51.sc = { low:{}, mid:{}, high:{} }; P51.key = 'mid';
        P51.wht = ''; P51.whtSrc = 'manual'; P51.other = ''; P51.expected = '';
        P51.auto = null; P51.sme = null; P51.autoLoading = true;
        P51.method = ''; P51.filing = ''; P51.filingSeq = ''; P51.h1Profit = '';
        p51Calcview();
        p51PullAuto(true);
      }
    }).catch(function(e){ toast(e.message); p51List(); });
  }

  /** ดึงครึ่งปีจริงจากระบบ → ตั้งฉากทัศน์ให้ (พี่แก้ทับได้ทุกช่อง) */
  function p51PullAuto(first){
    if(!first) busy('กำลังดึงยอดครึ่งปีแรกจากระบบ…');
    P51.autoLoading = true;
    if(first) p51Recalc();   // โชว์ป้าย "กำลังดึงยอด…" บนกล่องขวา
    // อ่านชีตขาย/จ่ายออก/ใบเบิก/เงินเดือน 6 เดือน/รับชำระ → ต้องรอนานกว่า 60 วิ (backend แคชผลไว้ 5 นาที)
    // ปุ่ม 🔄 (ไม่ใช่ครั้งแรก) = fresh=1 ข้ามแคช เอายอดล่าสุด
    jsonp({ action:'waPnd51Auto', uid:UID, entity:P51.ent, year:P51.year, fresh:first?'':'1' }, 0, 150000).then(function(r){
      unbusy();
      P51.autoLoading = false;
      if(!r || !r.ok){
        toast((r && r.error) || 'ดึงข้อมูลไม่สำเร็จ');
        if(first) p51Recalc();   // ฟอร์มยังอยู่ กรอกเองต่อได้ (ไม่เด้งกลับหน้ารายการ)
        return;
      }
      P51.auto = r.auto; P51.period = r.period || P51.period;
      P51.sc = r.scenarios;
      if(!first) P51.key = P51.key || 'mid';
      if(r.auto && r.auto.whtReady && r.auto.wht){ P51.wht = r.auto.wht; P51.whtSrc = 'auto'; }
      p51Calcview();
      if(!first) toast('ดึงยอดครึ่งปีแรกมาแล้ว — ปรับตัวเลขได้ตามจริง');
    }).catch(function(e){
      unbusy(); P51.autoLoading = false;
      toast(e.message + ' — กรอกตัวเลขเองได้เลย หรือกดปุ่ม 🔄 ลองใหม่');
      if(first) p51Recalc();
    });
  }

  function p51Calcview(){
    var e = P51.entity || {}, per = P51.period || {};
    var h = '<div class="section-h">📐 ภ.ง.ด.51 · ' + esc(e.name || e.code || '') + ' · ปี ' + P51.year + '</div>' +

    // ①b ฟอร์มตามแบบ ภ.ง.ด.51 (วิธีคำนวณ + ประเภทการยื่น)

      '</div>';
    if(isAct){
      h += '<div style="margin-top:10px"><label class="fl">กำไรสุทธิจริงของครึ่งรอบแรก (บาท)</label>' +

        '<div class="p51-note">ยอดนี้เอาไปคิดภาษีตรง ๆ ไม่หารครึ่ง · ต้องมาจากงบครึ่งปีที่สอบทานแล้ว</div></div>';
    }
    var isExtra = P51.filing === P51_F_EXTRA;
    h += '<div class="ds-h" style="margin:14px 0 8px">ประเภทการยื่น</div><div class="p51-opt">' +

    h += '<div class="card"><div class="ds-h">③ ผลประกอบการย้อนหลัง</div>';

        P51.history.map(function(y){

            '<td class="rl" style="text-align:right">' + money(y.netProfit) + '</td>' +
            '<td class="rl" style="text-align:right">' + y.profitMargin + '%</td>' +
            '<td class="rl" style="text-align:right">' + (y.annualTax ? money(y.annualTax) : '-') + '</td>' +
            '<td class="rl"><button class="btn btn-ghost" style="padding:4px 9px;font-size:11.5px;width:auto" onclick="p51UseRef(' + y.year + ')">ใช้ค่านี้</button></td></tr>';
        }).join('') + '</tbody></table></div>';
      if(P51.growth && P51.growth.ready){
        h += '<div class="p51-src">📈 รายได้เติบโตเฉลี่ย (CAGR) ' + P51.growth.rate + '% ต่อปี จาก ' + P51.growth.years + ' ปีที่เป็นข้อมูลจริง</div>';
      } else {
        h += '<div class="p51-src">ข้อมูลจริงยังไม่ถึง 2 ปี — ยังคำนวณอัตราเติบโตให้ไม่ได้</div>';
      }

    h += '</div>';

    // ③ ประมาณการ 3 ฉากทัศน์
    h += '<div class="card"><div class="ds-h">④ ประมาณการทั้งปี — 3 ฉากทัศน์</div>' +
      '<div class="tax-acts p51-acts" style="margin:0 0 10px"><button class="btn btn-ghost" onclick="p51PullAuto(false)">🔄 ดึงยอดครึ่งปีแรกล่าสุดจากระบบ (× 2)</button></div>' +
      '<div class="p51-grid"><table><thead><tr><th>รายการ</th>' +

      P51_FIELDS.map(function(f){
        return '<tr><td class="rl">' + esc(f.label) + '</td>' + P51_KEYS.map(function(k){
          var v = ((P51.sc || {})[k] || {})[f.k];
          return '<td><input id="p51_' + k + '_' + f.k + '" inputmode="decimal" value="' + esc(v == null || v === '' ? '' : v) + '" oninput="p51Touch()"></td>';
        }).join('') + '</tr>';

      '<tr><td class="rl"><b>กำไรทางภาษี</b></td>' +

      '</tbody></table></div>' +
      '<div class="p51-note">ระบบไม่ตัดอายุขาดทุนสะสม 5 ปีให้ — กรอกเฉพาะยอดที่ใช้สิทธิ์ได้จริงในปีนี้</div></div>';

    // ④ กำไรจริงที่คาด + ⑤ เครดิตภาษี
    h += '<div class="card"><div class="ds-h">⑤ คาดการณ์กำไรจริงปลายปี (ใช้เช็คความเสี่ยงเงินเพิ่ม)</div>' +
      '<input id="p51Exp" class="tax-inp" inputmode="decimal" placeholder="ไม่กรอก = ใช้ฉากทัศน์กลาง" value="' + esc(P51.expected === '' ? '' : P51.expected) + '" oninput="p51Touch()">' +
      '<div class="p51-note">ถ้ากำไรจริงปลายปีสูงกว่าประมาณการเกิน 25% อาจถูกเรียกเงินเพิ่ม 20% ของภาษีที่ชำระขาด (ม.67 ตรี)</div></div>';

    var whtSrc = P51.auto && P51.auto.parts && P51.auto.parts.wht;
    h += '<div class="card"><div class="ds-h">⑥ เครดิตภาษี</div><div class="p51-fr">' +
      '<div><label class="fl">ภาษีที่ลูกค้าหักเรา (50 ทวิ)</label>' +
      '<input id="p51Wht" class="tax-inp" inputmode="decimal" value="' + esc(P51.wht === '' ? '' : P51.wht) + '" oninput="p51WhtManual()">' +
      '<div class="p51-src">' + esc(whtSrc ? whtSrc.source : 'กรอกยอดรวมจาก 50 ทวิ ที่ลูกค้าออกให้เรา ในครึ่งปีแรก') + '</div></div>' +
      '<div><label class="fl">เครดิตภาษีอื่น</label>' +

    // ที่มาของตัวเลขที่ระบบดึงมา
    if(P51.auto && P51.auto.sources){

            '<td class="rl" style="color:#8A94A6;white-space:normal">' + esc(s.from) + '</td></tr>';
        }).join('') + '</tbody></table></div></div>';
    }

    h += '</div><div class="p51-side" id="p51Side"></div></div>';
    $('main').innerHTML = h;
    p51Recalc();
  }

  /** อ่านค่าจากฟอร์ม → state (จุดเดียวที่ sync ฟอร์ม→state) */
  function p51Read(){
    P51_KEYS.forEach(function(k){
      P51.sc[k] = P51.sc[k] || {};
      P51_FIELDS.forEach(function(f){
        var el = $('p51_' + k + '_' + f.k);
        if(el) P51.sc[k][f.k] = el.value;
      });
    });
    var h1 = $('p51H1'), sq = $('p51Seq');
    if(h1) P51.h1Profit = h1.value;
    if(sq) P51.filingSeq = sq.value;
    var ex = $('p51Exp'), w = $('p51Wht'), o = $('p51Other'), sme = $('p51Sme');
    if(ex) P51.expected = ex.value;
    if(w) P51.wht = w.value;
    if(o) P51.other = o.value;
    if(sme) P51.sme = sme.value === '1' ? true : (sme.value === '0' ? false : null);
  }
  function p51Touch(){ p51Read(); p51Recalc(); }
  function p51WhtManual(){ P51.whtSrc = 'manual'; p51Touch(); }
  function p51SetScenario(k){ p51Read(); P51.key = k; p51Calcview(); }
  function p51SetMethod(m){ p51Read(); P51.method = (m === 'act') ? P51_M_ACT : P51_M_EST; p51Calcview(); }
  function p51SetFiling(f){ p51Read(); P51.filing = (f === 'x') ? P51_F_EXTRA : P51_F_NORMAL; p51Calcview(); }
  function p51Back(){ P51.mode = 'list'; renderPnd51(); }

  /** เติมฉากทัศน์จากปีอ้างอิง (คูณให้เท่าปีเต็ม ไม่ใช่ครึ่งปี) */
  function p51UseRef(year){
    var y = P51.history.filter(function(x){ return x.year === year; })[0];
    if(!y) return;
    p51Read();
    P51_KEYS.forEach(function(k){
      var f = k === 'low' ? 0.9 : (k === 'high' ? 1.1 : 1);
      P51.sc[k] = P51.sc[k] || {};
      P51.sc[k].revenue = p51r2(y.revenue * f);
      P51.sc[k].cost = P51.sc[k].cost || 0;
      P51.sc[k].adminExpense = P51.sc[k].adminExpense || 0;
    });
    p51Calcview();
    toast('ใส่รายได้จากปี ' + year + ' ให้แล้ว — ปรับต้นทุน/ค่าใช้จ่ายต่อได้เลย');
  }

  /** วาดฝั่งขวา (เกจ + ยอด + ที่มาของตัวเลข) — เรียกทุกครั้งที่พิมพ์ */
  function p51Recalc(){
    var side = $('p51Side'); if(!side) return;
    var c = p51Calc(P51);
    P51_KEYS.forEach(function(k){
      var el = $('p51sum_' + k);
      if(el) el.textContent = money(p51Profit(P51.sc[k] || {}));
    });
    var warn = [];
    if(c.expectedIsDefault) warn.push('ยังไม่กรอกกำไรจริงที่คาดการณ์ — ใช้ค่าจากฉากทัศน์กลางแทน');
    if(!p51n(P51.wht)) warn.push('ยังไม่มีภาษีที่ลูกค้าหักเรา — ถ้ามี 50 ทวิ ที่ลูกค้าออกให้ ต้องกรอกเอง');
    if(P51.entity && !p51n(P51.entity.paidCapital) && P51.sme === null) warn.push('ยังไม่กรอกทุนจดทะเบียนในชีตนิติบุคคล — ระบบเดาให้ว่าเป็น SME');
    if(P51.auto && P51.auto.warnings) P51.auto.warnings.forEach(function(w){ if(warn.indexOf(w) < 0) warn.push(w); });

    var h = '';
    if(P51.autoLoading){
      h += '<div class="p51-warn" style="background:#EEF4FF;border-color:#C7D8F5;color:#1B4E9B">' +
        '⏳ กำลังดึงยอดครึ่งปีแรกจากระบบ… (อ่านชีตขาย/จ่ายออก/ใบเบิก/เงินเดือน) ' +
        'ระหว่างนี้กรอกตัวเลขเองได้เลย พอดึงเสร็จจะเติมให้</div>';
    }
    h += '<div class="card"><div class="p51-gauge">' + p51Gauge(c.risk.gaugeRatio, c.risk.level) +
      '<div class="g-vl">' + (c.risk.excessPct >= 0 ? '+' : '') + c.risk.excessPct + '%</div>' +
      '<div class="g-lb">กำไรจริงที่คาด ' + money(c.expected) + ' เทียบกับประมาณการ<br>เพดานปลอดภัย ' + money(c.risk.ceiling) + ' · ' + p51RiskBadge(c.risk.level) + '</div>' +
      (c.penalty ? '<div class="g-lb" style="color:#DC2626;margin-top:6px">อาจถูกเรียกเงินเพิ่มราว ' + money(c.penalty) + ' บาท</div>' : '') +
      '</div><div class="p51-note">เกณฑ์ ×1.25 นี้เป็นการเฝ้าระวังของทีม ไม่ใช่คำวินิจฉัยของสรรพากร</div></div>';

    h += '<div class="card"><div class="p51-total' + (c.refundable > 0 ? ' is-refund' : '') + '">' +
      '<div class="t-lb">' + (c.refundable > 0 ? 'ภาษีที่ขอคืน' : 'ภาษีที่ต้องชำระเพิ่มเติม') + '</div>' +
      '<div class="t-vl">' + money(c.refundable > 0 ? c.refundable : c.taxDue) + '</div>' +
      '<div class="t-sub">ฉากทัศน์' + esc(P51_SCLB[P51.key]) + ' · ' + (c.isSME ? 'SME ขั้นบันได' : 'อัตราปกติ 20%') + '</div></div>';

    h += '<div class="p51-bd" style="margin-top:12px">' +
      p51Row(1, 'ประมาณการกำไรสุทธิทั้งปี', c.profit) +
      p51Row(2, 'กึ่งหนึ่งของประมาณการ', c.half) +
      '<div class="r"><div><span class="n">3</span>อัตราภาษีที่ใช้</div><div class="v">' + (c.isSME ? 'SME' : '20%') + '</div></div>' +
      p51Row(4, 'ภาษีที่คำนวณได้', c.halfTax) +
      p51Row(5, 'หัก ภาษีหัก ณ ที่จ่าย', -p51n(P51.wht)) +
      p51Row(6, 'หัก เครดิตภาษีอื่น', -p51n(P51.other)) +
      '<div class="r total"><div>' + (c.refundable > 0 ? 'ภาษีที่ขอคืน' : 'รวมต้องชำระเพิ่มเติม') + '</div>' +
      '<div class="v">' + money(c.refundable > 0 ? c.refundable : c.taxDue) + '</div></div></div>';

    h += '<div class="ds-h" style="margin:14px 0 7px">เปรียบเทียบฉากทัศน์</div><div class="p51-sc">' +
      P51_KEYS.map(function(k){
        var st = { sc:P51.sc, key:k, sme:P51.sme, wht:P51.wht, other:P51.other, expected:P51.expected,
          method:P51.method, h1Profit:P51.h1Profit };
        var cc = p51Calc(st);
        return '<button class="' + (k === P51.key ? 'on' : '') + '" onclick="p51SetScenario(\'' + k + '\')">' + esc(P51_SCLB[k]) +
          '<span class="sc-b">' + money(cc.taxDue) + '</span>' +
          '<span class="sc-b" style="font-weight:400;color:' + (cc.risk.level === 'เสี่ยง' ? '#DC2626' : (cc.risk.level === 'เฝ้าระวัง' ? '#C8730B' : '#1E7A48')) + '">' + esc(cc.risk.level) + '</span></button>';
      }).join('') + '</div>';

    h += '<div class="tax-acts p51-acts"><button class="btn btn-ok" onclick="p51Save()">💾 บันทึกร่าง</button>' +
      '<button class="btn btn-ghost" onclick="p51Preview()">👁️ ดูกระดาษทำการ</button>' +
      '<button class="btn btn-ghost" onclick="p51Doc(P51.ent,P51.year)">📄 ออกไฟล์ PDF</button>' +
      '<button class="btn btn-ghost" onclick="p51Filed()">✅ ทำเครื่องหมายว่ายื่นแล้ว</button></div>';
    if(P51.job && P51.job.status === 'ยื่นแล้ว'){
      h += '<div class="p51-warn" style="margin-top:10px">งานนี้ทำเครื่องหมาย "ยื่นแล้ว" ' +
        (P51.job.filedAmt ? '(' + money(P51.job.filedAmt) + ' บาท) ' : '') + '— บันทึกทับไม่ได้จนกว่าจะกดเปิดแก้' +
        '<div class="tax-acts p51-acts"><button class="btn btn-ghost" onclick="p51Reopen(P51.ent,P51.year)">✏️ เปิดแก้อีกครั้ง</button></div></div>';
    }

  function reimbMigrate(){

    jsonp({action:'waReimbMigrate',uid:UID}).then(function(r){
      unbusy();
      if(!r||!r.ok){ toast((r&&r.error)||'ตรวจไม่สำเร็จ'); return; }

        'ย้ายไปแล้ว '+r.done+' ใบ · ข้ามเพราะข้อมูลไม่พอ '+r.skip+' ใบ<br><br>'+
        'ใบเดิมจะกลายเป็น <b>ใบแจ้งหนี้</b> ยอดเท่าเดิมทุกบาท ไม่คิด VAT เพิ่ม · ลิงก์ชี้ไฟล์เดิม (ไม่ออก PDF ใหม่)</div>'+
        '<div class="fld"><label>สถานะของใบที่ย้ายมา</label><select id="rmMode">'+
          '<option value="closed">ปิดใบแล้ว — ไม่ขึ้นเป็นลูกหนี้ (แนะนำ)</option>'+
          '<option value="unpaid">ยังไม่ได้เงิน — ขึ้นเป็นลูกหนี้ค้างรับทุกใบ</option>'+

        'เฉพาะตอนที่รู้ว่าใบพวกนี้ยังค้างจริง ไม่งั้นยอดลูกหนี้จะพองผิดค่ะ</div>'+
        '<div class="m-act"><button class="btn btn-ghost" onclick="closeModal()">ยังไม่ย้าย</button>'+
        '<button class="btn btn-primary" onclick="reimbMigrateDo()">ย้ายเลย</button></div>');

  function reimbMigrateDo(){

    callBusy('กำลังย้ายข้อมูล…', jsonp({action:'waReimbMigrate',uid:UID,run:'1',mode:mode}), 'ย้ายแล้ว')
