<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Moodata · ทีม</title>
<meta name="theme-color" content="#1B72E8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="user.css?v=12">
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  /* Moodata เพิ่มเติมจาก CSS ดิเอลฟ์ (date input + badge สถานะลา) */
  .date-row{ display:flex; flex-direction:column; gap:14px; margin:4px 0 12px; } .date-row > div{ min-width:0; }
  .date-row .field-lb{ display:block; margin:0 0 6px; }
  input[type=date]{ width:100%; box-sizing:border-box; padding:11px 12px; border:1.5px solid var(--line); border-radius:12px;
    font-family:inherit; font-size:15px; background:#fff; color:var(--ink); }
  input[type=date]:focus{ outline:none; border-color:var(--red); }
  .lvb{ margin-left:auto; font-size:12px; padding:3px 11px; border-radius:999px; font-weight:600; white-space:nowrap; }
  .lvb-wait{ background:var(--ot-tint); color:var(--ot); } .lvb-ok{ background:var(--green-tint); color:var(--green); }
  .lvb-no{ background:#fbe7e7; color:#c0392b; }
  /* ═══ หน้า 🏠 ภาพรวม — dashboard มาตรฐาน (พี่กี้เคาะ 30 ก.ค. 2569: ตัวเลขสำคัญบนสุด → สิ่งที่ต้องทำ → รายการล่าสุด → ตารางสรุป) ═══ */
  .hm-hero{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
  .hm-hero h2{ font-size:19px; font-weight:700; color:#1F2733; }
  .hm-hero .hp{ font-size:13px; color:var(--muted); }
  /* แถวตัวเลขสำคัญ (KPI) — 4 ช่องเรียงแถวบน · มือถือ 2 คอลัมน์ */
  .hm-kpis{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:16px; }
  .hm-k{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);
    padding:14px 15px; text-align:left; font:inherit; cursor:pointer; position:relative; transition:box-shadow .12s, transform .05s; }
  .hm-k:hover{ box-shadow:0 6px 18px rgba(120,150,200,.20); } .hm-k:active{ transform:scale(.995); }
  .hm-k .kl{ font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px; }
  .hm-k .kv{ font-size:27px; font-weight:800; line-height:1.15; margin-top:7px; color:#1F2733; font-variant-numeric:tabular-nums; }
  .hm-k .kv small{ font-size:13px; font-weight:600; color:var(--muted); margin-left:3px; }
  .hm-k .ks{ font-size:12px; color:#4A5262; margin-top:5px; font-variant-numeric:tabular-nums; }
  .hm-k.warn .kv{ color:#DC2626; } .hm-k.ok .kv{ color:#1E9E5A; } .hm-k.info .kv{ color:#1B72E8; } .hm-k.wait .kv{ color:#C87F1E; }
  /* พื้นที่ 2 คอลัมน์: ต้องทำ | รายการล่าสุด — มือถือเรียงลง */
  .hm-2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px; align-items:start; }
  .hm-p{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; }
  .hm-p .ph{ display:flex; align-items:center; gap:8px; font-weight:700; font-size:14px; color:#1F2733;
    padding:13px 15px; border-bottom:1px solid var(--line); }
  .hm-p .ph .go{ margin-left:auto; font-size:12px; font-weight:600; color:var(--red); cursor:pointer; }
  .hm-p .pb{ padding:6px 0; }
  .hm-empty{ padding:20px 15px; text-align:center; font-size:13px; color:var(--muted); }
  /* ⚡ ต้องทำ — 1 บรรทัด 1 เรื่อง กดได้ทั้งแถว (มาตรฐาน task list ไม่ใช่ชิปกลม) */
  .hm-todo-row{ display:flex; align-items:center; gap:10px; width:100%; font:inherit; text-align:left;
    background:none; border:none; border-bottom:1px solid var(--bg); padding:11px 15px; cursor:pointer; color:#1F2733; }
  .hm-todo-row:last-child{ border-bottom:none; }
  .hm-todo-row:hover{ background:var(--red-tint); }
  .hm-todo-row .dot{ width:8px; height:8px; border-radius:50%; background:#DC2626; flex:0 0 auto; }
  .hm-todo-row .tl{ flex:1; font-size:13.5px; }
  .hm-todo-row .tn{ font-weight:700; font-variant-numeric:tabular-nums; }
  .hm-todo-row .ar{ color:var(--muted); font-size:15px; }
  /* รายการล่าสุด — ตารางอ่านเร็ว */
  .hm-r{ display:flex; align-items:center; gap:10px; padding:9px 15px; border-bottom:1px solid var(--bg); cursor:pointer; }
  .hm-r:last-child{ border-bottom:none; } .hm-r:hover{ background:var(--bg); }
  .hm-r .rd{ font-size:11.5px; color:var(--muted); width:38px; flex:0 0 auto; font-variant-numeric:tabular-nums; }
  .hm-r .rt{ flex:1; font-size:13px; color:#1F2733; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .hm-r .rt i{ font-style:normal; color:var(--muted); font-size:11.5px; }
  .hm-r .ra{ font-size:12.5px; font-weight:600; font-variant-numeric:tabular-nums; color:#1F2733; }
  .hm-r .rs{ font-size:11px; padding:2px 8px; border-radius:999px; white-space:nowrap; flex:0 0 auto; }
  .hm-r .rs.ok{ background:var(--green-tint); color:var(--green); }
  .hm-r .rs.wait{ background:var(--ot-tint); color:var(--ot); }
  .hm-r .rs.bad{ background:#fbe7e7; color:#c0392b; }
  /* ตารางสรุป (ล่าง) — label | ค่า */
  .hm-t{ width:100%; border-collapse:collapse; font-size:13px; }
  .hm-t td{ padding:9px 15px; border-bottom:1px solid var(--bg); color:#4A5262; }
  .hm-t tr:last-child td{ border-bottom:none; }
  .hm-t td.v{ text-align:right; font-weight:600; color:#1F2733; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .hm-t td.v.warn{ color:#DC2626; } .hm-t td.v.ok{ color:#1E9E5A; } .hm-t td.v.wait{ color:#C87F1E; }
  .hm-t tr.sec td{ background:var(--bg); font-size:11.5px; font-weight:700; color:#6B7280; padding:6px 15px; }
  .hm-err{ font-size:12px; color:#C0392B; padding:14px 15px; }
  @media(max-width:900px){
    .hm-kpis{ grid-template-columns:repeat(2,1fr); gap:10px; }
    .hm-2{ grid-template-columns:1fr; }
    .hm-k .kv{ font-size:24px; }
  }
  /* กล่อง preview รายงานลา — โชว์ข้อความที่จะส่งเข้ากลุ่มเป๊ะ ๆ (อ่านทานก่อนกดส่ง) */
  .lvrep-box{ margin-top:12px; background:#F7F9FC; border:1px solid var(--line); border-radius:10px;
    padding:12px 13px; font-size:13px; line-height:1.75; color:#1F2733; white-space:pre-wrap;
    max-height:420px; overflow:auto; font-family:inherit; }
  .soon-wrap{ text-align:center; padding:48px 22px; color:var(--muted); }
  .soon-wrap .e-emo{ font-size:40px; margin-bottom:10px; }
  /* งาน (task card) */
  .tk{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);
    padding:14px 16px; margin-bottom:12px; }
  /* รายการใบเบิกหน้าสรุป — ตารางแถวละ 1 รายการ (list view · เว็บกว้างเห็นครบบรรทัดเดียว · มือถือเลื่อนแนวนอน) */
  .exl-tbl{ width:auto; min-width:760px; table-layout:auto; }   /* ชิดซ้าย ไม่ยืดเต็มจอ → ยอด/เอกสารอยู่ใกล้ ไม่ลอยไปขอบขวา */
  .exl-tbl td.exl-detail{ white-space:normal; max-width:360px; color:#5B6472; }
  .exl-tbl td.exl-amt{ text-align:right; font-variant-numeric:tabular-nums; font-weight:600; white-space:nowrap; }
  .exl-tbl td.exl-doc{ white-space:nowrap; }
  .exl-tbl td .tk-badge{ margin-left:0; }
  .exl-tbl a.exl-lk{ display:inline-block; color:var(--red); text-decoration:none; font-size:12.5px; margin-right:8px; }
  /* แถบกรองหน้าสรุป (คล้ายบอร์ดงาน) */
  .ed-filter{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; align-items:center; }
  .ed-filter select, .ed-filter .ed-q{ padding:8px 11px; border:1px solid var(--line); border-radius:10px; font-family:inherit; font-size:13px; background:#fff; color:#333; }
  .ed-filter .ed-q{ flex:1; min-width:180px; }
  .tk-top{ display:flex; align-items:center; gap:8px; }
  .tk-no{ font-weight:700; color:var(--red); font-size:14px; }
  .tk-badge{ margin-left:auto; font-size:12px; padding:3px 10px; border-radius:999px; font-weight:600; white-space:nowrap; }
  .b-new{ background:#EEF1F6; color:#5B6472; } .b-doing{ background:#E3EEFD; color:#1B72E8; }
  .b-review{ background:#FDF0E1; color:#C87F1E; } .b-done{ background:#E4F5EA; color:#1E9E5A; }
  .b-cancel{ background:#FCE7E7; color:#D14343; }
  .ex-amt{ font-size:15px; font-weight:700; color:#1F2733; margin-top:6px; }
  .ex-amt .ex-t{ font-weight:600; color:#4A5262; }
  .ex-meta{ font-size:12px; color:var(--muted); margin-top:8px; }
  .ex-lk{ color:var(--red); text-decoration:none; margin-right:12px; white-space:nowrap; }
  .m-hint{ font-size:12.5px; color:var(--muted); background:#F4F7FB; border-radius:10px; padding:9px 11px; margin:4px 0 12px; line-height:1.5; }
  /* ── dashboard (สรุปค่าใช้จ่าย / ตั้งเบิก) — กราฟทำด้วย CSS ล้วน ไม่พึ่งไลบรารีนอก (LIFF โหลด CDN ช้า/บล็อกได้) ── */
  .ds-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-bottom:12px; }
  .ds-stat{ background:#fff; border-radius:14px; padding:12px 14px; box-shadow:0 1px 3px rgba(16,24,40,.06); }
  .ds-stat .ds-lb{ font-size:12px; color:var(--muted); }
  .ds-stat .ds-vl{ font-size:20px; font-weight:700; color:#1F2733; margin-top:3px; letter-spacing:-.3px; }
  .ds-stat .ds-sub{ font-size:11.5px; color:var(--muted); margin-top:2px; }
  .ds-warn .ds-vl{ color:#E5484D; } .ds-wait .ds-vl{ color:#C8730B; }
  .ds-h{ font-size:13px; font-weight:700; color:#4A5262; margin:2px 0 10px; }
  .tax-tbl-wrap{ overflow-x:auto; -webkit-overflow-scrolling:touch; margin:0 -4px; }
  .tax-tbl{ border-collapse:collapse; width:100%; font-size:12.5px; min-width:520px; }
  .tax-tbl th,.tax-tbl td{ border-bottom:1px solid var(--line); padding:7px 8px; text-align:left; white-space:nowrap; }
  .tax-tbl th{ background:#EDEDF2; font-weight:700; color:#4A5262; }
  .tax-tbl td.ta-r, .tax-tbl th.ta-r{ text-align:right; font-variant-numeric:tabular-nums; }   /* หัวคอลัมน์ต้องชิดขวาให้ตรงกับตัวเลขใต้มัน */
  .tax-tbl tr.tax-total td{ font-weight:700; background:#FAFAFC; border-top:2px solid #D9DDE6; }
  /* ═══ ตารางรายการหมวดการเงิน (พี่กี้เคาะ 1 ก.ย. 2569: ตาราง + เมนู ⋮ แทนการ์ดปุ่มเยอะ) ═══ */
  /* ต่อยอด .tax-tbl เดิม — ลำดับคอลัมน์ตายตัว ยอดชิดขวา ปุ่มสั่งงานอยู่ที่เดียวทุกแถว */
  /* กว้างเต็มพื้นที่หน้าจอ (พี่กี้ 3 ก.ย. 69) — คอลัมน์ตัวเลข/สถานะล็อกเป็น px
     ส่วนคอลัมน์ข้อความ (ลูกค้า/เรื่อง) ยืดตามจอ จึงพอดีทั้งจอเล็กและจอกว้าง */
  .dt-tbl{ width:100%; min-width:960px; table-layout:fixed; }   /* fixed = ทุกตารางในหน้าตรงคอลัมน์กันเป๊ะ (auto จะกว้างตามเนื้อหาของแต่ละตาราง) */
  .dt-tbl th, .dt-tbl td{ overflow-wrap:anywhere; }
  /* ⚠️ .tax-tbl เดิมตั้ง white-space:nowrap → ชื่อลูกค้า/เรื่องยาวจะไม่ตัดบรรทัด แล้วล้นไปทับคอลัมน์ข้าง ๆ
     (พี่กี้เจอกับตารางรายรับ 3 ก.ย. 69) · ตารางนี้ fixed layout อยู่แล้ว ให้ตัดคำในเซลล์เสมอ */
  .dt-tbl td{ vertical-align:middle; white-space:normal; }
  .dt-tbl td.dt-detail{ white-space:normal; color:#5B6472; line-height:1.45; }
  .dt-tbl td.dt-nw, .dt-tbl th.dt-nw{ white-space:nowrap; }   /* วันที่/เลขที่ ห้ามตัดกลางคำ */
  .dt-tbl td.dt-amt{ text-align:right; font-variant-numeric:tabular-nums; font-weight:600; white-space:nowrap; }
  .dt-tbl td.dt-doc a{ color:var(--red); text-decoration:none; font-size:12px; margin-right:7px; white-space:nowrap; }
  .dt-tbl td.dt-act{ text-align:center; width:44px; }
  .dt-tbl tbody tr:hover{ background:#FAFBFD; }
  .dt-sec{ font-size:14px; font-weight:600; color:#4A5262; margin:18px 2px 8px; }
  .dt-sec:first-child{ margin-top:0; }
  .dt-mbtn{ border:1px solid var(--line); background:#fff; border-radius:8px; width:30px; height:28px; cursor:pointer;
    font-size:15px; line-height:1; color:#4A5262; padding:0; font-family:inherit; }
  .dt-mbtn:hover{ background:#F1F4F9; border-color:#C9D2E0; }
  /* ⚠️ ตารางอยู่ใน .tax-tbl-wrap (overflow-x:auto) → เมนูต้อง fixed ไม่งั้นโดน wrapper ตัดหาย */
  .dt-menu{ position:fixed; z-index:120; background:#fff; border:1px solid var(--line); border-radius:12px;
    box-shadow:0 10px 30px rgba(40,60,90,.18); padding:6px; min-width:210px; max-height:70vh; overflow-y:auto; }
  .dt-menu button, .dt-menu a{ display:block; width:100%; box-sizing:border-box; text-align:left; background:none;
    border:0; padding:9px 11px; border-radius:8px; font-family:inherit; font-size:13.5px; color:#2A3240;
    cursor:pointer; text-decoration:none; white-space:nowrap; }
  .dt-menu button:hover, .dt-menu a:hover{ background:#F1F4F9; }
  .dt-menu .dt-danger{ color:#DC2626; }
  .dt-menu .dt-sep{ height:1px; background:var(--line); margin:5px 4px; }
  .tax-acts{ display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .tax-acts .btn{ width:auto; flex:1; min-width:150px; text-align:center; text-decoration:none; }
  .tax-inp{ width:100%; box-sizing:border-box; padding:9px 12px; border:1px solid var(--line); border-radius:10px; font-size:14px; font-family:inherit; }
  /* ═══ 📐 ภ.ง.ด.51 ประมาณการภาษีครึ่งปี (spec-pnd51 §7) ═══ */
  /* จอกว้าง = 2 คอลัมน์ เลื่อนไปพร้อมกัน · มือถือพับเป็นคอลัมน์เดียว */
  .p51-split{ display:grid; grid-template-columns:1fr; gap:12px; }
  /* ⚠️ grid item ค่าเริ่มต้นคือ min-width:auto → ตารางข้างในที่ตั้ง min-width ไว้ (.dt-tbl 960px,
     .p51-grid 430px) จะดันคอลัมน์ให้กว้างเกินจอ ทั้งหน้าเลยเลื่อนแนวนอน (เจอตอนถ่ายจอ 390px) */
  .p51-split > *{ min-width:0; }
  @media (min-width:900px){
    .p51-split{ grid-template-columns:minmax(0,1.35fr) minmax(300px,.85fr); align-items:start; }
  }
  /* ⛔ ห้ามใส่ position:sticky ให้ฝั่งขวา — พี่กี้ 2 ก.ย. 69: ฝั่งซ้าย/ขวาเลื่อนไม่เท่ากันแล้วเวียนหัว
     สองคอลัมน์ต้องเลื่อนไปพร้อมกันเสมอ (เริ่มบรรทัดบนตรงกันด้วย align-items:start) */
  .p51-side .card{ margin-bottom:12px; }
  .p51-gauge{ text-align:center; }
  .p51-gauge svg{ width:100%; max-width:230px; height:auto; }
  .p51-gauge .g-vl{ font-size:23px; font-weight:700; color:#1F2733; margin-top:-16px; letter-spacing:-.3px; }
  .p51-gauge .g-lb{ font-size:12px; color:var(--muted); margin-top:2px; line-height:1.5; }
  .p51-total{ background:#0f6e56; color:#fff; border-radius:14px; padding:14px 16px; }
  .p51-total .t-lb{ font-size:12.5px; opacity:.9; }
  .p51-total .t-vl{ font-size:27px; font-weight:800; letter-spacing:-.5px; margin-top:2px; font-variant-numeric:tabular-nums; }
  .p51-total .t-sub{ font-size:11.5px; opacity:.85; margin-top:4px; line-height:1.5; }
  .p51-total.is-refund{ background:#1B5E9E; }
  .p51-bd{ font-size:13px; }
  .p51-bd .r{ display:flex; justify-content:space-between; gap:10px; padding:7px 0; border-bottom:1px solid var(--line); }
  .p51-bd .r:last-child{ border-bottom:0; }
  .p51-bd .r.total{ font-weight:700; border-top:2px solid #D9DDE6; margin-top:2px; }
  .p51-bd .r .n{ color:var(--muted); font-weight:400; margin-right:5px; }
  .p51-bd .r .v{ font-variant-numeric:tabular-nums; white-space:nowrap; }
  .p51-sc{ display:flex; gap:6px; }
  .p51-sc button{ flex:1; padding:9px 6px; border:1px solid var(--line); background:#fff; border-radius:10px;
    font-family:inherit; font-size:12.5px; cursor:pointer; color:#4A5262; line-height:1.4; }
  .p51-sc button.on{ border-color:#0f6e56; background:#E8F4F0; color:#0B4E3D; font-weight:700; }
  .p51-sc button .sc-b{ display:block; font-size:10.5px; font-weight:600; margin-top:3px; }
  .p51-warn{ font-size:12.5px; background:#FFF7E8; border:1px solid #F5DFAE; color:#8A5B0B;
    border-radius:10px; padding:9px 11px; margin-bottom:10px; line-height:1.55; }
  .p51-warn ul{ margin:4px 0 0; padding-left:17px; } .p51-warn li{ margin:2px 0; }
  .p51-note{ font-size:11.5px; color:var(--muted); line-height:1.55; margin-top:8px; }
  .p51-src{ font-size:11.5px; color:var(--muted); margin-top:3px; line-height:1.45; }
  .p51-grid{ overflow-x:auto; }
  .p51-grid table{ border-collapse:collapse; width:100%; min-width:430px; font-size:12.5px; }
  .p51-grid th,.p51-grid td{ border-bottom:1px solid var(--line); padding:5px 6px; text-align:left; }
  .p51-grid th{ background:#EDEDF2; font-weight:700; color:#4A5262; white-space:nowrap; }
  .p51-grid th.sc-on{ background:#E8F4F0; color:#0B4E3D; }
  .p51-grid td input{ width:100%; box-sizing:border-box; padding:6px 8px; border:1px solid var(--line);
    border-radius:8px; font:inherit; font-size:12.5px; text-align:right; font-variant-numeric:tabular-nums; }
  .p51-grid td.rl{ white-space:nowrap; color:#4A5262; }
  /* ── ฟอร์มตามแบบราชการ: ตัวเลือกแบบ radio (พี่กี้ขอ 2 ก.ย. 69 · อ้างแบบ ภ.ง.ด.51 จริง) ── */
  .p51-opt{ display:flex; flex-direction:column; gap:7px; }
  .p51-opt label{ display:flex; gap:9px; align-items:flex-start; padding:9px 11px; border:1px solid var(--line);

  // ใช้ NAV_GROUPS ชุดเดียวกับแถบมือถือ (source เดียว ไม่ drift) · ย้ายปุ่มเดิมใน markup เข้ากลุ่ม
  // (ไม่ generate ปุ่มใหม่ → ไอคอน SVG เดิมอยู่ครบ) · กลุ่มที่มีหัวข้อเดียวไม่ต้องพับ กดเข้าได้เลย
  function buildNavGroups(){
    var nav=document.querySelector('.nav'); if(!nav || nav.dataset.grouped) return;
    Array.prototype.forEach.call(nav.querySelectorAll('.nav-sec'), function(s){ s.parentNode.removeChild(s); });
    NAV_GROUPS.forEach(function(g){
      var btns=mVisibleViews(g).map(function(v){ return nav.querySelector('.nav-btn[data-view="'+v+'"]'); })
        .filter(function(b){ return !!b; });
      if(!btns.length) return;
      var wrap=document.createElement('div'); wrap.className='nav-g'; wrap.setAttribute('data-g',g.key);
      if(btns.length===1){ btns[0].classList.add('solo'); wrap.appendChild(btns[0]); }   // กลุ่มเดี่ยว = ปุ่มเดียวจบ
      else {
        var head=document.createElement('button');
        head.type='button'; head.className='nav-gh';
        head.innerHTML='<span class="gi">'+(GROUP_ICON[g.key]||g.icon)+'</span>'+
          '<span class="gl">'+esc(g.label)+'</span><span class="gc">›</span>';
        head.addEventListener('click', function(){ navToggleGroup(g.key); });
        var body=document.createElement('div'); body.className='nav-gb';
        btns.forEach(function(b){ body.appendChild(b); });
        wrap.appendChild(head); wrap.appendChild(body);
      }
      nav.appendChild(wrap);

    // ⚠️ ต้อง copy เป็น array ก่อนลบ — nav.children เป็น live collection ลบไปวนไป index เลื่อน ลบไม่ครบ
    Array.prototype.slice.call(nav.children).forEach(function(el){

  function hoursDiff(s,e){
    if(!s||!e) return 0;
    var a=s.split(':'), b=e.split(':');
    var h=(parseInt(b[0],10)*60+parseInt(b[1],10)-parseInt(a[0],10)*60-parseInt(a[1],10))/60;
    return h>0?h:0;
  }
  function calcDays(){
    if(!LF.start) return 0;
    if(LF.period==='hours'){ var h=hoursDiff(LF.stime,LF.etime); return h?Math.round(h/8*100)/100:0; }
    if(LF.period==='morning'||LF.period==='afternoon') return 0.5;
    // เต็มวัน — นับเฉพาะวันทำงาน ข้ามวันหยุดกะ + วันหยุดบริษัท (mirror backend waCountWorkDays_)
    var off=(SCHEDULE&&SCHEDULE.off&&SCHEDULE.off.length)?SCHEDULE.off:[0,6];
    var cur=new Date(LF.start.getFullYear(),LF.start.getMonth(),LF.start.getDate());
    var e=LF.end||LF.start; e=new Date(e.getFullYear(),e.getMonth(),e.getDate());
    if(e<cur) return 0;
    var n=0,g=0;
    while(cur<=e&&g<400){ if(off.indexOf(cur.getDay())<0&&!holidayName(cur)) n++; cur.setDate(cur.getDate()+1); g++; }
    return n;
  }

    var qty=LF.period==='hours' ? (hoursDiff(LF.stime,LF.etime)||0)+' ชม. (≈'+calcDays()+' วัน)' : calcDays()+' วัน';
    var dt=fmtShow(LF.start)+(LF.end&&dkey(LF.end)!==dkey(LF.start)?' — '+fmtShow(LF.end):'')+
      (LF.period==='hours'&&LF.stime&&LF.etime?'  ⏰ '+LF.stime+'-'+LF.etime:'');

  function lvErr(msg){ var e=$('lvErr'); e.textContent='⚠️ '+msg; e.classList.remove('hidden'); }
  function submitLeave(){
    if($('lvFor') && !LF.forUid){ lvErr('เลือกพนักงานที่จะยื่นลาแทนก่อนค่ะ'); return; }
    if(!LF.start){ lvErr('แตะเลือกวันที่ลาบนปฏิทินก่อนค่ะ'); return; }
    if(!LF.end) LF.end=LF.start;
    if(LF.end<LF.start){ lvErr('วันสิ้นสุดต้องไม่ก่อนวันเริ่ม'); return; }
    if(LF.period==='hours'){
      if(!LF.stime||!LF.etime){ lvErr('เลือกเวลาเริ่ม–สิ้นสุดก่อนค่ะ'); return; }
      if(hoursDiff(LF.stime,LF.etime)<=0){ lvErr('เวลาสิ้นสุดต้องหลังเวลาเริ่ม'); return; }
    } else if(calcDays()<=0){ lvErr('ช่วงที่เลือกเป็นวันหยุดทั้งหมด เลือกวันทำงานนะคะ 😊'); return; }
    if(!LF.reason.trim()){ lvErr('กรอกเหตุผลก่อนค่ะ'); return; }
    toast('กำลังส่งใบลา…');

      .then(function(r){ if(!r||!r.ok){ lvErr((r&&r.error)||'ส่งไม่สำเร็จ'); return; }

      }).catch(function(e){ lvErr(e.message); });
  }

  // ═══════════ ปฏิทิน (ลา) + กะ/วันหยุด ═══════════
  function dkey(d){ return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate(); }
  function iso(d){ return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
  // วันหยุดบริษัท: รองรับทั้ง ค.ศ. และ พ.ศ. (ปี>2500 → -543)
  function _holParse_(s){ var p=String(s).split('/'); if(p.length!==3) return null; var y=+p[2]; if(y>2500)y-=543; return {y:y,mo:(+p[1])-1,d:+p[0]}; }
  function holidayName(dt){ var t=dt.getFullYear()+'-'+dt.getMonth()+'-'+dt.getDate();
    for(var i=0;i<HOLIDAYS.length;i++){ var hp=_holParse_(HOLIDAYS[i].date); if(hp&&(hp.y+'-'+hp.mo+'-'+hp.d)===t) return HOLIDAYS[i].name||'วันหยุดบริษัท'; } return ''; }
  function holidaysInMonth(y,mo){ var out=[]; HOLIDAYS.forEach(function(h){ var hp=_holParse_(h.date); if(hp&&hp.y===y&&hp.mo===mo) out.push({day:hp.d,name:h.name||'วันหยุดบริษัท'}); }); return out.sort(function(a,b){return a.day-b.day;}); }
  function buildCalLegend(y,mo){
    var s=SCHEDULE, box='';
    if(s){ var tm=(s.start&&s.end)?(' · '+esc(s.start)+'–'+esc(s.end)):'';
      box+='<div class="cal-sched"><span class="cs-ic">🗓️</span><div><div class="cs-main">กะของคุณ: '+esc(s.label||s.code)+tm+'</div>'+(s.offLabel?'<div class="cs-sub">หยุด: '+esc(s.offLabel)+'</div>':'')+'</div></div>';
    } else { box+='<div class="cal-sched"><span class="cs-ic">🗓️</span><div class="cs-main">หยุดเสาร์–อาทิตย์</div></div>'; }
    var hol=holidaysInMonth(y,mo);
    if(hol.length){ box+='<div class="cal-hols"><div class="ch-title">🎉 วันหยุดบริษัทเดือนนี้</div>'+
      hol.map(function(x){ return '<div class="ch-row"><b>'+x.day+'</b> '+esc(x.name)+'</div>'; }).join('')+'</div>'; }
    box+='<div class="cal-legend"><span class="lg"><i class="sw holiday"></i>วันหยุดบริษัท</span>'+
      '<span class="lg"><i class="sw off"></i>วันหยุดของคุณ</span><span class="lg"><i class="sw today"></i>วันนี้</span></div>';
    return box;
  }
  function renderCal(){
    var y=CAL.getFullYear(), mo=CAL.getMonth();
    var first=new Date(y,mo,1).getDay(), days=new Date(y,mo+1,0).getDate();
    var todayK=dkey(new Date());
    var off=(SCHEDULE&&SCHEDULE.off&&SCHEDULE.off.length)?SCHEDULE.off:[0,6];
    var h='<div class="cal-head"><button class="cal-nav" id="cP" type="button">‹</button>'+
      '<div class="cal-month">'+TH_MONTHS[mo]+' '+(y+543)+'</div>'+
      '<button class="cal-nav" id="cN" type="button">›</button></div><div class="cal-grid">';
    TH_DOW.forEach(function(d,i){ h+='<div class="cal-dow'+(i===0||i===6?' we':'')+'">'+d+'</div>'; });
    for(var i=0;i<first;i++) h+='<div class="cal-day empty"></div>';
    for(var d=1;d<=days;d++){
      var dt=new Date(y,mo,d), k=dkey(dt), dow=dt.getDay(), hn=holidayName(dt);
      var cls='cal-day';

      if(k===todayK) cls+=' today';
      if(LF.start&&k===dkey(LF.start)) cls+=' sel';
      if(LF.end&&k===dkey(LF.end)) cls+=' sel';
      if(LF.start&&LF.end&&dt>LF.start&&dt<LF.end) cls+=' inrange';
      var tip=hn?' title="'+esc(hn)+'"':'';
      h+='<div class="'+cls+'"'+tip+' data-d="'+d+'">'+d+'</div>';
    }
    h+='</div>'+buildCalLegend(y,mo);
    var c=$('calLeave'); if(!c) return; c.innerHTML=h;
    $('cP').addEventListener('click', function(){ CAL=new Date(y,mo-1,1); renderCal(); });
    $('cN').addEventListener('click', function(){ CAL=new Date(y,mo+1,1); renderCal(); });

  }

  // % ความสำเร็จจากสถานะ (ยกเลิก=null ไม่นับ) · progress bar
  function statusPct(s){ s=String(s||''); if(s.indexOf('ยกเลิก')>=0)return null; if(s.indexOf('เสร็จ')>=0)return 100; if(s.indexOf('รอตรวจ')>=0)return 80; if(s.indexOf('กำลังทำ')>=0)return 50; return 0; }

  function avgPct(tasks){ var sum=0,n=0; (tasks||[]).forEach(function(t){ var p=statusPct(t.status); if(p!==null){sum+=p;n++;} }); return n?Math.round(sum/n):0; }
  // escape string สำหรับใส่ใน onclick='...' (กันชื่อบริษัทมี ' หรือ ")
  function jss(s){ return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

  // เมนู Project · คอม (พี่+ทีม)=บอร์ดเต็ม (ทีมแก้/สร้างได้) · มือถือ (mini app)=dropdown+6 สถานะ

      if(rp&&rp.ok){ PROJECTS=rp.projects||[]; if(rp.team) TEAM_ALL=rp.team; } else PROJECTS=[];

  function pjScopeTasks(){

  // จัดงาน 1 ใบเข้า 1 กลุ่ม (ไม่ซ้ำ): ยกเลิก→เกินกำหนด→เสร็จ→รอตรวจ→กำลังทำ→ใหม่
  function pjBucket(t){
    if(isCancel_(t)) return 'cancel';
    if(isOverdue_(t)) return 'over';
    var s=String(t.status||'');
    if(s.indexOf('เสร็จ')>=0) return 'done';
    if(s.indexOf('รอตรวจ')>=0) return 'review';
    if(s.indexOf('กำลังทำ')>=0) return 'doing';
    return 'new';
  }

    var coSet={}; ALL_TASKS.forEach(function(t){ if(isCancel_(t))return; coSet[t.customer||'(ไม่ระบุบริษัท)']=1; });

    if(coList.length) opt+='<optgroup label="🏢 บริษัท">'+coList.map(function(c){ var v='co:'+c; return '<option value="'+esc(v)+'"'+(PJ_SEL===v?' selected':'')+'>'+esc(c)+'</option>'; }).join('')+'</optgroup>';
    if(PROJECTS.length) opt+='<optgroup label="📁 Project จัดเอง">'+PROJECTS.map(function(pj){ var v='pj:'+pj.id; return '<option value="'+esc(v)+'"'+(PJ_SEL===v?' selected':'')+'>'+esc(pj.name)+'</option>'; }).join('')+'</optgroup>';
    // แถวบน: กล่องจำนวน project (ตัวใหญ่ มีกรอบ) + ปุ่มเปิดงานใหม่ ข้างกัน
    var html='<div class="pj-toprow">'+
      '<div class="pj-count"><span class="pj-count-n">'+nItems+'</span><span class="pj-count-l">Project</span></div>'+
      '<button class="btn btn-primary pj-addbtn" onclick="pjAddTask()">➕<br>เปิดงานใหม่</button>'+
      '<button class="btn btn-ghost pj-addbtn pj-mgbtn" onclick="openProjManage()">⚙️<br>จัดการ</button></div>'+   // ทีม+พี่ จัดการ project ได้
      // ช่องเลือก project — ใหญ่ เด่น
      '<div class="pj-pick2"><label>เลือก Project</label><select onchange="setPjSel(this.value)">'+opt+'</select></div>';
    // ทีม: ปุ่มรับงานหลายใบ (ถ้ามีงานยังไม่มีคนรับ) — คงฟีเจอร์เดิมจากหน้า "งานทั้งหมด"
    if(!IS_OWNER){ var nUn=ALL_TASKS.filter(function(t){ return t.unassigned && !isCancel_(t); }).length;
      if(nUn) html+='<div class="bulk-entry"><button class="btn btn-ghost" onclick="openBulk(\'claim\')">☑️ รับงานหลายใบ ('+nUn+')</button></div>'; }
    // header % ของ scope ที่เลือก (ไม่นับยกเลิกใน %/ยอดรวม)
    var scope=pjScopeTasks(), live=scope.filter(function(t){return !isCancel_(t);});
    var avg=avgPct(live), doneN=live.filter(function(t){return statusPct(t.status)===100;}).length;
    var title = PJ_SEL==='' ? 'ทุกงาน' : (PJ_SEL.indexOf('co:')===0 ? '🏢 '+PJ_SEL.slice(3)
                : '📁 '+(((PROJECTS.filter(function(p){return 'pj:'+p.id===PJ_SEL;})[0])||{}).name||PJ_SEL.slice(3)));
    html+='<div class="pj-hd2"><div class="pj-hd2-t">'+esc(title)+'</div>'+
      '<div class="pj-hd2-pct">'+avg+'<span>% สำเร็จ</span></div>'+
      pctBar(avg,true)+'<div class="pj-hd2-cnt">เสร็จ '+doneN+' / '+live.length+' งาน</div></div>';
    // งานแยก 6 สถานะ — หัวเป็นบาร์ยาวมีกรอบ · การ์ดแบบงานทั้งหมด
    if(!scope.length){ html+='<div class="card"><div class="emptybox">ยังไม่มีงาน 😊</div></div>'; $('main').innerHTML=html; return; }
    var bucket={new:[],doing:[],review:[],done:[],over:[],cancel:[]};
    scope.forEach(function(t){ bucket[pjBucket(t)].push(t); });
    PJ_STAGES.forEach(function(st){
      var arr=bucket[st[0]];
      if((st[0]==='over'||st[0]==='cancel') && !arr.length) return;   // เกินกำหนด/ยกเลิก ซ่อนถ้าไม่มี
      html+='<div class="stgbar stgbar-'+st[0]+'"><span>'+st[1]+'</span><span class="stgbar-n">'+arr.length+'</span></div>';
      if(arr.length) html+=arr.map(cardTkPj).join('');
    });
    $('main').innerHTML=html;
  }
  // ปุ่มเปิดงานใหม่ (บนสุด) — preset ตามที่ dropdown เลือกอยู่
  function pjAddTask(){
    if(PJ_SEL.indexOf('co:')===0) openCreateCo(PJ_SEL.slice(3));
    else if(PJ_SEL.indexOf('pj:')===0) openCreate(PJ_SEL.slice(3));
    else openCreate();
  }
  // การ์ดงานหัวสีตามประเภท (แบบหน้างานทั้งหมด · bMiniCard) + ปุ่มช่วยกัน (ทีม+พี่)
  function cardTkPj(t){
    var c=bCat(t.category);
    var h='<div class="bd-card pj-card">'+
      '<div class="bd-cbar" style="background:'+c.color+'">'+c.icon+' '+esc(c.label)+'<span class="no">'+esc(t.no)+'</span></div>'+
      '<div class="bd-cbody">'+
        '<div class="bd-ccust">🏢 '+esc(t.customer||'-')+'</div>'+
        '<div class="bd-crow"><span class="bd-badge '+bBadge(t.status)+'">'+esc(t.status)+'</span>'+
          (t.dueMs?'<span class="'+(isOverdue_(t)?'bd-over':'bd-age')+'">'+bThDate(t.dueMs)+(isOverdue_(t)?' เกินกำหนด':'')+'</span>':'')+'</div>'+
        '<div class="bd-ctitle">'+esc(bTtl(t))+'</div>'+
        '<div class="bd-casg'+(t.assignee?'':' none')+'">👤 '+(t.assignee?esc(t.assigneeDisplay||t.assignee):'ยังไม่มอบหมาย')+'</div>';
    var btns=[];
    if(t.mine && t.status.indexOf('เสร็จ')<0 && t.status.indexOf('ยกเลิก')<0){
      if(t.status.indexOf('กำลังทำ')<0 && t.status.indexOf('รอตรวจ')<0)
        btns.push('<button class="btn btn-primary" onclick="doDoing(\''+esc(t.no)+'\')">🔵 รับงาน</button>');
      btns.push('<button class="btn btn-ok" onclick="openSubmit(\''+esc(t.no)+'\')">📤 ส่งตรวจ</button>');
    } else if(t.unassigned){
      btns.push('<button class="btn btn-primary" onclick="doClaim(\''+esc(t.no)+'\')">🙋 รับงานนี้</button>');
    }
    if(btns.length) h+='<div class="pj-cardacts">'+btns.join('')+'</div>';
    return h+'</div></div>';
  }

  // การ์ดงานในบอร์ด project — แสดงผู้รับผิดชอบ + ช่วยกันรับ/ส่ง
  function cardProj(t){

      '<div class="tk-cust">'+esc(t.title||t.customer||'-')+'</div>'+
      (t.customer&&t.title?'<div class="tk-cat">'+esc(t.customer)+'</div>':'')+
      (t.detail?'<div class="tk-detail">'+esc(t.detail)+'</div>':'')+
      '<div class="tk-kv"><b>ผู้รับผิดชอบ:</b> '+(t.assignee?esc(t.assigneeDisplay||t.assignee):'<i>ยังไม่มีคนรับ</i>')+'</div>';
    var tpc=statusPct(t.status);
    if(tpc!==null) h+='<div class="tk-prog"><span class="tk-prog-l">ความคืบหน้า</span><span class="tk-prog-n '+pctClass(tpc)+'-t">'+tpc+'%</span></div>'+pctBar(tpc);
    if(t.note){ var isFix=t.note.indexOf('พี่ให้แก้ไข')>=0;
      h+='<div class="tk-kv"'+(isFix?' style="background:#FFF7E6;border-radius:9px;padding:8px 10px;color:#8A6D1E"':'')+'><b>'+(isFix?'📝 สิ่งที่ต้องแก้':'โน้ต')+':</b> '+esc(t.note.replace(/^📝 พี่ให้แก้ไข:\s*/,''))+'</div>'; }
    var btns=[], done=t.status.indexOf('เสร็จ')>=0, cancel=t.status.indexOf('ยกเลิก')>=0;
    if(!done&&!cancel){
      if(t.unassigned) btns.push('<button class="btn btn-primary" onclick="doClaim(\''+esc(t.no)+'\')">🙋 รับงาน</button>');
      else {
        if(t.status.indexOf('รอตรวจ')<0) btns.push('<button class="btn btn-ok" onclick="openSubmit(\''+esc(t.no)+'\')">📤 ส่งตรวจ</button>');
        if(t.mine&&t.hasGroup) btns.push('<button class="btn btn-ok" onclick="sendMine(\''+esc(t.no)+'\')">📨 ส่งลูกค้าเลย</button>');
        if(t.mine) btns.push('<button class="btn btn-ghost" onclick="openTransfer(\''+esc(t.no)+'\')">🔄 โอนงาน</button>');
      }
    }
    btns.push('<button class="btn btn-ghost" onclick="mEditTask(\''+esc(t.no)+'\')">✏️ แก้ไข</button>');   // แก้ field รายตัว (ทีม+พี่ · ทุกงาน)
    if(btns.length) h+='<div class="tk-acts">'+btns.join('')+'</div>';
    return h+'</div>';
  }
  function doClaim(no){ toast('กำลังรับงาน…');
    jsonp({action:'waClaim',uid:UID,no:no}).then(function(r){ if(!r||!r.ok){toast((r&&r.error)||'ไม่สำเร็จ');return;} toast('รับงานแล้ว 🙋'); refreshTasksView(); }).catch(function(e){toast(e.message);}); }

  // ═══════════ (มือถือ) แก้ข้อมูลงานรายตัว — ทีม+พี่ · ยกเลิก/ลบ = พี่เท่านั้น ═══════════
  var ME_ORIG=null, ME_TEAM=[], ME_PROJ=[], ME_STAT=[];
  function mEditTask(no){
    toast('กำลังโหลด…');   // ดึง waPmBoard สด → ได้ tasks/team/statuses/projects ครบ (ทำงานได้ทุกวิว)
    jsonp({action:'waPmBoard',uid:UID}).then(function(r){
      if(!r||!r.ok){ toast((r&&r.error)||'โหลดไม่สำเร็จ'); return; }
      var t=null, ts=r.tasks||[]; for(var i=0;i<ts.length;i++){ if(ts[i].no===no){ t=ts[i]; break; } }
      if(!t){ toast('ไม่พบงาน'); return; }
      ME_ORIG=t; ME_TEAM=r.team||[]; ME_PROJ=r.projects||[]; ME_STAT=r.statuses||[];
      mRenderEdit(no, t);
    }).catch(function(e){ toast(e.message); });
  }
  function mRenderEdit(no, t){
    var stList=ME_STAT.length?ME_STAT:['🆕 ใหม่','🔵 กำลังทำ','🔍 รอตรวจ','✅ เสร็จ'];
    var stOpts=stList.filter(function(s){ return IS_OWNER || s.indexOf('ยกเลิก')<0 || s===t.status; })   // ทีมตั้ง "ยกเลิก" ไม่ได้
      .map(function(s){ return '<option'+(s===t.status?' selected':'')+'>'+esc(s)+'</option>'; }).join('');
    var curCatK=bCat(t.category).k;
    var catOpts=BCATS_EDIT.map(function(o){ return '<option value="'+esc(o.v)+'"'+(o.k===curCatK?' selected':'')+'>'+o.lb+'</option>'; }).join('');
    var pjOpts='<option value="">— ไม่ผูก project —</option>'+ME_PROJ.map(function(pp){ return '<option value="'+esc(pp.id)+'"'+(pp.id===t.project?' selected':'')+'>'+esc(pp.name)+'</option>'; }).join('');
    var dueVal=t.dueMs?bIso(t.dueMs):'';
    modal('<h3>✏️ '+esc(t.no)+' · '+esc(t.customer||'')+'</h3><div id="mErr" class="m-err hidden"></div>'+
      '<div class="fld"><label>หัวข้องาน</label><input id="meTitle" value="'+esc(t.title||'')+'" placeholder="หัวข้อสั้น ๆ"></div>'+
      '<div class="fld"><label>🏢 บริษัท/ลูกค้า</label><input id="meCust" value="'+esc(t.customer||'')+'" placeholder="ชื่อบริษัท (ให้ตรงกับกลุ่มลูกค้า)"></div>'+
      (t.detail?'<div class="fld"><label>รายละเอียด</label><div style="white-space:pre-wrap;font-size:14px;color:#4A5262">'+esc(t.detail)+'</div></div>':'')+
      '<div class="fld"><label>🔗 ลิงก์งาน <span class="bd-age">(หลายลิงก์ = บรรทัดละ ชื่อ | url)</span></label><textarea id="meWl" placeholder="https://...">'+esc(t.worklink||'')+'</textarea></div>'+
      '<div class="fld"><label>สถานะ</label><select id="meStatus">'+stOpts+'</select></div>'+
      '<div class="fld"><label>ผู้รับผิดชอบ</label><select id="meAsg">'+memOpts(ME_TEAM, t.assigneeUid, '— ยังไม่มอบหมาย —')+'</select></div>'+
      '<div class="fld"><label>ผู้ตรวจงาน</label><select id="meRev">'+memOpts(ME_TEAM, t.reviewerUid, '— ผู้ดูแล (ค่าเริ่มต้น) —')+'</select></div>'+
      '<div class="fld"><label>ประเภท <span class="bd-age">(กำหนดสีการ์ด)</span></label><select id="meCat">'+catOpts+'</select></div>'+
      '<div class="fld"><label>กำหนดเสร็จ</label><input id="meDue" type="date" value="'+dueVal+'"></div>'+
      '<div class="fld"><label>📁 จัดเข้า Project</label><select id="meProject">'+pjOpts+'</select></div>'+
      '<div class="m-act"><button class="btn btn-primary" onclick="mSaveTask(\''+esc(no)+'\')">💾 บันทึก</button>'+
      '<button class="btn btn-ghost" onclick="closeModal()">ปิด</button></div>'+
      (IS_OWNER&&!isDone_(t)&&!isCancel_(t)?'<button class="btn btn-ghost" style="width:100%;margin-top:8px;color:#DC2626" onclick="mCancelTask(\''+esc(no)+'\')">❌ ยกเลิกงาน</button>':''));   // ยกเลิก = พี่เท่านั้น
  }
  function mSaveTask(no){
    var t=ME_ORIG; if(!t||t.no!==no) return;
    var title=$('meTitle').value.trim(), cust=$('meCust').value.trim(), st=$('meStatus').value, asg=$('meAsg').value, rev=$('meRev').value, cat=$('meCat').value, due=$('meDue').value, wl=$('meWl').value.trim();
    var jobs=[];
    if(title!==(t.title||'')) jobs.push(jsonp({action:'waSetTitle',uid:UID,no:no,title:title}));
    if(cust!==(t.customer||'')) jobs.push(jsonp({action:'waSetCustomer',uid:UID,no:no,customer:cust}));
    if(st!==t.status) jobs.push(jsonp({action:'waSetStatus',uid:UID,no:no,status:st}));
    if(asg!==(t.assigneeUid||'')) jobs.push(jsonp({action:'waAssign',uid:UID,no:no,name:asg||' '}));   // ส่ง uid (' ' = ล้าง)
    if(rev!==(t.reviewerUid||'')) jobs.push(jsonp({action:'waSetReviewer',uid:UID,no:no,reviewer:rev||' '}));
    if(bCat(cat).k!==bCat(t.category).k) jobs.push(jsonp({action:'waSetCategory',uid:UID,no:no,category:cat}));
    var curDue=t.dueMs?bIso(t.dueMs):'';
    if(due!==curDue) jobs.push(jsonp({action:'waSetDue',uid:UID,no:no,due:due}));
    var pj=$('meProject').value; if(pj!==(t.project||'')) jobs.push(jsonp({action:'waAssignProject',uid:UID,no:no,pid:pj}));
    if(wl!==String(t.worklink||'').trim()) jobs.push(jsonpPost({action:'waSetWorkLink',uid:UID,no:no,worklink:wl}));   // POST กันลิงก์ยาว
    if(!jobs.length){ closeModal(); return; }
    toast('กำลังบันทึก…');
    Promise.all(jobs).then(function(){ closeModal(); toast('บันทึกแล้ว ✅'); refreshTasksView(); }).catch(function(e){ mErr(e.message); });
  }
  function mCancelTask(no){
    modal('<h3>❌ ยกเลิกงาน '+esc(no)+'</h3><div id="mErr" class="m-err hidden"></div>'+
      '<div class="m-hint">ยกเลิกงานนี้? (ย้ายไปถังขยะ · กู้คืนได้)</div>'+

  }
  window.mEditTask=mEditTask; window.mSaveTask=mSaveTask; window.mCancelTask=mCancelTask; window.mDoCancel=mDoCancel;

  // ── (พี่) หน้าจัดการ Project — list ทุก project + ปุ่มแก้/จัดสมาชิก (ใช้ได้ทั้งคอม+มือถือ) ──
  // เปิด modal ทันที (โชว์โครง/ของเดิม) แล้วค่อย refresh เฉพาะ #pjmList → กดปุ๊บเห็นปั๊บ ไม่ต้องรอเน็ต

  function apSetDur(btn){ Array.prototype.forEach.call(btn.parentNode.children,function(b){ b.style.border='1.5px solid var(--line)'; b.style.background='#fff'; b.style.color=''; b.style.fontWeight='400'; }); btn.style.border='1.5px solid #1B72E8'; btn.style.background='#EAF2FF'; btn.style.color='#1B72E8'; btn.style.fontWeight='600'; APPT_DUR=parseInt(btn.getAttribute('data-min'),10); }

  function apDefaultStart(){ var d=new Date(); d.setMinutes(0,0,0); d.setHours(d.getHours()+1); function p(n){return(n<10?'0':'')+n;} if($('apStart')) $('apStart').value=d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes()); }
  function apSubmit(){

  function sdPaint(items, name){

      if(!r||!r.ok){ toast((r&&r.error)||'โหลดไม่สำเร็จ'); return; }
      var arr=(r.tasks||[]).filter(function(t){ return !isCancel_(t); });
      var statuses=r.statuses||[];
      if(!arr.length){ modal('<h3>✏️ ปรับสถานะหลายใบ</h3><div class="emptybox">ยังไม่มีงาน 😊</div><div class="m-act"><button class="btn btn-ghost" onclick="closeModal()">ปิด</button></div>'); return; }
      var opts=statuses.filter(function(s){ return IS_OWNER || s.indexOf('ยกเลิก')<0; })   // ทีมตั้ง "ยกเลิก" ไม่ได้ (กฎเหล็ก)
        .map(function(s){ return '<option value="'+esc(s)+'">'+esc(s)+'</option>'; }).join('');
      var rows=arr.map(function(t){
        return '<label class="bchk"><input type="checkbox" class="bulk-cb" value="'+esc(t.no)+'">'+
          '<span class="bchk-tx"><b>'+esc(t.no)+'</b> · '+esc(t.customer||'-')+' <span class="bchk-cur">'+esc(t.status)+'</span>'+
          ((t.title||t.detail)?'<br><span class="bchk-sub">'+esc(t.title||t.detail)+'</span>':'')+'</span></label>';
      }).join('');
      modal('<h3>✏️ ปรับสถานะหลายใบ</h3><div class="m-hint">เลือกงาน แล้วเลือกสถานะปลายทาง → ปรับพร้อมกันทีเดียว (ปรับข้อมูลในระบบ · ไม่แจ้งลูกค้า)</div>'+
        '<div class="fld"><label>เปลี่ยนสถานะเป็น</label><select id="bulkStatusSel">'+opts+'</select></div>'+
        '<label class="bchk bchk-all"><input type="checkbox" onclick="bulkAll(this)"> <b>เลือกทั้งหมด ('+arr.length+')</b></label>'+
        '<div class="bchk-wrap">'+rows+'</div>'+
        '<div class="m-act"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button>'+
        '<button class="btn btn-primary" onclick="doBulkStatus()">ปรับสถานะที่เลือก</button></div>');
    }).catch(function(e){ toast(e.message); });
  }
  function doBulkStatus(){
    var nos=[]; Array.prototype.forEach.call(document.querySelectorAll('.bulk-cb:checked'),function(c){ nos.push(c.value); });
    if(!nos.length){ toast('เลือกงานก่อนนะคะ'); return; }

    if(!st){ toast('เลือกสถานะก่อน'); return; }
    toast('กำลังปรับ '+nos.length+' รายการ…');

      if(!r||!r.ok){ toast((r&&r.error)||'ไม่สำเร็จ'); return; }
      closeModal(); toast('✏️ ปรับสถานะ '+(r.updated||0)+' ใบแล้ว'); renderOwnerBoard(BSCOPE,true);
    }).catch(function(e){ toast(e.message); });
  }
  window.openBulkStatus=openBulkStatus; window.doBulkStatus=doBulkStatus;

  // ═══════════ VIEW: เบิกค่าใช้จ่าย ═══════════
  function renderExpense(){
    skel();
    jsonp({action:'waExpenseInit', uid:UID}).then(function(r){
      if(!r||!r.ok){ $('main').innerHTML='<div class="card"><div class="empty">'+esc((r&&r.error)||'โหลดไม่สำเร็จ')+'</div></div>'; return; }
      EXP_TYPES=r.types||EXP_TYPES; SECTIONS=r.sections||SECTIONS;   // sections ไว้ให้ปุ่มแก้ภาษีในหน้านี้
      ENTITIES=r.entities||ENTITIES; DEF_ENT=r.defaultEntity||DEF_ENT;   // บริษัทผู้ออกเอกสาร (E1)
      PETTY_ENTS=r.pettyEntities||PETTY_ENTS; PAY_CHANNELS=r.payChannels||PAY_CHANNELS;   // เงินสดย่อย (E2)
      MYBANK=r.myBank||{name:'',acct:'',owner:''}; BANK_LIST=r.banks||[]; HAS_BANK=!!r.hasBank;
      paintExpense(r.expenses||[]);
      sigRefresh();
    }).catch(function(e){ $('main').innerHTML='<div class="card"><div class="empty">'+esc(e.message)+'</div></div>'; });
  }
  // ═══════════ ตารางรายการ + เมนู ⋮ (มาตรฐานหมวดการเงิน · พี่กี้เคาะ 1 ก.ย. 2569) ═══════════
  // spec: docs/spec-finance-table-ui.md — ปุ่มสั่งงานทุกใบอยู่ที่เดียว (ขวาสุด) ไม่ขยับตามสถานะ
  var DT_ACT = {};      // rowId → [{label, call, href, danger, sep}]
  var DT_OPEN = null;   // element เมนูที่เปิดอยู่ (เปิดได้ทีละอัน)

  /** ปุ่ม ⋮ ประจำแถว — เก็บรายการคำสั่งไว้ใน DT_ACT ตอน render แล้วเปิดตอนกด */
  function dtActCell(rowId, actions){
    if(!actions || !actions.length) return '<td class="dt-act">—</td>';
    DT_ACT[rowId] = actions;
    return '<td class="dt-act"><button class="dt-mbtn" title="จัดการ" onclick="dtMenu(event,\'' + esc(rowId) + '\')">⋮</button></td>';
  }
  /** เปิดเมนูคำสั่งของแถว (position:fixed — ตารางอยู่ใน overflow-x:auto เมนู absolute จะโดนตัด) */
  function dtMenu(ev, rowId){
    ev.preventDefault(); ev.stopPropagation();
    var items = DT_ACT[rowId] || [];
    dtCloseMenu();
    if(!items.length) return;
    var box = document.createElement('div');
    box.className = 'dt-menu';
    box.innerHTML = items.map(function(it){
      if(it.sep) return '<div class="dt-sep"></div>';
      var cls = it.danger ? ' class="dt-danger"' : '';
      return it.href
        ? '<a href="' + esc(it.href) + '" target="_blank" rel="noopener"' + cls + ' onclick="dtCloseMenu()">' + esc(it.label) + '</a>'
        : '<button' + cls + ' onclick="dtCloseMenu();' + it.call + '">' + esc(it.label) + '</button>';
    }).join('');
    document.body.appendChild(box);
    // วางใต้ปุ่ม · ชนขอบล่าง/ขวา = พลิกขึ้น/ชิดขวา (จอมือถือเตี้ย เมนูยาว ต้องไม่ตกจอ)
    var r = ev.currentTarget.getBoundingClientRect(), mw = box.offsetWidth, mh = box.offsetHeight;
    var left = Math.min(r.right - mw, window.innerWidth - mw - 8);
    var top = (r.bottom + mh + 8 > window.innerHeight) ? Math.max(8, r.top - mh - 4) : r.bottom + 4;
    box.style.left = Math.max(8, left) + 'px';
    box.style.top = top + 'px';
    DT_OPEN = box;
    setTimeout(function(){
      document.addEventListener('click', dtCloseMenu, { once:true });
      window.addEventListener('scroll', dtCloseMenu, { once:true, capture:true });
    }, 0);
  }
  function dtCloseMenu(){ if(DT_OPEN && DT_OPEN.parentNode) DT_OPEN.parentNode.removeChild(DT_OPEN); DT_OPEN = null; }
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') dtCloseMenu(); });
  window.dtMenu = dtMenu; window.dtCloseMenu = dtCloseMenu;

  /** ตารางมาตรฐาน: cols = [{k,label,cls}] · rows = [[html,...]] · คืน '' ถ้าไม่มีแถว (ผู้เรียกใส่ empty เอง) */
  function dtTable(cols, rows, totalRow){
    if(!rows.length) return '';
    return '<div class="tax-tbl-wrap"><table class="tax-tbl dt-tbl">' +
      '<colgroup>' + cols.map(function(c){ return '<col' + (c.w ? ' style="width:' + c.w + '"' : '') + '>'; }).join('') + '</colgroup>' +
      '<thead><tr>' +
      cols.map(function(c){ return '<th' + (c.cls ? ' class="' + c.cls + '"' : '') + '>' + esc(c.label) + '</th>'; }).join('') +
      '</tr></thead><tbody>' + rows.join('') + '</tbody>' +
      (totalRow || '') + '</table></div>';
  }
  window.dtTable = dtTable;

  /**
   * รายการคำสั่งในเมนู ⋮ ของใบเบิก 1 ใบ — **ฟังก์ชันบริสุทธิ์** (ของจริงกับเทสเรียกตัวนี้ตัวเดียว)
   * เงื่อนไขต้องตรงกับด่านฝั่ง backend เป๊ะ: จ่ายแล้วห้ามแก้ยอด · ออก 50 ทวิ แล้วห้ามแก้ภาษี ·
   * ออกเอกสารแล้วห้ามย้อนสถานะ (ซ่อนปุ่มไม่ใช่การกัน — backend ยังตรวจเองทุกเส้น
   *  แต่ปุ่มที่กดแล้วโดนปฏิเสธเสมอไม่ควรมีให้กด)
   * @return {Array} [{key,label,call|href,danger,sep}]
   */
  function expRowActions(x, isOwner, hasManyEnt){
    var st = String(x.status || '');
    var paid = st.indexOf('จ่ายแล้ว') >= 0;
    var pending = st.indexOf('รออนุมัติ') >= 0;
    var rejected = st.indexOf('ไม่อนุมัติ') >= 0;
    // ⚠️ "รออนุมัติ" กับ "ไม่อนุมัติ" มีคำว่า "อนุมัติ" อยู่ข้างใน — ต้องคัดสองตัวนี้ออกก่อน
    //    (การ์ดรุ่นเดิมเช็คแค่ indexOf("อนุมัติ") จึงโชว์ปุ่มของใบที่อนุมัติแล้วบนใบที่ยังรออนุมัติ)
    var approved = !pending && !rejected && st.indexOf('อนุมัติ') >= 0;
    var rv = !!(x.docType && x.docType.indexOf('ใบสำคัญ') >= 0);
    var hasDoc = !!(x.docNo || x.whtNo);
    var q = "'" + String(x.no).replace(/'/g, "\\'") + "'";
    var a = [];

    if(x.receiptUrl) a.push({ key:'proof', label:'🔍 ดูหลักฐานที่แนบ', href:x.receiptUrl });
    if(x.docLink)    a.push({ key:'doc',   label:'📄 ' + (x.docNo || 'เอกสาร'), href:x.docLink });
    if(x.whtLink)    a.push({ key:'wht',   label:'🧾 50 ทวิ ' + (x.whtNo || ''), href:x.whtLink });
    if(x.dossier)    a.push({ key:'dossier', label:'🗂️ แฟ้มครบชุด', href:x.dossier });
    if(x.paidSlip)   a.push({ key:'slip',  label:'💸 สลิปโอนคืน', href:x.paidSlip });
    if(!isOwner) return a;   // พนักงานเห็นแค่ลิงก์เอกสารของใบตัวเอง

    if(a.length) a.push({ sep:true });
    // ── งานหลักตามสถานะ (อยู่บนสุดของกลุ่มคำสั่ง) ──
    if(pending){
      // ใบธรรมดาผ่าน exApprove — มีหลายนิติบุคคลถึงจะถามบริษัทก่อน (บริษัทเดียว = อนุมัติทันทีเหมือนเดิม)
      a.push({ key:'approve', label:'✅ อนุมัติ', call:(x.payeeName ? 'exOpenWht(' + q + ')' : 'exApprove(' + q + ')') });
      a.push({ key:'reject',  label:'❌ ไม่อนุมัติ', call:'exReject(' + q + ')' });
    }
    if(approved && !paid){
      a.push({ key:'pay', label:'💰 บันทึกจ่ายคืน',
        call:'exOpenPay(' + q + ",'" + String(x.nick || '').replace(/'/g, "\\'") + "'," + (Number(x.amount) || 0) + ',' + (rv && !x.docNo ? 1 : 0) + ')' });
    }
    if(rv && !x.docNo) a.push({ key:'relink', label:'🔗 ส่งลิงก์เซ็นใหม่', call:'exRelink(' + q + ')' });

    // ── งานแก้ไข ──
    a.push({ sep:true });
    a.push({ key:'type', label:'✏️ แก้ประเภทค่าใช้จ่าย', call:'exEditType(' + q + ')' });
    if(!paid) a.push({ key:'amount', label:'✏️ แก้ยอด/รายละเอียด', call:'exEditAmount(' + q + ')' });
    if(x.payeeName && !x.whtNo) a.push({ key:'whtedit', label:'🧾 แก้ภาษีหัก ณ ที่จ่าย', call:'exEditWht(' + q + ')' });
    if(!rv) a.push({ key:'proofType', label:'🧾 แก้หลักฐาน (ใบเสร็จ/SR)', call:'exSetProof(' + q + ')' });
    // บริษัทผู้ออกเอกสาร — เปลี่ยนได้จนกว่าจะออกกระดาษ (เงื่อนไขเดียวกับด่าน setExpenseEntity_)
    if(hasManyEnt && !hasDoc) a.push({ key:'entity', label:'🏢 บริษัทผู้ออกเอกสาร', call:'exSetEntity(' + q + ')' });
    if(rv)  a.push({ key:'payee', label:'✏️ แก้ข้อมูลผู้รับเงิน', call:'exEditPayee(' + q + ')' });
    a.push({ key:'rcp', label:'📎 แก้ไฟล์แนบ', call:'exEditRcp(' + q + ')' });
    if(paid) a.push({ key:'editslip', label:'📎 แก้สลิปโอนคืน', call:'exEditSlip(' + q + ')' });
    if(approved || paid) a.push({ key:'rebuild', label:(x.dossier ? '🔄 สร้างแฟ้มใหม่' : '🗂️ สร้างแฟ้มครบชุด'), call:'exRebuild(' + q + ')' });

    // ── ย้อน/ลบ ──
    if(x.bankAcct)
      a.push({ key:'copybank', label:'📋 ก๊อปเลขบัญชี ' + x.bankAcct,
        call:"copyTxt('" + String(x.bankAcct).replace(/'/g, "\\'") + "')" });

    a.push({ sep:true });
    if(!paid && (approved || rejected) && !hasDoc)
      a.push({ key:'undo', label:'↩️ ย้อนเป็นรออนุมัติ', call:'exUndo(' + q + ')' });
    a.push({ key:'trash', label:'🗑️ ยกเลิกใบนี้', call:'exTrash(' + q + ')', danger:true });
    return a;
  }
  window.expRowActions = expRowActions;

  /** คอลัมน์มาตรฐานของตารางใบเบิก (ลำดับตายตัวทุกหน้า · ยอดชิดขวา) */
  function expCols(showNick){
    var c = [{ label:'เลขที่', w:'132px' }, { label:'วันที่', w:'92px' }];
    if(showNick) c.push({ label:'ผู้เบิก', w:'80px' });
    return c.concat([{ label:'ประเภท', w:'118px' }, { label:'รายละเอียด' }, { label:'ยอด (บาท)', cls:'ta-r', w:'112px' },
      { label:'สถานะ', w:'104px' }, { label:'เอกสาร', w:'158px' }, { label:'', w:'46px' }]);
  }
  /** 1 แถวของตารางใบเบิก */
  function expRow(x, showNick){
    EXP_BYNO[x.no] = x;   // modal ทุกตัวดึงข้อมูลใบจากตรงนี้
    var docs = '';
    if(x.docLink)  docs += '<a href="' + esc(x.docLink) + '" target="_blank">📄 ' + esc(x.docNo || 'เอกสาร') + '</a>';
    if(x.whtLink)  docs += '<a href="' + esc(x.whtLink) + '" target="_blank">🧾 50 ทวิ</a>';
    if(x.dossier)  docs += '<a href="' + esc(x.dossier) + '" target="_blank">🗂️ แฟ้ม</a>';
    if(!docs && x.receiptUrl) docs = '<a href="' + esc(x.receiptUrl) + '" target="_blank">🔍 หลักฐาน</a>';
    // ธงที่ต้องเด้งตา: ไม่มีหลักฐานแนบ = จุดเสี่ยงทางภาษี · รอเซ็น = เอกสารยังไม่เกิด
    var flag = '';
    if(x.note && x.note.indexOf('ไม่มีหลักฐาน') >= 0) flag += '<br><span style="color:#E5484D;font-weight:600">⚠️ ไม่มีหลักฐานแนบ</span>';
    if(x.docType && x.docType.indexOf('ใบสำคัญ') >= 0 && !x.docNo) flag += '<br><span style="color:#C8730B">✍️ รอผู้รับเงินลงนาม</span>';
    else if(x.docType && x.docType.indexOf('ใบรับรอง') >= 0 && !x.docNo) flag += '<br><span style="color:#C8730B">📄 รอออกใบรับรองแทนใบเสร็จ</span>';
    // บัญชีรับโอน: โชว์เฉพาะใบที่ยังไม่จ่าย — จ่ายแล้วไม่ต้องรกตา (ยังก๊อปได้จากเมนู ⋮)
    // ใบที่ออกในนามบริษัทอื่น — ต้องเห็นจากตารางเลย (เอกสาร/ภาษีเดินตามบริษัทนี้)
    if(x.entity) flag += '<br><span style="color:#1B72E8">🏢 ' + esc(entName(x.entity)) + '</span>';
    if(x.bankAcct && String(x.status || '').indexOf('จ่ายแล้ว') < 0)
      flag += '<br><span style="color:#1B7F4B">🏦 ' + esc(x.bankName || '') + ' · <b>' + esc(x.bankAcct) + '</b>' +
              (x.bankOwner ? ' · ' + esc(x.bankOwner) : '') + '</span>';
    return '<tr id="exr-' + esc(x.no) + '">' +
      '<td>' + esc(x.no) + '</td>' +
      '<td>' + esc(String(x.createdAt || '').split(' ')[0] || '-') + '</td>' +
      (showNick ? '<td>' + esc(x.nick || '-') + '</td>' : '') +
      '<td>' + esc(x.type || '-') + '</td>' +
      '<td class="dt-detail">' + esc(x.detail || '-') + flag + '</td>' +
      '<td class="dt-amt">' + money(x.amount) + '</td>' +
      '<td><span class="tk-badge ' + expBadge(x.status) + '">' + esc(x.status) + '</span></td>' +
      '<td class="dt-doc">' + (docs || '—') + '</td>' +
      dtActCell('ex-' + x.no, expRowActions(x, IS_OWNER, multiEnt())) +
      '</tr>';
  }
  /** ตารางใบเบิก 1 ก้อน (หัวข้อ + ตาราง + แถวรวม) */
  function expTable(title, list, showNick, emptyText){
    var h = '<div class="dt-sec">' + esc(title) + ' (' + list.length + ')</div>';
    if(!list.length) return h + '<div class="card"><div class="emptybox">' + esc(emptyText || 'ไม่มีรายการ') + '</div></div>';
    var sum = list.reduce(function(a, x){ return a + (Number(x.amount) || 0); }, 0);
    var cols = expCols(showNick);
    var total = list.length > 1
      ? '<tr class="tax-total"><td colspan="' + (showNick ? 5 : 4) + '" style="text-align:right">รวม ' + list.length + ' ใบ</td>' +
        '<td class="dt-amt">' + money(sum) + '</td><td colspan="3"></td></tr>'
      : '';
    return h + dtTable(cols, list.map(function(x){ return expRow(x, showNick); }), total);
  }
  window.expRow = expRow; window.expTable = expTable;

  function expBadge(s){ s=String(s||''); if(s.indexOf('จ่าย')>=0)return'b-done'; if(s.indexOf('ไม่')>=0)return'b-cancel'; if(s.indexOf('อนุมัติ')>=0)return'b-doing'; return'b-new'; }
  function paintExpense(list){
    var html='<button class="btn btn-primary" style="width:100%;margin-bottom:10px" onclick="openExpense()">➕ แจ้งเบิกค่าใช้จ่าย</button>'+
      '<button class="btn btn-ghost" style="width:100%;margin-bottom:8px" onclick="openSign()">✍️ ลายเซ็นของฉัน<span id="sigState" style="color:#8A94A6;font-weight:400"></span></button>'+
      // บัญชีรับโอนคืน — ต้องมีก่อนถึงแจ้งเบิกได้ (พี่จะได้ไม่ต้องไล่ถามเลขบัญชีในแชท)
      '<button class="btn btn-ghost" style="width:100%;margin-bottom:14px'+(HAS_BANK?'':';border-color:#E5484D;color:#E5484D')+'" onclick="openBank()">🏦 บัญชีรับโอนของฉัน'+
        '<span style="color:#8A94A6;font-weight:400">'+(HAS_BANK?(' · '+esc(MYBANK.name)+' '+esc(MYBANK.acct)):' · ยังไม่ได้กรอก')+'</span></button>'+
      (IS_OWNER?'<div class="m-hint" style="margin:0 0 12px">👑 มุมผู้ดูแล: เห็นใบเบิก<b>ทุกคน</b> · จัดการ/แก้/ลบได้จากที่นี่</div>':'');
    if(!list.length){ html+='<div class="card"><div class="emptybox">ยังไม่มีรายการเบิก 😊</div></div>'; $('main').innerHTML=html; return; }
    // ตารางมาตรฐาน (พี่กี้เคาะ 1 ก.ย. 69) — ปุ่มสั่งงานรวมในเมนู ⋮ ท้ายแถว ไม่กระจายเป็นลิงก์ยาว
    var sum=list.reduce(function(a,x){ return a+(Number(x.amount)||0); },0);

  /**
   * สลับโหมดหลักฐาน (rcp/sr/rv)
   * sr = ต้องมีลายเซ็นในระบบก่อน (เอกสารคือ "พนักงานรับรองเอง")

   */
  function expSetProof(mode){
    if(mode===true) mode='sr'; if(mode===false) mode='rcp';   // เผื่อ frontend เก่าที่ LINE แคชไว้เรียกแบบ boolean
    EXP_PROOF=mode;
    var on='background:#1B72E8;color:#fff;border-color:#1B72E8', off='background:#fff;color:#1B72E8;border:1.5px solid #1B72E8';
    [['epRcp','rcp'],['epSr','sr'],['epRv','rv']].forEach(function(t){
      var el=$(t[0]); if(el) el.style.cssText='flex:1;font-size:13px;padding:9px 4px;'+(mode===t[1]?on:off);
    });
    var rb=$('epRcpBox'), sb=$('epSrBox'), vb=$('epRvBox'), bb=$('epBankBox');
    // ใบ RV โอนให้คนนอก → ไม่ต้องโชว์บัญชีพนักงาน (ใช้ช่องบัญชีผู้รับเงินในกล่อง RV แทน)
    if(bb) bb.classList.toggle('hidden', mode==='rv');
    if(rb) rb.classList.toggle('hidden', mode!=='rcp');
    if(sb) sb.classList.toggle('hidden', mode!=='sr');
    if(vb) vb.classList.toggle('hidden', mode!=='rv');
    if(mode==='sr'){
      var el=$('epSign'); if(el) el.textContent='กำลังตรวจลายเซ็น…';
      jsonp({action:'waSignGet',uid:UID}).then(function(r){
        var e2=$('epSign'); if(!e2) return;
        if(r&&r.ok&&r.has){ e2.innerHTML='✍️ ใช้ลายเซ็นที่เซ็นไว้ ('+esc(r.updatedAt||'')+')'; }
        else { e2.innerHTML='⚠️ ยังไม่ได้เซ็นลายเซ็น — <a href="#" onclick="closeModal();openSign();return false"><b>กดเซ็นก่อนที่นี่</b></a> แล้วค่อยแจ้งเบิกนะคะ'; }
      }).catch(function(){});
    }
  }

  /** ตรวจ checksum เลขบัตร ปชช ไทย 13 หลัก (จับพิมพ์ผิด/มั่ว · ฟรี · ด่านจริงอยู่ backend) */
  function validThaiId(id){
    var s=String(id||'').replace(/\D/g,''); if(s.length!==13) return false;
    var sum=0; for(var i=0;i<12;i++) sum+=parseInt(s.charAt(i),10)*(13-i);
    return ((11-(sum%11))%10)===parseInt(s.charAt(12),10);
  }
  /** ดึง Drive file id จากลิงก์ → URL รูป thumbnail (โชว์สำเนาบัตร inline ให้พี่เทียบตอนอนุมัติ) */
  function drvThumb(u,w){ var m=String(u||'').match(/[-\w]{25,}/); return m?('https://drive.google.com/thumbnail?id='+m[0]+'&sz=w'+(w||600)):''; }
  function doExpense(){
    var type=$('eType').value, amt=$('eAmt').value, detail=$('eDetail').value.trim();
    if(!(parseFloat(amt)>0)){ mErr('กรอกจำนวนเงินก่อนค่ะ'); return; }
    if(!detail){ mErr('กรอกรายละเอียดก่อนค่ะ'); return; }
    // ใบที่โอนคืนเข้าบัญชีพนักงาน (ไม่ใช่ RV) ต้องมีบัญชีก่อน — ด่านจริงอยู่ backend อันนี้กันเสียเวลาอัปรูป
    if(EXP_PROOF!=='rv' && !HAS_BANK){
      mErr('กรอกบัญชีรับโอนคืนก่อนค่ะ (ปุ่ม 🏦 บัญชีรับโอนของฉัน)'); return;
    }
    var p={action:'waExpCreate',uid:UID,type:type,amount:amt,detail:detail};
    if(EXP_PROOF==='rv'){
      var rn=($('eRvName')||{}).value.trim(), rid=(($('eRvId')||{}).value||'').replace(/\D/g,'');
      var ra=($('eRvAddr')||{}).value.trim(), card=IMGS['eRvCard']||[];
      if(!rn){ mErr('กรอกชื่อผู้รับเงินก่อนค่ะ'); return; }
      if(rid.length!==13){ mErr('เลขบัตรประชาชนผู้รับเงินต้องมี 13 หลักค่ะ'); return; }
      if(!validThaiId(rid)){ mErr('เลขบัตรประชาชนไม่ถูกต้อง — ตรวจเลข 13 หลักอีกครั้งค่ะ (อาจพิมพ์สลับ/ตกหล่น)'); return; }
      if(!ra){ mErr('กรอกที่อยู่ผู้รับเงินก่อนค่ะ'); return; }
      if(!card.length){ mErr('แนบสำเนาบัตรประชาชนผู้รับเงินก่อนค่ะ'); return; }
      var rvb=readBank('erv','บัญชีผู้รับเงิน'); if(!rvb) return;
      p.proof='rv'; p.payeeName=rn; p.payeeId=rid; p.payeeAddr=ra;
      p.payeeBankName=rvb.name; p.payeeBankAcct=rvb.acct; p.payeeBankOwner=rvb.owner;
      p.idcard=JSON.stringify(card);
      var other=IMGS['eRvImg']||[];
      if(other.length) p.imgs=JSON.stringify(other);
    } else if(EXP_PROOF==='sr'){
      var pd=($('ePayDate')||{}).value||'';
      if(!pd){ mErr('ระบุวันที่จ่ายเงินก่อนค่ะ'); return; }
      p.noReceipt='1'; p.payDate=pd;
      var noProof=($('eNoProof')||{}).checked, arr=IMGS['eSrImg']||[];
      if(noProof){
        var why=($('eNoProofWhy')||{}).value.trim();
        if(!why){ mErr('ระบุเหตุผลที่ไม่มีหลักฐานก่อนค่ะ'); return; }
        p.noProofReason=why;
      } else {
        if(!arr.length){ mErr('แนบหลักฐานเท่าที่มีก่อนค่ะ (สลิปโอน/บิลเงินสด) — ถ้าไม่มีจริงๆ ติ๊กช่องด้านล่าง'); return; }
        p.imgs=JSON.stringify(arr);
      }
    } else {
      var rcp=IMGS['eImg']||[];
      if(!rcp.length){ mErr('แนบรูปใบเสร็จก่อนค่ะ (หรือเลือก "ไม่มีใบเสร็จ")'); return; }
      p.imgs=JSON.stringify(rcp);
      // ติ๊กหัก ณ ที่จ่าย → ต้องรู้ว่าหักจากใคร (ชื่อ/เลขผู้เสียภาษี/ที่อยู่ ไปอยู่บน 50 ทวิ)
      if(($('eWht')||{}).checked){
        var wk=($('eWhtKind')||{}).value||'', wn=($('eWhtName')||{}).value.trim();
        var wi=(($('eWhtId')||{}).value||'').replace(/\D/g,''), wa=($('eWhtAddr')||{}).value.trim();
        if(!wn){ mErr(wk==='นิติบุคคล'?'กรอกชื่อบริษัทผู้รับเงินก่อนค่ะ':'กรอกชื่อผู้รับเงินก่อนค่ะ'); return; }
        if(wi.length!==13){ mErr('เลขประจำตัวผู้เสียภาษีต้องมี 13 หลักค่ะ'); return; }
        if(wk!=='นิติบุคคล' && !validThaiId(wi)){ mErr('เลขบัตรประชาชนไม่ถูกต้อง — ตรวจเลข 13 หลักอีกครั้งค่ะ'); return; }

  /** อ่านค่าจาก 3 ช่อง → {name,acct,owner} · คืน null พร้อม mErr ถ้ากรอกไม่ครบ/ผิดรูปแบบ */
  function readBank(pfx, what){
    var sel=$(pfx+'Bank'), name=sel?sel.value:'';
    if(name==='__other__') name=(($(pfx+'BankOther')||{}).value||'').trim();
    var acct=((($(pfx+'Acct')||{}).value)||'').replace(/[^\d\-]/g,'').trim();
    var owner=((($(pfx+'Owner')||{}).value)||'').trim();
    var lead=what?(what+': '):'', digits=acct.replace(/\D/g,'');

    if(!owner){ mErr(lead+'กรอกชื่อบัญชีก่อนค่ะ'); return null; }

  /** ก๊อปข้อความ (เลขบัญชี) — LINE webview บางรุ่นไม่มี navigator.clipboard → fallback textarea */
  function copyTxt(t){
    t=String(t||'');
    function done(){ toast('📋 ก๊อปแล้ว: '+t); }
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(done).catch(function(){ copyFallback(t,done); }); }
    else copyFallback(t,done);
  }
  function copyFallback(t,done){
    var ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0,99999);
    try{ document.execCommand('copy'); done(); }catch(e){ toast('ก๊อปไม่ได้ค่ะ กดค้างที่เลขบัญชีเพื่อคัดลอก'); }
    document.body.removeChild(ta);

            // เอกสารรายจ่าย: มีแล้วโชว์ลิงก์ · ยังไม่มีและไม่มีบิล = กดออกใบรับรองแทนใบเสร็จได้
            (x.docNo?' <a class="ex-lk" href="'+esc(x.docLink||'#')+'" target="_blank">📄 '+esc(x.docNo)+'</a>'
              :(x.proof?'':' <a class="ex-lk" href="#" onclick="ptDoc('+q+');return false">📄 ออกใบรับรองแทนใบเสร็จ</a>'));
          return '<tr'+(locked?' style="opacity:.55"':'')+'>'+
            '<td>'+(locked?'🔒':'<input type="checkbox" onchange="ptToggle('+q+',this.checked)"'+(PT_SEL[x.no]?' checked':'')+'>')+'</td>'+
            '<td class="dt-nw">'+esc(x.date)+'</td>'+
            '<td style="white-space:normal">'+esc(x.detail)+sub+'</td>'+
            '<td class="ta-r dt-nw">'+money(x.amount)+'</td>'+
            '<td class="dt-nw">'+(locked?'<span style="font-size:12px;color:#8A94A6">เบิกคืนแล้ว<br>'+esc(x.claimNo)+'</span>'
              :'<span style="color:#C8730B">รอเบิกคืน</span>')+'</td>'+
            '<td>'+(locked?'':'<a class="ex-lk" href="#" onclick="ptVoid('+q+');return false">🗑️</a>')+'</td></tr>';
        }).join('')+'</tbody></table></div>'+
        '<div id="ptClaimBar" class="tax-acts"></div>';
    }
    h+='</div>';

    // ── ทะเบียนใบสรุปเบิก ──
    h+='<div class="card"><div class="ds-h">📑 ใบสรุปเบิกเงินสดย่อย</div>';
    if(!claims.length){ h+='<div class="emptybox">ยังไม่มีใบสรุปเบิก</div>'; }
    else {
      h+='<div class="tax-tbl-wrap"><table class="tax-tbl"><thead><tr>'+
        '<th>เลขที่</th><th>วันที่</th><th>ช่วงรายการ</th><th>รายการ</th><th>ยอดรวม</th><th>สถานะ</th><th></th></tr></thead><tbody>'+
        claims.map(function(c){
          var q="'"+String(c.no).replace(/'/g,"\\'")+"'";
          var waiting = c.status.indexOf('รอตั้งเบิก')>=0 && !c.payoutNo;   // ยังไม่ส่งเข้าทะเบียนการจ่าย
          var settled = c.status.indexOf('จ่ายคืนแล้ว')>=0;
          var act = waiting
            ? '<a class="ex-lk" href="#" onclick="ptClaimPayout('+q+');return false">📤 ตั้งเบิกจากบริษัท</a>'+
              '<br><a class="ex-lk" href="#" onclick="ptCancelClaim('+q+');return false">ยกเลิก</a>'
            : (settled ? '' : '<a class="ex-lk" href="#" onclick="ptSettleClaim('+q+');return false">✅ บันทึกรับเงินคืน</a>');
          return '<tr><td>'+esc(c.no)+'</td><td class="dt-nw">'+esc(c.date)+'</td><td>'+esc(c.range||'-')+'</td>'+
            '<td>'+c.count+'</td><td class="ta-r dt-nw">'+money(c.total)+'</td>'+
            '<td>'+esc(c.status)+(c.payoutNo?'<br><span style="font-size:12px;color:#8A94A6">'+esc(c.payoutNo)+'</span>':'')+'</td>'+
            '<td>'+act+'</td></tr>';
        }).join('')+'</tbody></table></div>'+
        '<div class="m-hint" style="margin-top:8px">📤 ตั้งเบิกจากบริษัท = สร้างใบจ่ายออกให้อัตโนมัติ '+
        '(ผู้รับเงิน = ผู้ถือเงินสดย่อย · ไม่หักภาษี) → พออนุมัติและกดจ่ายที่หน้า 💵 จ่ายออก '+
        'ระบบจะปิดใบสรุปให้เอง แล้ววงเงินกลับเข้ามือ</div>';
    }
    h+='</div>';

    $('main').innerHTML=h;
    if(PT_FORM==='cash') imgsFldBind('ptcImgs');
    ptSum();
  }
  function ptSaveFund(){
    var amt=($('ptFundAmt')||{}).value, holder=(($('ptFundHolder')||{}).value||'').trim();
    if(!(Number(amt)>0)){ mErr('ใส่วงเงินเป็นตัวเลขมากกว่า 0 ค่ะ'); return; }
    if(!holder){ mErr('ใส่ชื่อผู้ถือเงินค่ะ'); return; }
    callBusy('กำลังบันทึก…', jsonp({action:'waPettyFund',uid:UID,entity:PT_ENT,amount:amt,holder:holder}), 'บันทึกแล้ว').then(function(r){
      if(!r||!r.ok){ mErr((r&&r.error)||'บันทึกไม่สำเร็จ'); return; }
      PT_FORM=''; toast('✅ บันทึกวงเงินแล้ว'); renderPetty();
    }).catch(function(e){ mErr(e.message); });
  }
  function ptSaveCash(){
    var detail=(($('ptcDetail')||{}).value||'').trim(), amt=($('ptcAmt')||{}).value;
    if(!detail){ mErr('กรอกรายละเอียดค่ะ'); return; }
    if(!(Number(amt)>0)){ mErr('จำนวนเงินไม่ถูกต้องค่ะ'); return; }
    var b=$('ptcSend'); if(b){ b.disabled=true; b.textContent='กำลังบันทึก…'; }
    callBusy('กำลังบันทึก…', jsonpPost({action:'waPettyCash',uid:UID,entity:PT_ENT,
      payDate:($('ptcDate')||{}).value||'', type:($('ptcType')||{}).value||'',
      payee:(($('ptcPayee')||{}).value||'').trim(), detail:detail, amount:amt,
      imgs:JSON.stringify(IMGS['ptcImgs']||[])}), 'บันทึกแล้ว').then(function(r){
      if(!r||!r.ok){ if(b){b.disabled=false;b.textContent='บันทึกรายการ';} mErr((r&&r.error)||'บันทึกไม่สำเร็จ'); return; }
      IMGS['ptcImgs']=[]; PT_FORM='';
      toast('✅ บันทึกแล้ว '+(r.no||'')+(r.docNo?' · 📄 ออกใบรับรองแทนใบเสร็จ '+r.docNo:''));
      if(r.warn) setTimeout(function(){ toast('⚠️ '+r.warn); },1200);   // จ่ายเกินวงเงิน = เตือน ไม่ใช่ error
      else if(r.docError) setTimeout(function(){ toast('⚠️ ออกเอกสารไม่สำเร็จ: '+r.docError+' (กดออกเองที่รายการได้)'); },1200);
      renderPetty();
    }).catch(function(e){ if(b){b.disabled=false;b.textContent='บันทึกรายการ';} mErr(e.message); });
  }
  function ptVoid(no){
    if(!confirm('ยกเลิกรายการ '+no+' ?\n(ใช้กับรายการที่บันทึกผิด/ซ้ำ)')) return;
    callBusy('กำลังยกเลิก…', jsonp({action:'waPettyVoid',uid:UID,no:no}), 'ยกเลิกแล้ว').then(function(r){
      if(!r||!r.ok){ toast((r&&r.error)||'ยกเลิกไม่สำเร็จ'); return; }
      delete PT_SEL[no]; toast('🗑️ ยกเลิกรายการแล้ว'); renderPetty();
    }).catch(function(e){ toast(e.message); });

  function ptClaim(){

    if(!nos.length){ toast('ติ๊กรายการก่อนค่ะ'); return; }
    callBusy('กำลังออกใบสรุปเบิก…', jsonp({action:'waPettyClaim',uid:UID,entity:PT_ENT,nos:nos.join(',')}), 'ออกใบแล้ว').then(function(r){

    }).catch(function(e){ toast(e.message); });

      if(!r||!r.ok){ toast((r&&r.error)||'ยกเลิกไม่สำเร็จ'); return; }

  /** ออกใบรับรองแทนใบเสร็จให้รายการจ่ายสดที่ไม่มีบิล */
  function ptDoc(no){
    callBusy('กำลังออกเอกสาร…', jsonp({action:'waPettyDoc',uid:UID,no:no}), 'ออกเอกสารแล้ว').then(function(r){

  /** ตั้งเบิกจากบริษัท → สร้างใบจ่ายออก (E3) */
  function ptClaimPayout(no){
    if(!confirm('ตั้งเบิกใบสรุป '+no+' จากบริษัท?\nระบบจะสร้างใบจ่ายออกให้ผู้ถือเงินสดย่อย (รออนุมัติ)')) return;
    callBusy('กำลังตั้งเบิก…', jsonp({action:'waPettyClaimPayout',uid:UID,no:no}), 'ตั้งเบิกแล้ว').then(function(r){

      toast('📤 สร้างใบจ่ายออก '+r.payoutNo+' แล้ว — ไปอนุมัติที่หน้า 💵 จ่ายออก');
      if(r.warn) setTimeout(function(){ toast('⚠️ '+r.warn); },1400);
      renderPetty();
    }).catch(function(e){ toast(e.message); });
  }
  /** บันทึกว่าบริษัทจ่ายคืนแล้ว (กรณีโอนคืนนอกระบบ) → วงเงินกลับเข้ามือ */
  function ptSettleClaim(no){
    if(!confirm('ยืนยันว่าได้รับเงินคืนจากบริษัทตามใบสรุป '+no+' แล้ว?\nวงเงินในมือจะกลับเต็มตามยอดนี้')) return;
    callBusy('กำลังบันทึก…', jsonp({action:'waPettyClaimSettle',uid:UID,no:no}), 'บันทึกแล้ว').then(function(r){
      if(!r||!r.ok){ toast((r&&r.error)||'บันทึกไม่สำเร็จ'); return; }
      toast('✅ รับเงินคืนแล้ว · วงเงินกลับเข้ามือ'); renderPetty();
    }).catch(function(e){ toast(e.message); });
  }
  window.ptDoc=ptDoc; window.ptClaimPayout=ptClaimPayout; window.ptSettleClaim=ptSettleClaim;
  window.renderPetty=renderPetty; window.ptSetEnt=ptSetEnt; window.ptForm=ptForm; window.ptToggle=ptToggle;
  window.ptSaveFund=ptSaveFund; window.ptSaveCash=ptSaveCash; window.ptVoid=ptVoid;
  window.ptClaim=ptClaim; window.ptCancelClaim=ptCancelClaim;

  function renderPayout(){
    skel();
    jsonp({action:'waPoInit', uid:UID}).then(function(r){
      if(!r||!r.ok){ $('main').innerHTML='<div class="card"><div class="empty">'+esc((r&&r.error)||'โหลดไม่สำเร็จ')+'</div></div>'; return; }
      PO=r; paintPayout();
    }).catch(function(e){ $('main').innerHTML='<div class="card"><div class="empty">'+esc(e.message)+'</div></div>'; });
  }
  /**
   * รายการคำสั่งในเมนู ⋮ ของใบจ่ายออก 1 ใบ — **ฟังก์ชันบริสุทธิ์** (ของจริงกับเทสเรียกตัวนี้ตัวเดียว)
   * mode: 'pending' รออนุมัติ · 'topay' อนุมัติแล้วรอโอน · 'done' จ่ายแล้ว
   * เงื่อนไขตรงกับ backend: แก้ใบได้เฉพาะ "รออนุมัติ" · เอกสาร PV/50ทวิ เกิดตอนกดจ่าย
   */
  function poRowActions(x, mode){
    var q = "'" + String(x.no).replace(/'/g, "\\'") + "'";
    var a = [];
    if(x.proofLink)    a.push({ key:'proof',    label:'📎 ใบแจ้งหนี้/ใบกำกับ', href:x.proofLink });
    if(x.contractLink) a.push({ key:'contract', label:'📄 สัญญา', href:x.contractLink });
    if(x.reqLink)      a.push({ key:'req',      label:'📝 ใบขออนุมัติจ่าย', href:x.reqLink });
    if(x.docLink)      a.push({ key:'pv',       label:'📄 ใบสำคัญจ่าย ' + (x.docNo || ''), href:x.docLink });
    if(x.whtLink)      a.push({ key:'wht',      label:'🧾 50 ทวิ ' + (x.whtNo || ''), href:x.whtLink });
    if(x.whtPayeeLink) a.push({ key:'whtpayee', label:'🧾 50 ทวิ (ฉบับผู้รับเงิน)', href:x.whtPayeeLink });
    if(x.dossier)      a.push({ key:'dossier',  label:'📚 แฟ้มครบชุด', href:x.dossier });
    if(x.paidSlip)     a.push({ key:'slip',     label:'📎 สลิปโอน', href:x.paidSlip });
    if(a.length) a.push({ sep:true });

    if(mode === 'pending'){
      a.push({ key:'approve', label:'✅ อนุมัติ', call:'poDecide(' + q + ",'approve')" });
      a.push({ key:'reject',  label:'❌ ไม่อนุมัติ', call:'poDecide(' + q + ",'reject')" });
      a.push({ sep:true });
      a.push({ key:'edit',    label:'✏️ แก้ใบจ่าย', call:'openPayout(' + q + ')' });   // แก้ได้เฉพาะรออนุมัติ (ด่าน backend)
      a.push({ key:'redoc',   label:'🔄 ออกใบขออนุมัติใหม่', call:'poDocs(' + q + ')' });
    }
    if(mode === 'topay'){
      a.push({ key:'pay', label:'💰 บันทึกจ่ายเงิน', call:'poOpenPay(' + q + ')' });
    }
    if(mode === 'done'){
      if(!x.paidSlip) a.push({ key:'slipadd', label:'📎 แนบสลิปโอน (ยังไม่มี)', call:'poOpenPay(' + q + ')', danger:true });
      a.push({ key:'redoc', label:(x.docNo ? '🔄 ออกเอกสารใหม่' : '📄 ออกเอกสาร'), call:'poDocs(' + q + ')' });
    }
    if(x.bank && x.bank.acct)
      a.push({ key:'copy', label:'📋 ก๊อปเลขบัญชี ' + x.bank.acct, call:"copyTxt('" + String(x.bank.acct).replace(/'/g, "\\'") + "')" });
    if(mode !== 'done'){
      a.push({ sep:true });
      a.push({ key:'cancel', label:'🗑️ ยกเลิกใบนี้', call:'poCancel(' + q + ')', danger:true });
    }
    return a;
  }
  window.poRowActions = poRowActions;

  /** ตารางใบจ่ายออก 1 ก้อน — ลำดับคอลัมน์เดียวกับใบเบิก (เลขที่ · วันที่ · คู่ค้า · ประเภท · รายละเอียด · ยอด · สถานะ · เอกสาร · ⋮) */
  function poTable(title, list, mode){
    list = list || [];
    if(!list.length && mode === 'done') return '';            // ประวัติที่ว่าง ไม่ต้องรก
    var h = '<div class="dt-sec">' + esc(title) + ' (' + list.length + ')</div>';
    if(!list.length) return h + '<div class="card"><div class="emptybox">ไม่มีรายการค่ะ 😊</div></div>';
    var cols = [{ label:'เลขที่', w:'150px' }, { label:'บริษัทผู้จ่าย', w:'130px' }, { label:'ผู้รับเงิน', w:'130px' },
      { label:'ประเภท', w:'118px' }, { label:'รายละเอียด' }, { label:'ยอด (บาท)', cls:'ta-r', w:'112px' },
      { label:'จ่ายจริง', cls:'ta-r', w:'112px' }, { label:'สถานะ', w:'104px' }, { label:'เอกสาร', w:'150px' },
      { label:'', w:'46px' }];
    var rows = list.map(function(x){
      var docs = '';
      if(x.reqLink) docs += '<a href="' + esc(x.reqLink) + '" target="_blank">📝 ขออนุมัติ</a>';
      if(x.docLink) docs += '<a href="' + esc(x.docLink) + '" target="_blank">📄 PV</a>';
      if(x.whtLink) docs += '<a href="' + esc(x.whtLink) + '" target="_blank">🧾 50 ทวิ</a>';
      if(x.dossier) docs += '<a href="' + esc(x.dossier) + '" target="_blank">📚 แฟ้ม</a>';
      // ธงที่ต้องเด้งตา: อนุมัติใบตัวเอง · จ่ายแล้วไม่มีสลิป (แฟ้มขาดหลักฐานการโอน)
      var flag = '';
      if(x.selfApprove) flag += '<br><span style="color:#C8730B">' + esc(x.selfApprove) + '</span>';
      if(mode === 'done' && !x.paidSlip) flag += '<br><span style="color:#DC2626;font-weight:600">📎 ยังไม่มีสลิปโอน</span>';
      if(x.note) flag += '<br><span style="color:#8A94A6">📝 ' + esc(x.note) + '</span>';
      var whtLine = x.whtAmt > 0
        ? '<br><span style="color:#C8730B;font-size:11.5px">หัก ' + esc(x.section || '') + ' ' + x.whtRate + '%</span>' : '';
      return '<tr>' +
        '<td>' + esc(x.no) + '</td>' +
        '<td>' + esc(x.entityName || x.entity || '-') + '</td>' +
        '<td>' + esc(x.payeeName || '-') + '<br><span style="color:#8A94A6;font-size:11.5px">' + esc(x.payeeKind || '') + '</span></td>' +
        '<td>' + esc(x.type || '-') + '</td>' +
        '<td class="dt-detail">' + esc(x.detail || '-') + (x.period ? ' · ' + esc(x.period) : '') + flag + '</td>' +
        '<td class="dt-amt">' + poMoney(x.amount) + whtLine + '</td>' +
        '<td class="dt-amt">' + poMoney(x.whtAmt > 0 ? x.netAmt : x.amount) + '</td>' +
        '<td><span class="tk-badge ' + poBadge(x.status) + '">' + esc(x.status) + '</span></td>' +
        '<td class="dt-doc">' + (docs || '—') + '</td>' +
        dtActCell('po-' + x.no, poRowActions(x, mode)) +
        '</tr>';
    });
    var sum = list.reduce(function(a, x){ return a + (Number(x.whtAmt) > 0 ? Number(x.netAmt || 0) : Number(x.amount || 0)); }, 0);
    var total = list.length > 1
      ? '<tr class="tax-total"><td colspan="6" style="text-align:right">รวมที่ต้องจ่ายจริง ' + list.length + ' ใบ</td>' +
        '<td class="dt-amt">' + poMoney(sum) + '</td><td colspan="3"></td></tr>' : '';
    return h + dtTable(cols, rows, total);
  }
  window.poTable = poTable;

  function poMoney(n){ return (Number(n)||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2}); }
  function poBadge(s){ s=String(s||''); if(s.indexOf('จ่าย')>=0)return'b-done'; if(s.indexOf('ไม่')>=0)return'b-cancel'; if(s.indexOf('อนุมัติ')>=0)return'b-doing'; return'b-new'; }
  /** แบบยื่นที่ใบนี้จะเข้า — mirror formTypeOf_ ฝั่ง backend (นิติบุคคล → ภ.ง.ด.53 ทุกมาตรา) */
  function poFormLabel(kind, sectCode){
    if(!sectCode) return '';
    var s=(PO&&PO.sections||[]).filter(function(x){ return x.code===sectCode; })[0];
    if(!s) return '';
    if(kind==='นิติบุคคล') return 'ภ.ง.ด.53';
    return s.formIfPerson==='PND1' ? 'ภ.ง.ด.1' : (s.formIfPerson==='PND53' ? 'ภ.ง.ด.53' : 'ภ.ง.ด.3');
  }
  function paintPayout(){
    var html='<button class="btn btn-primary" style="width:100%;margin-bottom:10px" onclick="openPayout()">➕ ตั้งเรื่องจ่ายเงิน</button>'+
      '<div class="m-hint" style="margin:0 0 12px">💵 ใบจ่ายของบริษัท — จ่ายค่าเช่า/ค่าจ้าง/ซัพพลาย ในนามนิติบุคคล '+
      '(คนละชุดกับใบเบิกที่พนักงานสำรองจ่าย) · เห็นเฉพาะผู้ดูแลค่ะ</div>';

  }
  function poBlock(title, list, mode){
    list=list||[];

    return poTable(title, list, mode);   // ตารางมาตรฐาน (พี่กี้เคาะ 1 ก.ย. 69) — ปุ่มรวมในเมนู ⋮
  }

  // ───── ฟอร์มตั้งเรื่อง / แก้ไข ─────
  var PO_PAYEE='out';   // 'out' = คนนอก (พิมพ์เอง) · 'staff' = พนักงานในทีม (ดึงชื่อ+บัญชีให้)
  function openPayout(no){

    var sectOpts='<option value="">— ไม่หักภาษี ณ ที่จ่าย —</option>'+(PO.sections||[]).map(function(s){
