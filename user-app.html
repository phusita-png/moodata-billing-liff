  /** ประวัติรับชำระของใบนี้ (รวมรายการที่ยกเลิกไว้ให้เห็น — เงินต้องตามรอยได้) */
  function recvHistoryHtml(h){
    if(!h||!h.length) return '';
    return '<div class="fld"><label>ประวัติรับชำระ</label>'+h.map(function(x){
      var voided=String(x.status).indexOf('ยกเลิก')>=0;
      return '<div style="padding:6px 8px;border:1px solid var(--line);border-radius:9px;margin-bottom:5px;font-size:12.5px'+
        (voided?';opacity:.55;text-decoration:line-through':'')+'">'+
        '<b>'+esc(x.no)+'</b> · '+esc(x.date)+' · '+money(x.amount)+' บาท'+
        (x.wht>0?' <span style="color:#C8730B">(หัก '+money(x.wht)+')</span>':'')+
        (x.reNo?' · ใบเสร็จ '+esc(x.reNo):'')+
        (x.slip?' <a href="'+esc(x.slip)+'" target="_blank">สลิป</a>':'')+
        (x.whtCert?' <a href="'+esc(x.whtCert)+'" target="_blank">50ทวิ</a>':
          (x.wht>0?' <a href="#" onclick="recvCertOpen(\''+esc(x.no)+'\');return false" style="color:#C8730B">แนบ 50 ทวิ</a>':''))+
        (!voided&&!x.reNo?' · <a href="#" onclick="recvVoid(\''+esc(x.no)+'\');return false" style="color:#DC2626">ยกเลิก</a>':'')+
        '</div>';
    }).join('')+'</div>';

  /** พรีวิว: เงินเข้า + ภาษีที่ถูกหัก = ยอดที่ปิดหนี้ (กติกาเดียวกับ backend) */
  function recvPreview(){
    var box=$('rvSum'); if(!box||!RECV) return;
    var amt=Number(((($('rvAmt')||{}).value)||'0').replace(/,/g,''))||0;
    var wht=Number(((($('rvWht')||{}).value)||'0').replace(/,/g,''))||0;
    var settled=Math.round((amt+wht)*100)/100;
    var left=Math.round((RECV.balance-settled)*100)/100;
    var over=settled>RECV.balance+0.005;
    box.innerHTML='ปิดหนี้รอบนี้ <b>'+money(settled)+'</b> บาท (เงินเข้า '+money(amt)+
      (wht>0?' + ภาษีที่ถูกหัก '+money(wht):'')+')'+
      (over?'<br><span style="color:#DC2626">⚠️ เกินยอดคงค้าง '+money(RECV.balance)+' บาท</span>'
           :'<br>คงเหลือหลังรอบนี้ <b>'+money(left<0?0:left)+'</b> บาท'+(left<=0.005?' · ปิดใบ ✅':''));
  }
  function recvSave(ivNo){
    var amt=((($('rvAmt')||{}).value)||'').trim();
    var p={action:'waRecvSave',uid:UID,no:ivNo,amount:amt,
      wht:((($('rvWht')||{}).value)||'0').trim(),
      recvDate:(($('rvDate')||{}).value)||'', method:(($('rvMethod')||{}).value)||'',
      bank:((($('rvBank')||{}).value)||'').trim(), note:((($('rvNote')||{}).value)||'').trim(),
      issueRe:(($('rvIssue')||{}).checked?'1':'0')};
    var slips=IMGS['rvSlip']||[], certs=IMGS['rvCert']||[];
    if(slips.length) p.slips=JSON.stringify(slips);
    if(certs.length) p.certs=JSON.stringify(certs);
    var btn=$('rvBtn'); if(btn){ btn.disabled=true; btn.textContent='กำลังบันทึก…'; }
    callBusy('กำลังบันทึกรับชำระ…', jsonpPost(p), 'บันทึกแล้ว').then(function(r){
      if(!r||!r.ok){ if(btn){btn.disabled=false;btn.textContent='บันทึกรับชำระ';} mErr((r&&r.error)||'บันทึกไม่สำเร็จ'); return; }
      closeModal(); IMGS['rvSlip']=[]; IMGS['rvCert']=[];
      toast('💵 '+r.no+(r.reNo?' · ออกใบเสร็จ '+r.reNo:'')+' · คงค้าง '+money(r.balance)+
        (r.warn?' ⚠️ '+r.warn:''));
      if(VIEW==='ar') renderAr(); else renderSales();
    }).catch(function(e){ if(btn){btn.disabled=false;btn.textContent='บันทึกรับชำระ';} mErr(e.message); });
  }
  function recvVoid(no){

      closeModal(); toast('🚫 ยกเลิก '+no+' แล้ว · คงค้าง '+money(r.balance));
      if(VIEW==='ar') renderAr(); else renderSales();
    }).catch(function(e){ mErr(e.message); });
  }

  // ═══════════ 🧾 ใบลดหนี้ (CN) — ออกจากใบเสร็จเท่านั้น · spec §12 ═══════════
  // ⚠️ เงื่อนไขบนหน้านี้ต้องตรงกับด่าน backend เป๊ะ: ลดเกินยอดที่เหลือไม่ได้ ·
  //    เลือก "อื่น ๆ" ต้องพิมพ์เหตุผล (กฎหมายบังคับให้พิมพ์เหตุผลบนใบลดหนี้)
  var CNI = null, CN_ITEMS = [];

  function cnOpen(reNo){
    busy('กำลังเปิดใบเสร็จ…');
    jsonp({action:'waCnInit',uid:UID,no:reNo}).then(function(r){
      unbusy();
      if(!r||!r.ok){ toast((r&&r.error)||'เปิดไม่สำเร็จ'); return; }
      CNI=r; CN_ITEMS=[{}];
      var reasons=(r.reasons||[]).map(function(x){ return '<option value="'+esc(x.key)+'">'+esc(x.label)+'</option>'; }).join('');
      modal('<h3>🧾 ออกใบลดหนี้</h3><div id="mErr" class="m-err hidden"></div>'+
        '<div class="m-hint">ลดจากใบเสร็จ <b>'+esc(r.re.no)+'</b> · '+esc(r.re.customer)+
          (r.re.docDate?' · '+esc(r.re.docDate):'')+'<br>'+
          'ยอดตามใบ '+money(r.re.total)+' บาท'+
          (r.credited.n?' · ลดไปแล้ว '+money(r.credited.total)+' ('+r.credited.n+' ใบ)':'')+
          '<br>ลดได้อีก <b style="font-size:15px">'+money(r.remain.total)+'</b> บาท'+
          (r.re.wht>0?'<br><span style="color:#C8730B">ใบนี้ลูกค้าหักภาษีไว้ '+money(r.re.wht)+' บาท — เงินที่ต้องคืนจะหักส่วนนี้ออก</span>':'')+
        '</div>'+
        '<div class="fld"><label>ลดเท่าไร</label><select id="cnMode" onchange="cnModeChange()">'+
          '<option value="full">ลดเต็มจำนวนที่เหลือ ('+money(r.remain.total)+' บาท)</option>'+
          '<option value="partial">ลดบางส่วน (ระบุรายการ)</option></select></div>'+
        '<div id="cnItemsBox" class="hidden"><label class="field-lb">รายการที่ลด</label>'+
          '<div id="cnItems"></div>'+
          '<button class="btn btn-ghost" style="margin:2px 0 8px" onclick="cnAddItem()">+ เพิ่มบรรทัด</button></div>'+
        '<div class="fld"><label>เหตุผลการลดหนี้ (พิมพ์ลงบนใบ)</label>'+
          '<select id="cnReason" onchange="cnPreview()">'+reasons+'</select></div>'+
        '<div class="fld"><label>รายละเอียดเหตุผลเพิ่มเติม</label>'+
          '<input id="cnReasonText" placeholder="เลือก &quot;อื่น ๆ&quot; ต้องพิมพ์ช่องนี้" oninput="cnPreview()"></div>'+
        '<div class="fld"><label>วันที่ใบลดหนี้</label><input id="cnDate" type="date" value="'+todayISO()+'"></div>'+
        '<div class="fld"><label>หมายเหตุ (ไม่ใส่ก็ได้)</label><input id="cnNote"></div>'+
        '<div id="cnSum" class="m-hint"></div>'+
        '<div class="m-act"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button>'+
        '<button class="btn btn-primary" id="cnBtn" onclick="cnSave()">ออกใบลดหนี้</button></div>');
      paintCnItems(); cnPreview();
    }).catch(function(e){ unbusy(); toast(e.message); });
  }
  function cnModeChange(){
    var box=$('cnItemsBox'); if(box) box.className=(($('cnMode')||{}).value==='partial')?'':'hidden';
    cnPreview();
  }
  function cnReadItems(){
    CN_ITEMS=[];
    var n=document.querySelectorAll('#cnItems .cn-it').length;
    for(var i=0;i<n;i++){
      CN_ITEMS.push({ detail:((($('cnD'+i)||{}).value)||'').trim(),
        price:((($('cnP'+i)||{}).value)||'').trim() });
    }
    if(!CN_ITEMS.length) CN_ITEMS=[{}];
  }
  function paintCnItems(){
    var box=$('cnItems'); if(!box) return;
    box.innerHTML=CN_ITEMS.map(function(it,i){
      return '<div class="cn-it" style="display:flex;gap:6px;margin-bottom:6px">'+
        '<input id="cnD'+i+'" placeholder="รายการที่ลด" value="'+esc(it.detail||'')+'" style="flex:1" oninput="cnPreview()">'+
        '<input id="cnP'+i+'" inputmode="decimal" placeholder="ยอดก่อน VAT" value="'+esc(it.price||'')+'" style="width:120px" oninput="cnPreview()">'+
        (CN_ITEMS.length>1?'<button class="btn btn-ghost" onclick="cnDelItem('+i+')">✕</button>':'')+
        '</div>';
    }).join('');
  }
  function cnAddItem(){ cnReadItems(); CN_ITEMS.push({}); paintCnItems(); }
  function cnDelItem(i){ cnReadItems(); CN_ITEMS.splice(i,1); if(!CN_ITEMS.length) CN_ITEMS=[{}]; paintCnItems(); }
  /** พรีวิวยอด — ใช้อัตรา VAT/WHT ของ "ใบเสร็จต้นทาง" ตามกติกาเดียวกับ backend
   *  (ตัวเลขจริงที่บันทึกมาจาก backend เสมอ · ตรงนี้ให้พี่เห็นก่อนกดเท่านั้น) */
  function cnPreview(){
    var box=$('cnSum'); if(!box||!CNI) return;
    var full=(($('cnMode')||{}).value||'full')!=='partial';
    var re=CNI.re, rem=CNI.remain, base,vat,total;
    if(full){ base=rem.base; vat=rem.vat; total=rem.total; }
    else{
      cnReadItems();
      base=0; CN_ITEMS.forEach(function(it){ base+=Number(String(it.price||'0').replace(/,/g,''))||0; });
      base=Math.round(base*100)/100;
      vat=Math.round(base*re.vatRate)/100;
      total=Math.round((base+vat)*100)/100;
    }
    var wht=full?rem.wht:Math.round(base*re.whtRate)/100;
    var refund=Math.round((total-wht)*100)/100;
    var over=total>rem.total+0.005;
    var rs=(($('cnReason')||{}).value)||'', rt=((($('cnReasonText')||{}).value)||'').trim();
    box.innerHTML='ยอดที่ลด <b>'+money(total)+'</b> บาท'+(re.vatRate>0?' (ฐาน '+money(base)+' + VAT '+money(vat)+')':'')+
      (wht>0?'<br>ภาษีที่ลูกค้าหักไว้ '+money(wht)+' → <b>เงินที่ต้องคืนลูกค้า '+money(refund)+' บาท</b>'
            :'<br><b>เงินที่ต้องคืนลูกค้า '+money(refund)+' บาท</b>')+
      (over?'<br><span style="color:#DC2626">⚠️ เกินยอดที่ลดได้ '+money(rem.total)+' บาท</span>':'')+
      (rs==='other'&&!rt?'<br><span style="color:#DC2626">⚠️ เลือก "อื่น ๆ" ต้องพิมพ์เหตุผล</span>':'');
  }
  function cnSave(){
    if(!CNI) return;
    var mode=(($('cnMode')||{}).value)||'full';
    var p={action:'waCnCreate',uid:UID,no:CNI.re.no,mode:mode,
      reason:(($('cnReason')||{}).value)||'',
      reasonText:((($('cnReasonText')||{}).value)||'').trim(),
      docDate:(($('cnDate')||{}).value)||'', note:((($('cnNote')||{}).value)||'').trim()};
    if(mode==='partial'){
      cnReadItems();
      var items=CN_ITEMS.filter(function(it){ return it.detail||it.price; })

  function branchFieldHtml(k, val){
    var v=String(val||'').trim();

    var no=isHq?'':v.replace(/^สาขาที่\s*/,'');
    return '<div class="fld"><label>สำนักงานใหญ่ / สาขา</label>'+
      '<select id="'+k+'BrKind" onchange="branchToggle(\''+k+'\')">'+
        '<option value="hq"'+(isHq?' selected':'')+'>สำนักงานใหญ่</option>'+
        '<option value="br"'+(isHq?'':' selected')+'>สาขา (ระบุเลขที่)</option>'+
      '</select>'+
      '<input id="'+k+'BrNo" class="'+(isHq?'hidden':'')+'" style="margin-top:6px" '+
        'placeholder="เลขที่สาขา เช่น 00002" value="'+esc(no)+'"></div>';
  }
  function branchToggle(k){
    var kind=(($(k+'BrKind')||{}).value)||'hq', el=$(k+'BrNo');

  function branchValue(k){
    if(((($(k+'BrKind')||{}).value)||'hq')!=='br') return 'สำนักงานใหญ่';

  function moneyShort(n){

  function barChart(items,labelFn,valFn){

    return '<div class="ds-bars">'+items.map(function(x){
      var v=valFn(x), h=max>0?Math.max(2,Math.round(v/max*88)):2;
      return '<div class="ds-bar">'+(v>0?'<div class="bv">'+moneyShort(v)+'</div>':'')+
        '<div class="bar'+(v>0?'':' zero')+'" style="height:'+h+'px"></div>'+

    }).join('')+'</div>';
  }

  var TAX_MONTH='', ML_ALL=[], TAX_FORM='PND3', TAX_ENT='';   // แบบยื่นที่กำลังดู (ภ.ง.ด.1/3/53) · TAX_ENT = บริษัทผู้จ่าย ('' = ทุกบริษัท)

  // ═══════════ VIEW: รอตรวจ (พี่ · งานที่ทีมส่งกลับ รอตรวจก่อนส่งลูกค้า) ═══════════
  function renderReview(){
    if(IS_OWNER){ renderOwnerBoard('review'); return; }   // พี่ → บอร์ดสไตล์เดียวกัน (เฉพาะงานรอตรวจ)

      if(!r||!r.ok){ $('main').innerHTML='<div class="card"><div class="empty">'+esc((r&&r.error)||'โหลดไม่สำเร็จ')+'</div></div>'; return; }
      var ts=(r.tasks||[]).filter(function(t){ return t.status.indexOf('รอตรวจ')>=0; });
      ts.sort(function(a,b){ return (a.dueMs||9e15)-(b.dueMs||9e15); });
      var html=summaryHtml(ts);
      html+= ts.length ? ts.map(reviewCard).join('') : '<div class="card"><div class="emptybox">ไม่มีงานรอตรวจในตอนนี้ 🎉</div></div>';

  function reviewCard(t){

      '<span class="tk-badge b-review">'+esc(t.status)+'</span></div>'+
      '<div class="tk-cust">'+esc(t.customer||'-')+'</div>'+
      (t.detail?'<div class="tk-detail">'+esc(t.detail)+'</div>':'')+

    jsonp({action:'waSendCustomer',uid:UID,no:no}).then(function(r){ if(!r||!r.ok){toast((r&&r.error)||'ส่งไม่สำเร็จ');return;} toast('✅ ส่งให้ลูกค้าแล้ว'); renderReview(); }).catch(function(e){toast(e.message);}); }
  // ── ส่งกลับให้ทีมแก้ไข (พร้อมโน้ตสิ่งที่ต้องแก้) ──
  function openReturn(no){
    modal('<h3>🔁 ส่งกลับให้แก้ไข · '+esc(no)+'</h3><div id="mErr" class="m-err hidden"></div>'+
      '<div class="m-hint">งานจะกลับไปสถานะ 🔵 กำลังทำ + แจ้งผู้รับผิดชอบทาง LINE พร้อมสิ่งที่ต้องแก้</div>'+
      '<div class="fld"><label>สิ่งที่ต้องแก้ไข *</label><textarea id="rNote" placeholder="เช่น แก้สีโลโก้ให้เข้มขึ้น, เพิ่มเบอร์ติดต่อท้ายโพสต์…"></textarea></div>'+

  var DOCTYPES=[], RQ={ type:'', detail:'' };
  function renderDocs(force){
    if(!force && DOCCACHE.data){ DOCTYPES=DOCCACHE.data.types||[]; paintDocs(DOCCACHE.data); if(Date.now()-DOCCACHE.at>INITTTL) _docsFetch(true); return; }
    skel(); _docsFetch(false);
  }
  function _docsFetch(bg){
    jsonp({action:'waDocs', idToken:IDTOKEN, uid:UID}).then(function(r){
      if(!r||!r.ok){ if(!bg) $('main').innerHTML='<div class="card"><div class="empty">'+esc((r&&r.error)||'โหลดไม่สำเร็จ')+'</div></div>'; return; }
      DOCCACHE={at:Date.now(),data:r}; DOCTYPES=r.types||[];
      if(!bg) paintDocs(r);   // bg = รีเฟรชแคชเงียบ ไม่ทับฟอร์มขอเอกสาร
    }).catch(function(e){ if(!bg) $('main').innerHTML='<div class="card"><div class="empty">'+esc(e.message)+'</div></div>'; });
  }
  function paintDocs(r){
    var html='';
    // สลิปเงินเดือน
    html+='<div class="section-h">💵 สลิปเงินเดือน</div>';

      ? '<div class="card"><div class="chip-row">'+r.payslips.map(function(m){

      : '<div class="card"><div class="emptybox">ยังไม่มีสลิปค่ะ</div></div>';

    html+='<div class="section-h">📁 เอกสารของฉัน</div>';
    html+= (r.docs||[]).length
      ? '<div class="card" style="padding:6px 12px">'+r.docs.map(function(d){
          return '<a class="doc-item" href="'+esc(d.link)+'" target="_blank"><span class="di-ic">📄</span>'+
            '<span class="di-main"><b>'+esc(d.title)+'</b>'+(d.at?'<small>'+esc(d.at)+'</small>':'')+'</span>'+
            '<span class="di-go">›</span></a>'; }).join('')+'</div>'
      : '<div class="card"><div class="emptybox">ยังไม่มีเอกสารในคลัง 🙏</div></div>';
    // ขอเอกสารใหม่ (ฟอร์ม)
    html+='<div class="section-h">📝 ขอเอกสารใหม่</div>';
    html+='<div class="card"><div id="rqErr" class="edit-banner hidden" style="background:#fbe7e7;color:#c0392b"></div>'+

      '<label class="field-lb" style="margin-top:12px">รายละเอียด <span style="color:#8A93A3;font-weight:400">(จำเป็นถ้าเลือก "อื่น ๆ")</span></label>'+
      '<textarea id="rqDetail" rows="2" placeholder="ระบุชื่อ/รายละเอียดเอกสาร…"></textarea>'+
      '<div style="margin-top:14px"><button id="btnReq" class="btn btn-primary" style="width:100%">ส่งคำขอ</button></div></div>';
    // ประวัติคำขอ
    html+='<div class="section-h">ประวัติคำขอ</div>';
    html+= (r.reqs||[]).length
      ? '<div class="card" style="padding:6px 12px">'+r.reqs.map(reqItem).join('')+'</div>'
      : '<div class="card"><div class="emptybox">ยังไม่มีคำขอ 😊</div></div>';

  function renderRqTypes(){
    $('rqTypes').innerHTML=DOCTYPES.map(function(t){
      return '<div class="type-opt'+(RQ.type===t.key?' sel':'')+'" data-k="'+esc(t.key)+'" '+
        'style="flex-direction:row;justify-content:flex-start;gap:10px;text-align:left;padding:12px 14px">'+
        '<div class="t-lb">'+esc(t.label)+'</div></div>'; }).join('');

      el.addEventListener('click', function(){ RQ.type=el.dataset.k; renderRqTypes(); }); });

  function reqErr(m){ var e=$('rqErr'); e.textContent='⚠️ '+m; e.classList.remove('hidden'); }
  function submitReq(){
    if(!RQ.type){ reqErr('เลือกประเภทเอกสารก่อนค่ะ'); return; }
    if(RQ.type==='other' && !RQ.detail.trim()){ reqErr('ระบุรายละเอียดเอกสารก่อนค่ะ'); return; }
    toast('กำลังส่งคำขอ…');
    jsonp({action:'waReqDocSubmit', uid:UID, type:RQ.type, detail:RQ.detail.trim()}).then(function(r){

  var BVIEW='list', BTASKS=[], BALL=[], BSCOPE='all', BTEAM=[], BSTATUSES=[], BTYPESLIST=[], BOWNER='', BOWNERUID='', BNOW=0, BCATS=[], BPROJECTS=[];

  function bInRange(t){
    if(BRANGE==='all') return true;

    if(BRANGE==='month')     return ms>=new Date(y,m,1).getTime();
    if(BRANGE==='lastmonth') return ms>=new Date(y,m-1,1).getTime() && ms<new Date(y,m,1).getTime();

  function bStatusOf(sub){ for(var i=0;i<BSTATUSES.length;i++){ if(BSTATUSES[i].indexOf(sub)>=0) return BSTATUSES[i]; } return ''; }
  function bMatchFilter(t){ if(!BFILTER) return true; if(BFILTER==='__over__') return bOver(t); return t.status===BFILTER; }
  function bCustomers(){ var s={},o=[]; BALL.forEach(function(t){ if(t.status.indexOf('ยกเลิก')>=0)return; var c=t.customer||'(ไม่ระบุบริษัท)'; if(!s[c]){s[c]=1;o.push(c);} }); return o; }
  function bMatchProject(t){
    if(!BFPROJECT) return true;

    if(BFPROJECT.indexOf('co:')===0) return (t.customer||'(ไม่ระบุบริษัท)')===BFPROJECT.slice(3);   // กลุ่มไลน์/ลูกค้า

  function bStatCard(cls,lab,num,kind,active){ return '<div class="bd-stat '+cls+(active?' active':'')+'" onclick="bStatFilter(\''+kind+'\')" title="คลิกเพื่อกรอง"><div class="lab">'+lab+'</div><div class="num">'+num+'</div></div>'; }

    function c(sub){ return base.filter(function(t){ return t.status.indexOf(sub)>=0; }).length; }

  function bStatFilter(kind){
    var target = kind==='all' ? '' : kind==='over' ? '__over__'
      : bStatusOf(bKindSub(kind));
    BFILTER = (BFILTER===target) ? '' : target;   // กดซ้ำการ์ดเดิม = ล้างตัวกรอง
    var fs=$('bFStatus'); if(fs) fs.value = (BFILTER && BFILTER!=='__over__') ? BFILTER : '';

  window.bStatFilter=bStatFilter;
  function bVisible(){
    var arr=BTASKS.filter(function(t){
      if(!bInRange(t)) return false;
      if(t.status.indexOf('ยกเลิก')>=0) return false;
      if(!bMatchFilter(t)) return false;
      if(!bMatchProject(t)) return false;
      if(BFCAT && t.category!==BFCAT) return false;
      if(BQ){ var h=(t.no+' '+(t.customer||'')+' '+(t.detail||'')+' '+(t.assignee||'')).toLowerCase(); if(h.indexOf(BQ)<0) return false; }
      return true;
    });
    var stOrder={}; BSTATUSES.forEach(function(s,i){stOrder[s]=i;});
    arr.sort(function(a,b){
      if(BSORT==='customer') return (a.customer||'').localeCompare(b.customer||'','th');
      if(BSORT==='status') return (stOrder[a.status]||0)-(stOrder[b.status]||0);
      if(BSORT==='assignee') return (a.assignee||'zzz').localeCompare(b.assignee||'zzz','th');
      if(BSORT==='no') return (a.no||'').localeCompare(b.no||'');
      return (a.dueMs||9e15)-(b.dueMs||9e15);
    });
    return arr;
  }
  function bBaseScope(){

      if(BQ){ var h=(t.no+' '+(t.customer||'')+' '+(t.detail||'')+' '+(t.assignee||'')).toLowerCase(); if(h.indexOf(BQ)<0) return false; }

    if(c.indexOf('ตามรอบ')>=0)                    return { k:'recur',   color:'#7C3AED', icon:'🔁', label:'งานตามรอบ' };
    if(c.indexOf('สั่ง')>=0 || c.indexOf('งาน')>=0) return { k:'order',   color:'#1B72E8', icon:'📝', label:'แจ้งงาน' };
    return { k:'other', color:'#8A94A6', icon:'📋', label:c||'อื่น ๆ' };
  }

    var byDay={}; arr.forEach(function(t){ if(!t.dueMs)return; var d=new Date(t.dueMs); if(d.getFullYear()===y&&d.getMonth()===m){ var k=d.getDate(); (byDay[k]=byDay[k]||[]).push(t);} });

  // จัดการงาน (modal)
  // ── ลิงก์งานหลายอัน — เก็บ "ชื่อ | url" บรรทัดละอัน (backward: บรรทัดไม่มี | = url ล้วน) ──
  function wlParse(s){
    return String(s||'').split('\n').map(function(ln){
      ln=ln.trim(); if(!ln) return null;
      var i=ln.indexOf('|');
      return i<0 ? {name:'',url:ln} : {name:ln.slice(0,i).trim(),url:ln.slice(i+1).trim()};
    }).filter(function(x){ return x && x.url; });
  }
  function wlNorm(u){ u=String(u||'').trim(); if(!u) return ''; if(/^https?:\/\//i.test(u)) return u; if(u.indexOf(' ')<0 && /^[\w.-]+\.[a-z]{2,}(\/.*)?$/i.test(u)) return 'https://'+u; return ''; }
  function wlLinksHtml(s){
    var a=wlParse(s); if(!a.length) return '';
    return a.map(function(it){ var u=wlNorm(it.url);
      return u ? '<a href="'+esc(u)+'" target="_blank" style="word-break:break-all">🔗 '+esc(it.name||it.url)+'</a>'
               : '🔗 '+esc((it.name?it.name+': ':'')+it.url); }).join('<br>');
  }
  function wlClinksHtml(s){
    return wlParse(s).map(function(it){ var u=wlNorm(it.url); if(!u) return '';
      return '<a class="bd-clink" href="'+esc(u)+'" target="_blank" onclick="event.stopPropagation()">🔗 '+esc(it.name||'เปิดลิงก์งาน / เอกสาร')+'</a>'; }).join('');
  }
  function wlRowHtml(it){
    it=it||{name:'',url:''};
    return '<div class="wl-row" style="display:flex;gap:6px;margin-bottom:6px;align-items:center">'+
      '<input class="wl-name" placeholder="ชื่อ" value="'+esc(it.name||'')+'" style="flex:0 0 27%;width:auto;min-width:0;padding:9px 8px">'+
      '<input class="wl-url" placeholder="https://…" value="'+esc(it.url||'')+'" style="flex:1 1 0;width:auto;min-width:0;padding:9px 8px">'+
      '<button type="button" onclick="wlDelRow(this)" style="flex:0 0 34px;width:34px;height:38px;padding:0;border:1.5px solid var(--line);border-radius:8px;background:#fff;color:#DC2626;font-size:15px;line-height:1;cursor:pointer">✕</button></div>';
  }
  function wlRowsHtml(s){ var a=wlParse(s); if(!a.length) a=[{name:'',url:''}]; return a.map(wlRowHtml).join(''); }
  function wlAddRow(){ var b=$('mWlBox'); if(b) b.insertAdjacentHTML('beforeend', wlRowHtml()); }
  function wlDelRow(btn){ var r=btn.parentNode; if(r&&r.parentNode) r.parentNode.removeChild(r); }
  function wlCollect(){
    var out=[]; Array.prototype.forEach.call(document.querySelectorAll('#mWlBox .wl-row'),function(r){
      var url=r.querySelector('.wl-url').value.trim(); if(!url) return;
      var nm=r.querySelector('.wl-name').value.trim(); out.push(nm?(nm+' | '+url):url);
    }); return out.join('\n');
  }

      (t.detail?'<div class="fld"><label>รายละเอียด</label><div style="white-space:pre-wrap;font-size:14px;color:#4A5262">'+esc(t.detail)+'</div></div>':'')+

      '<button class="btn btn-ghost" onclick="closeModal()">ปิด</button></div>'+

      (!bDone(t)&&t.status.indexOf('ยกเลิก')<0?'<button class="btn btn-ghost" style="width:100%;margin-top:8px" onclick="bOpenReturn(\''+esc(no)+'\')">🔁 ส่งกลับให้ทีมแก้ไข</button>':'')+
      (IS_OWNER&&t.status.indexOf('ยกเลิก')<0?'<button class="btn btn-ghost" style="width:100%;margin-top:8px;color:#DC2626" onclick="bOpenCancel(\''+esc(no)+'\')">❌ ยกเลิกงาน</button>':''));   // กฎเหล็ก: ยกเลิก=ลบ → พี่เท่านั้น

  function bSaveTask(no){
    var t=bFind(no); if(!t) return;
    var title=$('mTitle').value.trim(), st=$('mStatus').value, asg=$('mAsg').value, rev=$('mRev').value, cat=$('mCat').value, due=$('mDue').value;
    var jobs=[];
    if(title!==(t.title||'')) jobs.push(jsonp({action:'waSetTitle',uid:UID,no:no,title:title}));
    if(st!==t.status) jobs.push(jsonp({action:'waSetStatus',uid:UID,no:no,status:st}));
    if(asg!==(t.assigneeUid||'')) jobs.push(jsonp({action:'waAssign',uid:UID,no:no,name:asg||' '}));   // ส่ง uid (' ' = ล้าง)
    if(rev!==(t.reviewerUid||'')) jobs.push(jsonp({action:'waSetReviewer',uid:UID,no:no,reviewer:rev||' '}));
    if(bCat(cat).k!==bCat(t.category).k) jobs.push(jsonp({action:'waSetCategory',uid:UID,no:no,category:cat}));   // เทียบด้วย key (สั่งงาน↔แจ้งงาน = ไม่เปลี่ยน)
    var curDue=t.dueMs?bIso(t.dueMs):'';
    if(due!==curDue) jobs.push(jsonp({action:'waSetDue',uid:UID,no:no,due:due}));
    var pj=$('mProject')?$('mProject').value:(t.project||'');
    if(pj!=='__new__' && pj!==(t.project||'')) jobs.push(jsonp({action:'waAssignProject',uid:UID,no:no,pid:pj}));   // จัดงานเข้า/ออก project
    var cust=$('mCust')?$('mCust').value.trim():(t.customer||''); if(cust!==(t.customer||'')) jobs.push(jsonp({action:'waSetCustomer',uid:UID,no:no,customer:cust}));   // ทีม+พี่ แก้ลูกค้าได้
    var wl=wlCollect(); if(wl!==String(t.worklink||'').trim()) jobs.push(jsonpPost({action:'waSetWorkLink',uid:UID,no:no,worklink:wl}));   // POST กันลิงก์หลายอันยาวเกิน URL
    if(!jobs.length){ closeModal(); return; }
    toast('กำลังบันทึก…');
    Promise.all(jobs).then(function(){ closeModal(); toast('บันทึกแล้ว ✅'); renderOwnerBoard(BSCOPE, true); }).catch(function(e){ mErr(e.message); });
  }

  function bDoNewProject(no){
    var name=$('npName').value.trim();
    if(!name){ mErr('กรอกชื่อ project ก่อนค่ะ'); return; }
    toast('กำลังสร้าง project…');
    jsonp({action:'waProjectSave',uid:UID,id:'',name:name}).then(function(r){
      if(!r||!r.ok||!r.id) throw new Error((r&&r.error)||'สร้างไม่สำเร็จ');
      return jsonp({action:'waAssignProject',uid:UID,no:no,pid:r.id});
    }).then(function(r2){
      if(!r2||!r2.ok) throw new Error((r2&&r2.error)||'จัดงานเข้าไม่สำเร็จ');
      closeModal(); toast('✅ สร้าง + จัดงาน '+no+' เข้า project แล้ว'); renderOwnerBoard(BSCOPE, true);
    }).catch(function(e){ mErr(e.message); });
  }
  // สร้าง project เปล่า (จากการ์ด "สร้าง Project")
  function bNewProject(){
    modal('<h3>➕ สร้าง Project</h3><div id="mErr" class="m-err hidden"></div>'+
      '<div class="fld"><label>ชื่อ Project</label><input id="npName" placeholder="เช่น ปิดบัญชี Q3, งานอีเวนต์ลูกค้า A"></div>'+
      '<div class="fld"><label>ลูกค้า <span class="bd-age">(ถ้ามี · เว้นว่างได้ · เลือก/พิมพ์)</span></label><input id="npCust" list="dlNpCust" autocomplete="off" placeholder="เลือกหรือพิมพ์ชื่อลูกค้า">'+custDatalist('dlNpCust')+'</div>'+
      '<div class="m-hint">สร้างแล้วไปจัดงานเข้า project นี้ได้ที่การ์ดงาน (📁 จัดเข้า Project) หรือกรองดูจากตัวกรอง Project</div>'+
      '<div class="m-act"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button>'+
      '<button class="btn btn-primary" onclick="bDoCreateProject()">สร้าง Project</button></div>');
  }
  function bDoCreateProject(){
    var name=$('npName').value.trim();
    if(!name){ mErr('กรอกชื่อ project ก่อนค่ะ'); return; }
    toast('กำลังสร้าง project…');
    jsonp({action:'waProjectSave',uid:UID,id:'',name:name,customer:$('npCust').value.trim()}).then(function(r){
      if(!r||!r.ok){ mErr((r&&r.error)||'สร้างไม่สำเร็จ'); return; }
      closeModal(); toast('✅ สร้าง project แล้ว'); renderOwnerBoard(BSCOPE, true);
    }).catch(function(e){ mErr(e.message); });
  }
  function bSendCust(no){
    toast('กำลังส่งให้ลูกค้า…');
    jsonp({action:'waSendCustomer',uid:UID,no:no}).then(function(r){ if(!r||!r.ok){ mErr((r&&r.error)||'ส่งไม่สำเร็จ'); return; } closeModal(); toast('✅ ส่งให้ลูกค้าแล้ว'); renderOwnerBoard(BSCOPE, true); }).catch(function(e){ mErr(e.message); });
  }
  function bOpenReturn(no){
    modal('<h3>🔁 ส่งกลับให้แก้ไข · '+esc(no)+'</h3><div id="mErr" class="m-err hidden"></div>'+
      '<div class="m-hint">งานจะกลับไปสถานะ 🔵 กำลังทำ + แจ้งผู้รับผิดชอบทาง LINE พร้อมสิ่งที่ต้องแก้</div>'+
      '<div class="fld"><label>สิ่งที่ต้องแก้ไข *</label><textarea id="rNote" placeholder="เช่น แก้สีโลโก้ให้เข้มขึ้น, เพิ่มเบอร์ท้ายโพสต์…"></textarea></div>'+
      '<div class="m-act"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button>'+
      '<button class="btn btn-primary" onclick="bDoReturn(\''+esc(no)+'\')">🔁 ส่งกลับแก้ไข</button></div>');
  }
  function bDoReturn(no){
    var note=$('rNote').value.trim();
    if(!note){ mErr('ระบุสิ่งที่ต้องแก้ไขก่อนค่ะ'); return; }
    toast('กำลังส่งกลับ…');
    jsonpPost({action:'waTaskReturn',uid:UID,no:no,note:note}).then(function(r){
      if(!r||!r.ok){ mErr((r&&r.error)||'ส่งกลับไม่สำเร็จ'); return; }
      closeModal(); toast('🔁 ส่งกลับให้ '+(r.assignee||'ทีม')+' แก้ไขแล้ว'); renderOwnerBoard(BSCOPE, true);

  // โอนงาน (บอร์ด owner) — เลือกคนใหม่ → waAssign (แจ้ง LINE คนใหม่อัตโนมัติ)
  function bOpenTransfer(no){
    var t=bFind(no); if(!t) return;
    var opts=memOpts(BTEAM, '', '— เลือกคนรับงาน —', t.assigneeUid);   // ตัดคนที่ถืออยู่ออก (โอนให้คนอื่น)
    modal('<h3>🔄 โอนงาน '+esc(no)+'</h3><div id="mErr" class="m-err hidden"></div>'+
      '<div class="m-hint">เลือกคนรับงานใหม่ → ระบบเปลี่ยนผู้รับผิดชอบ + แจ้ง LINE ให้เขาทันที</div>'+
      '<div class="fld"><label>โอนให้</label><select id="mtAsg">'+opts+'</select></div>'+
      '<div class="m-act"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button>'+
      '<button class="btn btn-primary" onclick="bDoTransfer(\''+esc(no)+'\')">🔄 โอนงาน</button></div>');
  }
  function bDoTransfer(no){
    var name=$('mtAsg').value;
    if(!name){ mErr('เลือกคนรับงานก่อนค่ะ'); return; }
    toast('กำลังโอนงาน…');
    jsonp({action:'waAssign',uid:UID,no:no,name:name}).then(function(r){
      if(!r||!r.ok){ mErr((r&&r.error)||'โอนไม่สำเร็จ'); return; }
      closeModal(); toast('🔄 โอนงานให้ '+(r.assignee||name)+' แล้ว'+(r.notified?' (แจ้ง LINE ให้)':'')); renderOwnerBoard(BSCOPE, true);
    }).catch(function(e){ mErr(e.message); });
  }
  // ยกเลิกงาน (บอร์ด owner) — ยืนยันในหน้า (เลี่ยง confirm() ที่ LIFF บล็อก) → waCancel
  function bOpenCancel(no){
    modal('<h3>❌ ยกเลิกงาน '+esc(no)+'</h3><div id="mErr" class="m-err hidden"></div>'+
      '<div class="m-hint">งานจะถูกตั้งสถานะเป็น ❌ ยกเลิก และไม่นับในสรุป · ย้อนได้ภายหลังโดยเปลี่ยนสถานะกลับ</div>'+
      '<div class="m-act"><button class="btn btn-ghost" onclick="closeModal()">ไม่ยกเลิก</button>'+
      '<button class="btn btn-danger" onclick="bDoCancel(\''+esc(no)+'\')">❌ ยืนยันยกเลิกงาน</button></div>');
  }
  function bDoCancel(no){
    toast('กำลังยกเลิก…');
    jsonp({action:'waCancel',uid:UID,no:no}).then(function(r){
      if(!r||!r.ok){ mErr((r&&r.error)||'ยกเลิกไม่สำเร็จ'); return; }
      closeModal(); toast('❌ ยกเลิกงาน '+no+' แล้ว'); renderOwnerBoard(BSCOPE, true);
    }).catch(function(e){ mErr(e.message); });
  }
  // รายชื่อลูกค้าสำหรับ datalist — รวมจากชีตกลุ่มลูกค้า (CUSTOMERS) + บริษัท auto (COMPANIES) + บริษัทที่มีงานอยู่ (BALL) · dedupe + เรียง
  function custOptions(){
    var set={}, out=[];
    function add(a){ (a||[]).forEach(function(c){ c=String(c||'').trim(); if(c && !set[c]){ set[c]=1; out.push(c); } }); }
    add(CUSTOMERS); add(COMPANIES);
    try{ add(bCustomers()); }catch(e){}
    return out.sort(function(a,b){ return a.localeCompare(b,'th'); });
  }
  function custDatalist(id){ return '<datalist id="'+id+'">'+custOptions().map(function(c){ return '<option value="'+esc(c)+'">'; }).join('')+'</datalist>'; }
  function bOpenCreate(){
    var asgOpts=memOpts(BTEAM, '', '— ยังไม่มอบหมาย —');
    var catOpts=BCATS_EDIT.map(function(o){return '<option value="'+esc(o.v)+'">'+o.lb+'</option>';}).join('');
    var pjOpts='<option value="">— ไม่ผูก project —</option>'+BPROJECTS.map(function(pp){return '<option value="'+esc(pp.id)+'">📁 '+esc(pp.name)+'</option>';}).join('');
    modal('<h3>+ เปิดงานใหม่</h3><div id="mErr" class="m-err hidden"></div>'+
      '<div class="fld"><label>ประเภท <span class="bd-age">(กำหนดสีการ์ด)</span></label><select id="cbCat">'+catOpts+'</select></div>'+
      '<div class="fld"><label>หัวข้องาน <span class="bd-age">(เว้นว่าง = ตัดจากรายละเอียด)</span></label><input id="cbTitle" placeholder="หัวข้อสั้น ๆ"></div>'+
      '<div class="fld"><label>ลูกค้า/บริษัท <span class="bd-age">(เลือกจากรายชื่อ หรือพิมพ์ใหม่)</span></label><input id="cbCust" list="dlCbCust" autocomplete="off" placeholder="เลือกหรือพิมพ์ชื่อลูกค้า">'+custDatalist('dlCbCust')+'</div>'+
      '<div class="fld"><label>📁 จัดเข้า Project <span class="bd-age">(ไม่บังคับ · กองงานเป็นกลุ่ม)</span></label><select id="cbProject">'+pjOpts+'</select></div>'+
      '<div class="fld"><label>รายละเอียดงาน</label><textarea id="cbDetail" placeholder="สิ่งที่ต้องทำ…"></textarea></div>'+
      '<div class="fld"><label>ผู้รับผิดชอบ</label><select id="cbAsg">'+asgOpts+'</select></div>'+
      '<div class="fld"><label>กำหนดเสร็จ</label><input id="cbDue" type="date"></div>'+
      '<div class="m-act"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button>'+
      '<button class="btn btn-primary" onclick="bCreateTask()">สร้างงาน</button></div>');
  }
  function bCreateTask(){
    var cust=$('cbCust').value.trim(), detail=$('cbDetail').value.trim();
    if(!cust && !detail){ mErr('กรอกลูกค้าหรือรายละเอียดอย่างน้อย 1 ช่อง'); return; }
    toast('กำลังเปิดงาน…');
    callBusy('กำลังสร้างงาน…', jsonpPost({action:'waCreateTask',uid:UID,title:$('cbTitle').value.trim(),customer:cust,detail:detail,category:$('cbCat').value,assignee:$('cbAsg').value,due:$('cbDue').value,project:($('cbProject')?$('cbProject').value:'')})).then(function(r){
      if(!r||!r.ok){ mErr((r&&r.error)||'สร้างไม่สำเร็จ'); return; } closeModal(); toast('เปิดงานใหม่แล้ว '+(r.no||'')); renderOwnerBoard(BSCOPE, true);
    }).catch(function(e){ mErr(e.message); });
  }
  window.bSetView=bSetView; window.bCalMove=bCalMove; window.bOpenTask=bOpenTask; window.bSaveTask=bSaveTask;
  window.bSendCust=bSendCust; window.bOpenReturn=bOpenReturn; window.bDoReturn=bDoReturn; window.bOpenCreate=bOpenCreate; window.bCreateTask=bCreateTask;
  window.bOpenTransfer=bOpenTransfer; window.bDoTransfer=bDoTransfer;
  window.bOpenCancel=bOpenCancel; window.bDoCancel=bDoCancel;

  // ───── init ─────
  // รวม param จาก query ตรง + liff.state (LIFF บางครั้งห่อ query เดิมไว้ใน liff.state)
  function allParams(){
    var out={};
    try{
      var sp=new URLSearchParams(location.search);
      sp.forEach(function(v,k){ out[k]=v; });
      var st=sp.get('liff.state');
      if(st){ var inner=new URLSearchParams(st.charAt(0)==='?'?st.slice(1):st);
        inner.forEach(function(v,k){ if(out[k]==null) out[k]=v; }); }
    }catch(e){}
    return out;
  }
  function startParam(){ return String(allParams().p||'').toLowerCase(); }
  function uidOverride(){ try{ return new URLSearchParams(location.search).get('uid')||''; }catch(e){ return ''; } }
  function start(){
    jsonp({action:'waBootstrap', uid:UID}).then(function(r){
      if(!r||!r.ok){ fatal((r&&r.error)||'โหลดข้อมูลไม่สำเร็จ'); return; }
      NICK=r.nick||''; if(NICK){ $('hdSub').textContent=NICK; }
      MEUID=r.uid||UID||MEUID;   // userId ผู้ใช้ (ใช้กรอง "งานของฉัน" + ตัดตัวเองจาก dropdown)
      IS_OWNER=!!r.isOwner;
      if(IS_OWNER){ var nr=$('navReview'); if(nr) nr.style.display='';      // แท็บรอตรวจ = เฉพาะพี่/ผู้ตรวจ
        var nel=$('navExpDashLabel'); if(nel) nel.textContent='สรุป/อนุมัติเบิก';   // พี่: หน้าสรุปรวมอนุมัติเบิกแล้ว (ตัดแท็บอนุมัติแยก)
        var nb=$('navReimb'); if(nb) nb.style.display='';                 // แท็บตั้งเบิกลูกค้า = เฉพาะพี่
        var na=$('navAppr'); if(na) na.style.display='';                  // แท็บอนุมัติลา (+ยื่นลาแทน) = เฉพาะพี่/HR
        var noa=$('navOtAppr'); if(noa) noa.style.display='';              // แท็บอนุมัติ OT = เฉพาะพี่/HR
        var nhr=$('navHrReport'); if(nhr) nhr.style.display='';            // รายงาน HR = เฉพาะพี่/HR (ข้อมูลทั้งทีม)
        var npt=$('navPetty'); if(npt) npt.style.display='';               // 💵 เงินสดย่อย = พี่คนเดียว (backend pettyGate_ กันซ้ำอีกชั้น)
        var npo=$('navPayout'); if(npo) npo.style.display='';               // 💵 จ่ายออก = พี่คนเดียว (รวมข้อมูลบริษัทลูกค้า)
        var nbd=$('navBizDash'); if(nbd) nbd.style.display='';             // 📊 ภาพรวมธุรกิจ = พี่/HR
        var nsl=$('navSales'); if(nsl) nsl.style.display='';               // 💰 รายรับ (ฝั่งขาย) = พี่/HR
        var nar=$('navAr'); if(nar) nar.style.display='';                   // 📊 ลูกหนี้ค้างรับ = พี่/HR
        var nsr=$('navSalesReport'); if(nsr) nsr.style.display='';           // 📊 รายงานรายรับ = พี่/HR
        var npr=$('navPoReport'); if(npr) npr.style.display='';           // 📊 รายงานจ่ายออก = พี่คนเดียว (backend poGate_ กันซ้ำอีกชั้น)
        var n51=$('navPnd51'); if(n51) n51.style.display=''; }              // 📐 ภ.ง.ด.51 = พี่คนเดียว (backend pnd51Gate_ กันซ้ำอีกชั้น)           // 📊 รายงานจ่ายออก = พี่คนเดียว (backend poGate_ กันซ้ำอีกชั้น)
      // รายงานการเงินรวม = พี่ + HR ที่ตั้งใน Script Property (backend ตัดสิน ไม่ผูกกับ IS_OWNER)
      CAN_FIN=!!r.canFinance;
      if(CAN_FIN){ var nfr=$('navFinReport'); if(nfr) nfr.style.display=''; }
      navApplyRole();     // จัดหมวดตามสิทธิ์ (พนักงาน: สรุปค่าใช้จ่าย → หมวดส่วนตัว)
      buildNavGroups();   // จัดกลุ่ม sidebar (ต้องรู้ IS_OWNER ก่อน — กลุ่มของผู้ดูแลจะไม่โผล่ให้พนักงาน)
        // navTaxDoc (ภาษี/เอกสาร) ซ่อนไว้ก่อน — เปิดตอน v2 (ภ.ง.ด.1/3/53) เสร็จ
      $('loader').classList.add('hidden'); $('app').classList.remove('hidden');
      Array.prototype.forEach.call(document.querySelectorAll('.nav-btn'), function(b){
        b.addEventListener('click', function(){ switchView(b.dataset.view); }); });
      var sp=startParam();
      // ลิงก์จาก Google Chat/แชท → เปิดแท็บตรง · ไม่มี p= → หน้า "ภาพรวม" (พี่กี้เคาะ 29 ก.ค.)
      // ⚠️ p=work = ปุ่ม "เปิดระบบ" (Rich Menu/การ์ดแชท) เจตนา "เข้าระบบ" ไม่ใช่ "ไปบอร์ดงาน" → หน้าภาพรวม
      //    (Rich Menu ที่ทีมมีอยู่ฝัง p=work ไว้แล้ว · เข้าบอร์ดงานตรงใช้ p=projects/p=tasks)
      // 'reports' = ชื่อเดิมของหน้ารายงาน (ก่อนแยก HR/การเงิน) — คงรับไว้ให้ลิงก์เก่าเปิดได้
      var spv = sp==='reports' ? 'hrreport' : sp;
      var startView = spv==='docs' ? 'docs' : ((spv==='projects'||spv==='tasks') ? 'projects' : (spv==='expense' ? 'expense' :
        (spv==='leave' ? 'leave' : ((spv==='approve'||spv==='expapprove'||spv==='hrreport'||spv==='finreport') && IS_OWNER ? spv : 'home'))));
      switchView(startView);   // switchView → mSyncNav สร้างเมนูกลุ่มล่าง + แท็บบนให้เอง
      // อุ่นแคชเบื้องหลัง → คลิกการลา/เอกสารครั้งแรกเด้งทันที (ไม่แย่งจอแรกโหลด)
      setTimeout(function(){ if(!LVCACHE.data) _leaveFetch(true); if(IDTOKEN && !DOCCACHE.data) _docsFetch(true); if(!APPT_CUST.length) apFetchMeta(); if(!ANNOUNCE_GROUPS.length) anFetchGroups(); }, 900);
    }).catch(function(e){ fatal(e.message); });
  }
  (function init(){
    // Face Scan: LIFF endpoint ชี้มาที่ user-app → เด้งต่อไปหน้าสแกนหน้า/ลงทะเบียน (คง kind)
    var _pp=allParams(), _p=String(_pp.p||'').toLowerCase();
    if(_p==='clock'||_p==='face'||_p==='face-clock'||_p==='enroll'||_p==='face-enroll'){
      var _t=(_p==='enroll'||_p==='face-enroll') ? 'face-enroll.html' : 'face-clock.html';
      location.replace(_t + (_pp.kind ? '?kind='+encodeURIComponent(_pp.kind) : '')); return;
    }
    var ov=uidOverride();
    if(ov){ UID=ov; start(); return; }
    liff.init({liffId:LIFF_ID}).then(function(){
      if(!liff.isLoggedIn()){ liff.login({redirectUri:location.href}); return; }
      try{ IDTOKEN=liff.getIDToken()||''; }catch(e){ IDTOKEN=''; }
      return liff.getProfile().then(function(pf){ UID=pf.userId;
        if(pf.pictureUrl){ $('avatar').innerHTML='<img src="'+pf.pictureUrl+'" alt="">'; $('tbAvatar').innerHTML='<img src="'+pf.pictureUrl+'" alt="">'; }
        start(); });
    }).catch(function(e){ fatal('เปิดผ่านไลน์ไม่สำเร็จ: '+(e.message||e)); });
  })();
</script>
