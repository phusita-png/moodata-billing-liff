<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moodata</title>
</head>
<body style="font-family:sans-serif;text-align:center;padding-top:40vh;color:#1B72E8">
  กำลังเปิด…
  <script>
    // Router LIFF อันเดียว — endpoint = โฟลเดอร์รากนี้
    // เปิดผ่าน liff.line.me/{id}?p=<page>&... → redirect ไปหน้าจริง (คง query ที่เหลือ)
    (function () {
      var q = new URLSearchParams(location.search);
      var p = (q.get('p') || 'team-app').toLowerCase();
      var MAP = {
        // งาน + ข้อมูลส่วนตัว → เว็บแอปทีมตัวใหม่ (SPA สไตล์ดิเอลฟ์)
        'home': 'user-app.html',   // ปุ่ม "เปิดระบบ" (Rich Menu/การ์ดแชท) → หน้าภาพรวม
        'team': 'user-app.html', 'team-app': 'user-app.html', 'work': 'user-app.html',
        'me': 'user-app.html', 'user': 'user-app.html', 'personal': 'user-app.html',
        'oldteam': 'team-app.html',   // ของเดิม (เครื่องมือ owner: ภาพรวม/อนุมัติ) เผื่อเรียกใช้
        'appt': 'appointment.html', 'appointment': 'appointment.html',
        'board': 'board.html',
        // Face Scan เฟส 2.1 — ลงทะเบียนใบหน้า / ลงเวลาสแกนหน้า
        'enroll': 'face-enroll.html', 'face-enroll': 'face-enroll.html',
        'clock': 'face-clock.html', 'face-clock': 'face-clock.html', 'face': 'face-clock.html'
      };
      var target = MAP[p] || 'user-app.html';
      // คง p ไว้ให้หน้าปลายทางอ่านต่อ (user-app ใช้เลือก view เริ่ม) [v3]
      // cache-bust แบบ "ช่วง 10 นาที" ไม่ใช่ Date.now() —
      //   Date.now() ทำให้ URL ไม่ซ้ำเลย → เบราว์เซอร์ต้องโหลด user-app.html (~370KB) ใหม่ทุกครั้งที่เปิด
      //   ช่วง 10 นาที = เปิดซ้ำในช่วงเดิมใช้ไฟล์ในแคช (0 byte) · ได้รุ่นใหม่ช้าสุด 10 นาที
      //   (เท่ากับ max-age ของ GitHub Pages เอง → ไม่ทำให้ของใหม่มาช้าลงกว่าเดิม)
      var rest = q.toString();
      var bucket = Math.floor(Date.now() / 600000);   // 600000 ms = 10 นาที
      location.replace(target + '?v=' + bucket + (rest ? '&' + rest : ''));
    })();
  </script>
</body>
</html>
